<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1C1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="불씨">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>불씨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 화로 하나. 맨 위 불꽃은 오늘 한 만큼 커지고, 영역(운동·공부·신앙·생활) 버튼을 누르면 장작이 들어간다. 하기 싫은 날은 '충전'으로 내 이유·내 목소리·지난 승리·5분 타이머를 차례로 본다. 아래 탭: 오늘·충전·영역·녹음·기록. */
:root{
  --bg:#F3F0EC; --card:#FFFDFA; --sunk:#E8E3DD; --line:#DCD4CB; --ink:#211A15; --mute:#6B5F55; --faint:#9B8F84;
  --ember:#D9661E; --ember-soft:#F8E1D0; --on-ember:#FFFFFF; --gold:#C28A1A; --ok:#2E8A5E; --ok-soft:#D9EEE2; --warn:#B23B33;
  --hearth:#241C17; --on-hearth:#F6EFE8;
  --f-disp:"Black Han Sans","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141110; --card:#1D1916; --sunk:#27211D; --line:#352D27; --ink:#F1EAE3; --mute:#ADA197; --faint:#7A6F66;
  --ember:#F08A3E; --ember-soft:#3D2414; --on-ember:#160D07; --gold:#E6B24C; --ok:#6FCB98; --ok-soft:#173424; --warn:#F08A80;
  --hearth:#0F0C0A; --on-hearth:#F6EFE8; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141110; --card:#1D1916; --sunk:#27211D; --line:#352D27; --ink:#F1EAE3; --mute:#ADA197; --faint:#7A6F66;
  --ember:#F08A3E; --ember-soft:#3D2414; --on-ember:#160D07; --gold:#E6B24C; --ok:#6FCB98; --ok-soft:#173424; --warn:#F08A80;
  --hearth:#0F0C0A; --on-hearth:#F6EFE8; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:18px;font-weight:700}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-block:12px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:8px}
.top .ttl{font-family:var(--f-disp);font-size:22px;letter-spacing:.02em}
.top .sp{flex:1}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}
.pill.on{border-color:var(--ember);color:var(--ember)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.lbl{font-size:12px;letter-spacing:.05em;color:var(--mute);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.help{font-size:13.5px;color:var(--mute);margin:0}
.help b{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:500}
.btn.pri{background:var(--ember);border-color:var(--ember);color:var(--on-ember);font-weight:700}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-ember);font-weight:700}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.big{padding:15px 16px;font-size:17px;border-radius:14px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.txt{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;color:inherit}
textarea.txt{resize:vertical;min-height:70px;line-height:1.55}
/* 화로 */
.hearth{background:var(--hearth);color:var(--on-hearth);border-radius:20px;padding:16px 16px 14px;position:relative;overflow:hidden;display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.hearth::after{content:"";position:absolute;left:-30px;bottom:-60px;width:220px;height:160px;background:radial-gradient(closest-side,rgba(240,138,62,var(--glow,.25)),transparent);pointer-events:none}
.flame{width:120px;height:140px;position:relative;z-index:1}
.flame svg{width:100%;height:100%;overflow:visible}
.fl{transform-origin:60px 128px;animation:flick 1.6s ease-in-out infinite alternate}
.fl.b{animation-duration:1.1s;animation-delay:-.4s}
@keyframes flick{0%{transform:scale(var(--s,1)) skewX(-2deg)}50%{transform:scale(calc(var(--s,1)*1.04),calc(var(--s,1)*.97)) skewX(2deg)}100%{transform:scale(calc(var(--s,1)*.97),calc(var(--s,1)*1.03)) skewX(-1deg)}}
@media (prefers-reduced-motion:reduce){.fl{animation:none}}
.hearth .info{position:relative;z-index:1;min-width:0}
.hearth .lv{font-size:12px;opacity:.7;letter-spacing:.06em}
.hearth .big{font-family:var(--f-disp);font-size:30px;line-height:1.15;margin:2px 0 6px}
.hearth .st{display:flex;gap:14px;font-size:12.5px;opacity:.85;flex-wrap:wrap}
.hearth .st b{font-size:17px;font-variant-numeric:tabular-nums;display:block;opacity:1}
/* 영역 버튼 */
.doms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dom{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 12px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.dom .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px}
.dom .nm i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.dom small{color:var(--mute);font-size:12px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dom .cnt{position:absolute;right:10px;top:10px;font-size:12px;font-weight:700;color:var(--c)}
.dom.lit{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card))}
.promise{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.promise:last-child{border-bottom:0}
.promise .ck{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);background:transparent;flex:none;padding:0;color:var(--on-ember);font-size:15px}
.promise .ck.on{background:var(--ok);border-color:var(--ok)}
.promise .tx{flex:1;min-width:0;font-size:14.5px}
.promise .tx small{display:block;font-size:11.5px;color:var(--c);font-weight:700}
.nope{background:var(--ember-soft);border:1.5px solid var(--ember);color:var(--ember);border-radius:16px;padding:14px;font-weight:700;font-size:16px;width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}
.quote{font-size:16.5px;font-weight:700;line-height:1.6;margin:0}
.quote cite{display:block;font-weight:400;font-style:normal;font-size:12.5px;color:var(--mute);margin-top:6px}
/* 충전 */
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--sunk)}
.steps i.on{background:var(--ember)}
.why{font-size:17px;font-weight:700;padding:10px 0;border-bottom:1px dashed var(--line);line-height:1.5}
.why:last-child{border-bottom:0}
.timer{font-family:var(--f-disp);font-size:68px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0}
.ring{width:220px;max-width:100%;aspect-ratio:1;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.win{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.win:last-child{border-bottom:0}
.win small{color:var(--mute);font-size:12px;display:block}
/* 영역 */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:12.5px;font-weight:700;color:var(--mute)}
.li{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.li:last-child{border-bottom:0}
.li span{flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--faint);padding:0 4px;font-size:12.5px;white-space:nowrap}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow .txt{flex:1;min-width:0}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sug button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--ember));border-radius:inherit}
.rw{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
.rw .n{font-weight:700;font-variant-numeric:tabular-nums;width:48px;flex:none;color:var(--mute);font-size:13px}
.rw .t{flex:1;min-width:0}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.ready{background:var(--ember);color:var(--on-ember)}
.tag.no{background:var(--sunk);color:var(--mute)}
/* 녹음 */
.rec{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .t{flex:1;min-width:0}
.rec .t b{display:block;font-size:14.5px}
.rec .t small{color:var(--mute);font-size:12px}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--ember);color:var(--on-ember);flex:none;font-size:14px;padding:0}
video.pv{width:100%;max-height:52vh;border-radius:14px;background:#000;display:block;object-fit:cover}
video.pv.mirror{transform:scaleX(-1)}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--warn);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
/* 기록 */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}
.heat i{width:100%;min-width:12px;aspect-ratio:1;border-radius:3px;background:var(--sunk);display:block}
.heat i.l1{background:color-mix(in srgb,var(--ember) 35%,var(--sunk))}.heat i.l2{background:color-mix(in srgb,var(--ember) 65%,var(--sunk))}.heat i.l3{background:var(--ember)}
.heat i.td{outline:2px solid var(--ink);outline-offset:-2px}
.stat4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat4 div{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mute)}
.stat4 b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.log{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.log:last-child{border-bottom:0}
.log .mk{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:7px;flex:none}
.log .tx{flex:1;min-width:0}
.log .tx small{display:block;color:var(--mute);font-size:12px}
.segs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.segs::-webkit-scrollbar{display:none}
/* tabs, dialog */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center;gap:2px}
nav.tabs button{flex:1;max-width:120px;border:0;background:none;border-radius:10px;padding:6px 0;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ember);font-weight:700}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,7,5,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.overlay{align-items:center}}
.dialog{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
.dialog h3{font-size:19px;margin-bottom:6px}
.acts2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:90;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span class="ttl">불씨</span><span class="sp"></span><button class="pill" id="wakeBtn" aria-pressed="true">화면 켜둠</button></header>
  <main id="view" style="display:flex;flex-direction:column;gap:14px"></main>
</div>
<nav class="tabs" id="tabs" aria-label="화면">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.4 1.2-3.8 2.3-5 .3 1.6 1 2.6 2 3 0-3 .2-5.5.7-8z"/></svg>오늘</button>
  <button data-v="charge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></svg>충전</button>
  <button data-v="doms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>영역</button>
  <button data-v="studio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>녹음</button>
  <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>기록</button>
</nav>
<div id="ovl"></div>
<div class="toast" id="toast" hidden></div>
<script>
/* ================= 불씨 · 셀프 동기부여 ================= */
const KEY='bulssi-v1';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const today=()=>ymd(Date.now());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtT=s=>`${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;
let toastT;function toast(m,ms=2600){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms);}
function dialog(html,bind,onClose){$('ovl').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`;const ov=$('ovl').firstChild;ov._close=onClose;ov.onclick=e=>{if(e.target===ov||e.target.hasAttribute('data-close'))closeDialog();};bind&&bind(ov);}
function closeDialog(){const ov=$('ovl').firstChild;if(ov&&ov._close)try{ov._close();}catch(e){}$('ovl').innerHTML='';}
function armed(btn,label,fn){if(btn.dataset.arm){fn();return;}btn.dataset.arm=1;const old=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.textContent=old;}},3000);}

/* ---------- 내용 ---------- */
const PALETTE=['#D9661E','#2F7FB0','#7A5AA6','#2E8A5E','#C2487A','#B08A1A','#3A8C8C','#6B6F7A'];
const DEF_DOMS=[
 {id:'ex',name:'운동',c:'#D9661E',unit:'세트·분',identity:'나는 몸을 관리하는 사람이다',why:[],rewards:[{n:10,t:'단백질 쉐이크 한 통'},{n:30,t:'새 운동복 하나'},{n:100,t:'갖고 싶던 운동화'}]},
 {id:'st',name:'공부',c:'#2F7FB0',unit:'분',identity:'나는 끝까지 앉아 있는 사람이다',why:[],rewards:[{n:20,t:'좋아하는 카페에서 공부'},{n:60,t:'갖고 싶던 책 한 권'}]},
 {id:'fa',name:'신앙',c:'#7A5AA6',unit:'장·분',identity:'나는 하나님과 매일 대화하는 사람이다',why:[],rewards:[{n:30,t:'좋은 성경 노트 한 권'}]},
 {id:'li',name:'생활',c:'#2E8A5E',unit:'회',identity:'나는 하루를 정돈하는 사람이다',why:[],rewards:[{n:14,t:'보고 싶던 영화 한 편'}]}
];
const WHY_SUG={
 ex:['턱걸이 15개를 해내는 내가 보고 싶다','공부 체력이 버텨야 수능도 버틴다','거울 앞에서 당당하고 싶다','몸도 하나님이 맡기신 성전이다','스트레스를 땀으로 푼다'],
 st:['원하는 대학, 원하는 학과에 가고 싶다','부모님께 "잘했다" 소리를 듣고 싶다','수능날 후회 없이 시험장을 나오고 싶다','배운 걸로 남을 도울 사람이 되고 싶다','내가 한 만큼은 나를 믿을 수 있다'],
 fa:['하루를 말씀으로 시작하면 흔들림이 적다','하나님을 더 알고 싶다','찬양할 때 고백이 진짜이고 싶다','기도할수록 걱정이 작아진다'],
 li:['정돈된 방에서 마음도 정돈된다','일찍 자야 다음 날이 산다','폰에 끌려다니지 않고 싶다','작은 약속을 지키는 사람이 큰 약속도 지킨다']
};

 all:[

/* ---------- 저장 ---------- */
let S;
function defS(){return {doms:JSON.parse(JSON.stringify(DEF_DOMS)),logs:[],days:{},claims:{},wake:'all',since:today()};}
try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
if(!S||!Array.isArray(S.doms))S=defS();
S=Object.assign(defS(),S);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('저장 공간이 부족하다');}}

/* ---------- 녹음 저장소 (IndexedDB) ---------- */
let IDB=null;
function idb(){if(IDB)return Promise.resolve(IDB);return new Promise((res,rej)=>{const r=indexedDB.open('bulssi-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('rec',{keyPath:'id'});r.onsuccess=()=>{IDB=r.result;res(IDB);};r.onerror=()=>rej(r.error);});}
async function recAll(){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction('rec').objectStore('rec').getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.created-a.created));q.onerror=()=>rej(q.error);});}catch(e){return [];}}
async function recPut(o){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('rec','readwrite');tx.objectStore('rec').put(o);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function recDel(id){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('rec','readwrite');tx.objectStore('rec').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
let RECS=[];async function loadRecs(){RECS=await recAll();}

/* ---------- 계산 ---------- */
const dom=id=>S.doms.find(d=>d.id===id)||{name:'지운 영역',c:'#888',id};
const logsOn=(d,dm)=>S.logs.filter(l=>l.d===d&&(!dm||l.dom===dm));
const domCount=id=>S.logs.filter(l=>l.dom===id).length;
function streak(dm){const has=d=>S.logs.some(l=>l.d===d&&(!dm||l.dom===dm));let d=today(),n=0;if(!has(d))d=addD(d,-1);while(has(d)){n++;d=addD(d,-1);}return n;}
function best(dm){const days=[...new Set(S.logs.filter(l=>!dm||l.dom===dm).map(l=>l.d))].sort();let b=0,c=0,p=null;for(const d of days){c=p&&addD(p,1)===d?c+1:1;b=Math.max(b,c);p=d;}return b;}
const dayIdx=()=>Math.floor(parseD(today())/864e5);
function lineFor(dm,off=0){const pool=LINES.all.concat(dm?LINES[dm]||[]:Object.values(LINES).slice(1).flat());return pool[((dayIdx()+off)%pool.length+pool.length)%pool.length];}
function nextReward(d){const n=domCount(d.id);const rs=(d.rewards||[]).slice().sort((a,b)=>a.n-b.n);return rs.find(r=>!S.claims[d.id+':'+r.n]&&true)||null;}
function readyRewards(){const out=[];S.doms.forEach(d=>(d.rewards||[]).forEach(r=>{if(domCount(d.id)>=r.n&&!S.claims[d.id+':'+r.n])out.push([d,r]);}));return out;}

/* ---------- 기록하기 ---------- */
function addLog(dm,o={}){const before=readyRewards().length;const l=Object.assign({id:uid(),d:today(),t:Date.now(),dom:dm},o);S.logs.push(l);save();
  const after=readyRewards();if(after.length>before){const [d,r]=after[after.length-1];setTimeout(()=>toast(`${d.name} ${r.n}번 달성. 보상 "${r.t}"을 받을 수 있다`,4200),400);}return l;}
function logDialog(dm,preset){const d=dom(dm);const n=logsOn(today(),dm).length;
  dialog(`<h3 style="color:${d.c}">${esc(d.name)} · 장작 넣기</h3><p class="help">${esc(d.identity||'')}${d.identity?' — 오늘 한 표를 더 던진다.':''}</p>
   <div class="fld" style="margin-top:12px"><label for="lgA">얼마나 <span style="font-weight:400;color:var(--faint)">(${esc(d.unit||'분')}, 안 적어도 된다)</span></label><input class="txt" id="lgA" inputmode="decimal" maxlength="10" placeholder="예: 30" value="${esc(preset?.amt||'')}"></div>
   <div class="fld"><label for="lgN">작은 승리 한 줄</label><input class="txt" id="lgN" maxlength="80" placeholder="예: 하기 싫었는데 결국 했다" value="${esc(preset?.note||'')}"></div>
   <div class="row" style="gap:6px">${[1,2,3,4,5].map(k=>`<button class="chip" data-feel="${k}">${['힘들었다','버텼다','보통','좋았다','최고'][k-1]}</button>`).join('')}</div>
   <div class="acts2"><button class="btn ghost" data-close>취소</button><button class="btn pri" id="lgOk">했다</button></div>`,ov=>{
   let feel=0;ov.querySelectorAll('[data-feel]').forEach(b=>b.onclick=()=>{feel=+b.dataset.feel;ov.querySelectorAll('[data-feel]').forEach(x=>x.classList.toggle('on',x===b));});
   $('lgOk').onclick=()=>{addLog(dm,{amt:$('lgA').value.trim(),note:$('lgN').value.trim(),feel,kind:preset?.kind||'do'});closeDialog();render();
     toast(n?`${d.name} 오늘 ${n+1}번째 장작`:`${d.name} 불씨가 붙었다. 연속 ${streak(dm)}일`);};
  });}

let HOFF=0;

/* ---------- 충전 ---------- */

    v.innerHTML=`<section class="card" style="text-align:center">${head}<div class="lbl" style="justify-content:center"><span style="color:${d.c}">${esc(d.name)} · 딱 5분만</span></div>
     <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--sunk)" stroke-width="7"/><circle id="rg" cx="50" cy="50" r="44" fill="none" stroke="${d.c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg>
      <div class="in"><div class="timer" id="tmT">5:00</div><div class="help" id="tmS">시작을 누른다</div></div></div>
     <p class="help" style="margin:10px 0">5분 뒤 그만둬도 된다. 그래도 오늘은 이긴 날로 기록된다.</p>
     <div class="row" style="justify-content:center"><button class="btn pri big" id="tmGo">시작</button><button class="btn ghost" id="chBack">←</button></div></section>`;
    let left=total,run=false,end=0;
    const draw=()=>{const e=$('tmT');if(!e)return false;e.textContent=fmtT(Math.max(0,left));$('rg').setAttribute('stroke-dashoffset',String(276.5*(left/total)));return true;};
    const finish=()=>{clearInterval(TM);TM=null;TIMER_ON=false;applyWake();addLog(d.id,{kind:'five',note:'하기 싫었지만 5분 시작했다',amt:'5'});
      dialog(`<h3>5분 해냈다</h3><p class="help">시작이 가장 어렵다. 이미 넘었다. 계속할까?</p><div class="acts2"><button class="btn ghost" id="fStop">오늘은 여기까지</button><button class="btn pri" id="fMore">계속한다</button></div>`,()=>{
        $('fStop').onclick=()=>{closeDialog();CH={step:0,dm:null};go('home');toast('기록했다. 이긴 날이다');};
        $('fMore').onclick=()=>{closeDialog();CH={step:0,dm:null};go('home');toast('좋다. 끝나면 장작을 하나 더 넣는다');};});};
    $('tmGo').onclick=()=>{if(run){run=false;clearInterval(TM);left=Math.ceil((end-Date.now())/1000);$('tmGo').textContent='이어서';$('tmS').textContent='잠깐 멈춤';TIMER_ON=false;applyWake();return;}
      run=true;TIMER_ON=true;applyWake();end=Date.now()+left*1000;$('tmGo').textContent='멈춤';$('tmS').textContent='지금 하는 중';
      TM=setInterval(()=>{left=Math.ceil((end-Date.now())/1000);if(!draw()){clearInterval(TM);TIMER_ON=false;applyWake();return;}if(left<=0)finish();},250);};
  }
  $('chBack')&&($('chBack').onclick=()=>{clearInterval(TM);TIMER_ON=false;applyWake();CH.step=Math.max(0,CH.step-1);if(CH.step===0)CH.dm=null;render();});
  $('chNext')&&($('chNext').onclick=()=>{CH.step++;render();window.scrollTo(0,0);});
}

let CAM=null,MR=null,CHUNKS=[],RMODE='audio',RDOM=null,RT0=0,RTI=null;

function pickMime(video){const c=video?['video/mp4','video/webm;codecs=vp9,opus','video/webm']:['audio/mp4','audio/webm;codecs=opus','audio/webm'];for(const m of c)try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;}catch(e){}return '';}

async function rStudio(v){if(!RDOM||!S.doms.find(d=>d.id===RDOM))RDOM=S.doms[0]?.id;await loadRecs();if(VIEW!=='studio')return;const recording=MR&&MR.state==='recording';

   <div class="segs" style="margin-bottom:8px">${S.doms.map(x=>`<button class="chip ${x.id===RDOM?'on':''}" data-rd="${x.id}" ${recording?'disabled':''}>${esc(x.name)}</button>`).join('')}</div>
   <div class="row" style="margin-bottom:10px"><button class="chip ${RMODE==='audio'?'on':''}" data-rm="audio" ${recording?'disabled':''}>목소리만</button><button class="chip ${RMODE==='video'?'on':''}" data-rm="video" ${recording?'disabled':''}>얼굴과 함께</button></div>

async function startRec(){const video=RMODE==='video';
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('이 브라우저는 녹음을 지원하지 않는다');return;}
  try{CAM=await navigator.mediaDevices.getUserMedia(video?{video:{facingMode:'user',width:{ideal:720},height:{ideal:1280}},audio:true}:{audio:true});}
  catch(e){toast(video?'카메라·마이크 권한이 필요하다. 설정 → Safari에서 허용한다':'마이크 권한이 필요하다. 설정 → Safari에서 허용한다',4500);return;}
  const mime=pickMime(video);CHUNKS=[];
  try{MR=new MediaRecorder(CAM,mime?{mimeType:mime}:undefined);}catch(e){MR=new MediaRecorder(CAM);}
  const title=($('rTitle').value.trim())||PROMPTS[dayIdx()%PROMPTS.length];const dm=RDOM;
  MR.ondataavailable=e=>{if(e.data&&e.data.size)CHUNKS.push(e.data);};
  MR.onstop=async()=>{const dur=Math.round((Date.now()-RT0)/1000);const type=MR.mimeType||mime||(video?'video/mp4':'audio/mp4');const blob=new Blob(CHUNKS,{type});
    CAM&&CAM.getTracks().forEach(t=>t.stop());CAM=null;clearInterval(RTI);TIMER_ON=false;applyWake();
    if(blob.size>0){try{await recPut({id:uid(),dom:dm,title,type:video?'video':'audio',mime:type,blob,created:Date.now(),dur});toast('저장했다. 하기 싫은 날 꺼내 듣는다');}catch(e){toast('저장하지 못했다. 저장 공간을 확인한다');}}
    MR=null;if(VIEW==='studio')render();};
  MR.start(1000);RT0=Date.now();TIMER_ON=true;applyWake();render();
  RTI=setInterval(()=>{const i=$('rInfo');if(i)i.innerHTML=`<span class="recdot"></span>녹음 중 ${fmtT((Date.now()-RT0)/1000)}`;},500);
}
function playRec(id){const r=RECS.find(x=>x.id===id);if(!r)return;const url=URL.createObjectURL(r.blob);
  dialog(`<h3>${esc(r.title)}</h3><p class="help" style="margin-bottom:10px">${esc(dom(r.dom).name)} · ${esc(ymd(r.created))}</p>${r.type==='video'?`<video class="pv" id="pm" playsinline controls></video>`:`<audio id="pm" controls style="width:100%"></audio>`}<div class="acts2"><button class="btn" data-close>닫기</button></div>`,()=>{const m=$('pm');m.src=url;m.play().catch(()=>{});},()=>{URL.revokeObjectURL(url);});}

let WL=null,NSV=null,TIMER_ON=false;
const WMODES=[['all','앱 쓰는 내내'],['timer','타이머·녹음 중에만'],['off','끔']];
function wantWake(){const m=S.wake||'all';return document.visibilityState==='visible'&&(m==='all'||(m==='timer'&&TIMER_ON));}
function startNoSleep(){try{if(!NSV){NSV=document.createElement('video');NSV.setAttribute('playsinline','');NSV.setAttribute('webkit-playsinline','');NSV.muted=true;NSV.loop=true;NSV.src=NOSLEEP_SRC;NSV.setAttribute('aria-hidden','true');NSV.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;bottom:0';document.body.appendChild(NSV);}const p=NSV.play();p&&p.then(()=>{if(!wantWake())NSV.pause();}).catch(()=>{});}catch(e){}}
function stopNoSleep(){try{NSV&&NSV.pause();}catch(e){}}
async function applyWake(){if(wantWake()){startNoSleep();if('wakeLock' in navigator&&!WL){try{WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null;if(wantWake())setTimeout(applyWake,500);});}catch(e){WL=null;}}}
  else{if(WL){try{await WL.release();}catch(e){}WL=null;}stopNoSleep();}updWake();}
function updWake(){const b=$('wakeBtn');const m=S.wake||'all';b.textContent=m==='off'?'화면 자동 꺼짐':m==='timer'?'화면 켜둠 · 타이머':'화면 켜둠';b.classList.toggle('on',m!=='off');b.setAttribute('aria-pressed',m!=='off');}
$('wakeBtn').onclick=()=>dialog(`<h3>화면 켜두기</h3><p class="help" style="margin-bottom:12px">아이폰이 저절로 꺼지지 않게 한다. 홈 화면에 추가한 앱에서 가장 잘 된다.</p><div class="row">${WMODES.map(([k,l])=>`<button class="chip ${(S.wake||'all')===k?'on':''}" data-wm="${k}">${l}</button>`).join('')}</div><div class="acts2"><button class="btn pri" data-close>닫기</button></div>`,ov=>ov.querySelectorAll('[data-wm]').forEach(b=>b.onclick=()=>{S.wake=b.dataset.wm;save();applyWake();ov.querySelectorAll('[data-wm]').forEach(x=>x.classList.toggle('on',x===b));}));
document.addEventListener('visibilitychange',()=>{applyWake();if(document.visibilityState==='visible'&&VIEW==='home')render();});
['pointerdown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(wantWake()&&(!WL||!NSV||NSV.paused))applyWake();},{passive:true}));
document.addEventListener('dblclick',e=>{if(!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))e.preventDefault();},{passive:false});

updWake();loadRecs().then(()=>{if(VIEW!=='home')render();});render();
