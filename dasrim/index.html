<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1E2A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다스림">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>다스림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 맥 책상 위의 작은 관제탑. 위에는 지금 세션(맥을 연 이유와 남은 시간)과 체크인 종, 옆에는 "흘러가고 있다" 구조 버튼. 탭: 지금·규칙·맥 설정·기록. 창세기 1:28 "다스리라"에서 이름을 땄다. */
:root{
  --bg:#EDEFEC; --card:#FBFCFA; --sunk:#E1E5E0; --line:#D0D6CF; --ink:#18201C; --mute:#57625B; --faint:#8A948D;
  --moss:#2F6A4C; --moss-soft:#D6E9DD; --on-moss:#FFFFFF; --copper:#B5652A; --copper-soft:#F5E2D3; --warn:#B23A33; --warn-soft:#F6DCDA;
  --tower:#1E2A24; --on-tower:#EEF3EF; --tower-dim:#9DB0A5;
  --f-head:"Nanum Myeongjo","AppleMyungjo",serif; --f-body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111513; --card:#181E1B; --sunk:#202824; --line:#2D3832; --ink:#E6ECE8; --mute:#A0ADA5; --faint:#6E7A73;
  --moss:#79C79A; --moss-soft:#18352A; --on-moss:#0D1712; --copper:#E8975A; --copper-soft:#3A2414; --warn:#F08A80; --warn-soft:#3B1C1A;
  --tower:#0C110E; --on-tower:#E6ECE8; --tower-dim:#8A9C92; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111513; --card:#181E1B; --sunk:#202824; --line:#2D3832; --ink:#E6ECE8; --mute:#A0ADA5; --faint:#6E7A73;
  --moss:#79C79A; --moss-soft:#18352A; --on-moss:#0D1712; --copper:#E8975A; --copper-soft:#3A2414; --warn:#F08A80; --warn-soft:#3B1C1A;
  --tower:#0C110E; --on-tower:#E6ECE8; --tower-dim:#8A9C92; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h2{font-family:var(--f-head);font-size:19px;font-weight:800}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding-block:16px calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{padding-bottom:40px}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:800;font-size:22px}
.brand small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--mute);margin-left:8px}
nav.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;margin-left:auto}
nav.tabs button{border:0;background:none;border-radius:9px;padding:6px 14px;font-size:14px;color:var(--mute);white-space:nowrap}
nav.tabs button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media (max-width:899px){nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;border-radius:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}nav.tabs button{flex:1;max-width:140px}}
.page{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.page>.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:820px){.page{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.lbl{font-size:12px;letter-spacing:.05em;color:var(--mute);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.help{font-size:13.5px;color:var(--mute);margin:0}
.help b{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:500}
.btn.pri{background:var(--moss);border-color:var(--moss);color:var(--on-moss);font-weight:700}
.btn.cu{background:var(--copper);border-color:var(--copper);color:var(--on-moss);font-weight:700}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.txt{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font:inherit;color:inherit}
textarea.txt{resize:vertical;min-height:64px}
.sublbl{font-size:12.5px;font-weight:700;color:var(--mute);margin:12px 0 6px}
/* 관제탑 */
.tower{background:var(--tower);color:var(--on-tower);border-radius:16px;padding:18px}
.tower .k{font-size:11.5px;letter-spacing:.08em;color:var(--tower-dim)}
.tower .purpose{font-family:var(--f-head);font-weight:800;font-size:22px;margin:4px 0 2px;overflow-wrap:anywhere}
.tower .clock{font-family:var(--f-mono);font-size:56px;line-height:1.05;font-variant-numeric:tabular-nums;margin:10px 0 4px}
.tower .clock.over{color:#F2A36B}
.tower .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--tower-dim)}
.tower .meta b{color:var(--on-tower);font-weight:700}
.tower .txt{background:color-mix(in srgb,var(--on-tower) 8%,transparent);border-color:color-mix(in srgb,var(--on-tower) 20%,transparent);color:var(--on-tower)}
.tower .txt::placeholder{color:var(--tower-dim)}
.tower .chip{border-color:color-mix(in srgb,var(--on-tower) 25%,transparent);color:var(--on-tower)}
.tower .chip.on{background:var(--on-tower);color:var(--tower);border-color:var(--on-tower)}
.tower .btn.ghost{color:var(--on-tower);border-color:color-mix(in srgb,var(--on-tower) 30%,transparent)}
.prog{height:6px;border-radius:99px;background:color-mix(in srgb,var(--on-tower) 15%,transparent);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:#79C79A;border-radius:inherit}
.drift{width:100%;border:1.5px solid var(--copper);background:var(--copper-soft);color:var(--copper);border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.verse{font-family:var(--f-head);font-weight:700;font-size:16px;line-height:1.75;margin:0}
.verse cite{display:block;font-family:var(--f-body);font-weight:400;font-style:normal;font-size:12.5px;color:var(--mute);margin-top:6px}
.bell{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);margin-right:6px}
.dot.on{background:var(--moss)}
/* 규칙 */
.rule{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.rule .tx small{display:block;color:var(--mute);font-size:12px}
.yn{display:flex;gap:4px;flex:none}
.yn button{border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:700;color:var(--mute)}
.yn button.on.y{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.yn button.on.n{background:var(--warn);border-color:var(--warn);color:var(--on-moss)}
.x{border:0;background:none;color:var(--faint);padding:0 4px;font-size:12.5px;white-space:nowrap}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow .txt{flex:1;min-width:0}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sug button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--mute)}
pre.cmd{background:var(--tower);color:var(--on-tower);border-radius:10px;padding:12px;font-family:var(--f-mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-all;margin:8px 0;max-height:220px;overflow:auto}
.site{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:3px 6px 3px 11px;font-size:13px;margin:0 6px 6px 0}
/* 맥 설정 */
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .ck{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:transparent;flex:none;padding:0;color:var(--on-moss);font-size:14px;margin-top:2px}
.step .ck.on{background:var(--moss);border-color:var(--moss)}
.step .tx{flex:1;min-width:0}
.step .tx b{display:block;font-size:15px}
.step .tx .path{font-size:13px;color:var(--copper);font-weight:700;margin:2px 0}
.step .tx p{margin:2px 0 0;font-size:13.5px;color:var(--mute)}
/* 기록 */
.bars{display:flex;align-items:flex-end;gap:5px;height:110px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;min-width:0;font-size:10.5px;color:var(--faint)}
.bars .st{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden}
.bars .st i{display:block;width:100%}
.bars i.a{background:var(--moss)}.bars i.b{background:var(--copper)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.stat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.stat4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat4 div{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mute)}
.stat4 b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.ent{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ent:last-child{border-bottom:0}
.ent small{color:var(--mute);font-size:12px;display:block}
.trig{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
.hb{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-bottom:6px}
.hb i{display:block;height:100%;background:var(--copper)}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px 0;font-size:13px}
.scale button.on{background:var(--moss);border-color:var(--moss);color:var(--on-moss);font-weight:700}
.banner{border:1.5px solid var(--copper);background:var(--copper-soft);border-radius:14px;padding:14px 16px}
.banner b{color:var(--copper)}
/* dialog */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,10,8,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.dialog h3{font-family:var(--f-head);font-size:20px;font-weight:800;margin-bottom:6px}
.acts2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.breath{width:150px;height:150px;margin:18px auto;border-radius:50%;background:var(--moss-soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--moss);transition:transform 4s ease-in-out;transform:scale(.7)}
.breath.in{transform:scale(1)}
@media (prefers-reduced-motion:reduce){.breath{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:90;max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){.toast{bottom:24px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span class="brand">다스림<small>기기를 주님 뜻대로</small></span>
    <nav class="tabs" id="tabs" aria-label="화면"><button data-v="now" class="on">지금</button><button data-v="rules">규칙</button><button data-v="mac">맥 설정</button><button data-v="log">기록</button></nav>
  </header>
  <main id="view"></main>
</div>
<div id="ovl"></div>
<div class="toast" id="toast" hidden></div>
<script>
/* ================= 다스림 ================= */
const KEY='dasrim-v1';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const today=()=>ymd(Date.now());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):m)+':'+pad(x);};
let toastT;function toast(m,ms=2800){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms);}
function dialog(html,bind,onClose){$('ovl').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`;const ov=$('ovl').firstChild;ov._c=onClose;ov.onclick=e=>{if(e.target.hasAttribute('data-close'))closeDialog();};bind&&bind(ov);}
function closeDialog(){const ov=$('ovl').firstChild;if(ov&&ov._c)try{ov._c();}catch(e){}$('ovl').innerHTML='';}
const dlgOpen=()=>!!$('ovl').firstChild;
function armed(btn,label,fn){if(btn.dataset.arm){fn();return;}btn.dataset.arm=1;const old=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.textContent=old;}},3000);}

/* ---------- 말씀 (개역한글) ---------- */
const VERSES=[
 ['모든 것이 내게 가하나 다 유익한 것이 아니요 모든 것이 내게 가하나 내가 아무에게든지 제재를 받지 아니하리라','고린도전서 6:12'],
 ['그런즉 너희가 어떻게 행할 것을 자세히 주의하여 지혜 없는 자 같이 하지 말고 오직 지혜 있는 자 같이 하여 세월을 아끼라 때가 악하니라','에베소서 5:15-16'],
 ['나는 비루한 것을 내 눈 앞에 두지 아니할 것이요','시편 101:3'],
 ['내 눈을 돌이켜 허탄한 것을 보지 말게 하시고 주의 도에 나를 소성케 하소서','시편 119:37'],
 ['눈은 몸의 등불이니 그러므로 네 눈이 성하면 온 몸이 밝을 것이요','마태복음 6:22'],
 ['너희는 이 세대를 본받지 말고 오직 마음을 새롭게 함으로 변화를 받아 하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지 분별하도록 하라','로마서 12:2'],
 ['자기의 마음을 제어하지 아니하는 자는 성읍이 무너지고 성벽이 없는 자와 같으니라','잠언 25:28'],
 ['오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 온유와 절제니 이같은 것을 금지할 법이 없느니라','갈라디아서 5:22-23'],
 ['종말로 형제들아 무엇에든지 참되며 무엇에든지 경건하며 무엇에든지 옳으며 무엇에든지 정결하며 무엇에든지 사랑할 만하며 무엇에든지 칭찬할 만하며 무슨 덕이 있든지 무슨 기림이 있든지 이것들을 생각하라','빌립보서 4:8'],
 ['그런즉 너희가 먹든지 마시든지 무엇을 하든지 다 하나님의 영광을 위하여 하라','고린도전서 10:31'],
 ['우리에게 우리 날 계수함을 가르치사 지혜의 마음을 얻게 하소서','시편 90:12'],
 ['이르시기를 너희는 가만히 있어 내가 하나님 됨을 알지어다','시편 46:10'],
 ['하나님이 그들에게 복을 주시며 하나님이 그들에게 이르시되 생육하고 번성하여 땅에 충만하라, 땅을 정복하라, 바다의 고기와 공중의 새와 땅에 움직이는 모든 생물을 다스리라 하시니라','창세기 1:28'],
 ['무슨 일을 하든지 마음을 다하여 주께 하듯 하고 사람에게 하듯 하지 말라','골로새서 3:23']
];
const DRIFT_V=[2,3,5,6,11];
const PURP=['공부','과제·원서','작곡','연락·메일','정보 찾기','쉼 (정해진 만큼)'];
const TRIG=['유튜브','쇼츠·릴스','쇼핑(당근·쿠팡·무신사)','SNS','커뮤니티','뉴스·검색 꼬리물기','게임','기타'];
const RULE_SUG=['맥은 책상에서만, 침대에 가져가지 않는다','맥을 열면 먼저 이유를 적는다','쇼츠·릴스는 보지 않는다','쇼핑앱은 살 것이 정해졌을 때만 연다','밤 11시에는 맥을 덮는다','공부할 때 폰은 다른 방에 둔다','주일 오후에는 화면을 쉬게 한다','유튜브는 검색해서 볼 것만, 추천 영상은 누르지 않는다'];

/* ---------- 저장 ---------- */
function defS(){return {rules:[{id:uid(),t:'맥을 열면 먼저 이유를 적는다'},{id:uid(),t:'쇼츠·릴스는 보지 않는다'},{id:uid(),t:'밤 11시에는 맥을 덮는다'}],ruleLog:{},sites:['youtube.com','www.youtube.com'],mac:{},
  sessions:[],checks:[],rescues:[],evenings:{},cur:null,bell:{min:20,always:false},shut:'23:00',sabbath:true,vOff:0};}
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
S=Object.assign(defS(),S||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- 소리·알림 ---------- */
let AC=null;
function unlockAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function chime(n=2){try{unlockAudio();if(!AC)return;const t0=AC.currentTime;[0,1,2].slice(0,n).forEach(i=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=[659.25,880,523.25][i];g.gain.setValueAtTime(0,t0+i*.45);g.gain.linearRampToValueAtTime(.25,t0+i*.45+.02);g.gain.exponentialRampToValueAtTime(.001,t0+i*.45+1.6);o.connect(g).connect(AC.destination);o.start(t0+i*.45);o.stop(t0+i*.45+1.7);});}catch(e){}}
function notify(title,body){try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification(title,{body,icon:'icon-180.png',tag:'dasrim',renotify:true});n.onclick=()=>{window.focus();n.close();};}}catch(e){}}
async function askNotify(){try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission();}catch(e){}render();}
const notifState=()=>!('Notification' in window)?'none':Notification.permission;

/* ---------- 계산 ---------- */
const dayIdx=()=>Math.floor(parseD(today())/864e5);
const vOf=off=>VERSES[((dayIdx()+off)%VERSES.length+VERSES.length)%VERSES.length];
const onDay=(arr,d)=>arr.filter(x=>ymd(x.t)===d);
function shutPassed(){const [h,m]=(S.shut||'23:00').split(':').map(Number);const n=new Date();return n.getHours()*60+n.getMinutes()>=h*60+m;}
const isSunday=()=>new Date().getDay()===0;

/* ---------- 세션·종 엔진 ---------- */
let nextBell=0,endedShown=false;
function bellOn(){return S.bell.min>0&&(S.cur||S.bell.always);}
function scheduleBell(){nextBell=bellOn()?Date.now()+S.bell.min*60000:0;}
function startSession(purpose,min){unlockAudio();S.cur={id:uid(),t:Date.now(),purpose,plan:min,ext:0};endedShown=false;save();scheduleBell();if(notifState()==='default')askNotify();render();toast(`${min}분. 이 일만 하고 덮는다`);}
function endSession(how){const c=S.cur;if(!c)return;S.sessions.push(Object.assign({},c,{end:Date.now(),how}));S.cur=null;save();scheduleBell();document.title='다스림';render();}
function tick(){const now=Date.now();
  if(S.cur){const left=S.cur.t+(S.cur.plan+S.cur.ext)*60000-now;document.title=(left>0?mmss(left/1000):'+'+mmss(-left/1000))+' · '+S.cur.purpose;
    const el=$('clk');if(el){el.textContent=left>0?mmss(left/1000):'+'+mmss(-left/1000);el.classList.toggle('over',left<=0);const p=$('prg');if(p)p.style.width=Math.min(100,(now-S.cur.t)/((S.cur.plan+S.cur.ext)*60000)*100)+'%';}
    if(left<=0&&!endedShown){endedShown=true;chime(3);notify('정한 시간이 끝났다',`"${S.cur.purpose}" — 덮을까, 이유가 있어 더 할까?`);timeUp();}}
  if(nextBell&&now>=nextBell&&!dlgOpen()){chime(2);notify('지금, 무엇을 하고 있나?',S.cur?`맥을 연 이유: ${S.cur.purpose}`:'의도대로 쓰고 있는지 한 번 본다');checkIn();scheduleBell();}
  else if(nextBell&&now>=nextBell)scheduleBell();
  const bl=$('bellLeft');if(bl)bl.textContent=nextBell?mmss((nextBell-now)/1000):'꺼짐';
}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tick();});
function timeUp(){dialog(`<h3>정한 시간이 끝났다</h3><p class="help">맥을 연 이유: <b>${esc(S.cur.purpose)}</b> · ${S.cur.plan+S.cur.ext}분</p>
  <p class="verse" style="margin:14px 0">${esc(vOf(1)[0])}<cite>${esc(vOf(1)[1])} · 개역한글</cite></p>
  <div class="fld" style="margin-top:6px"><label class="help" for="exR">더 해야 한다면, 이유를 한 줄로</label><input class="txt" id="exR" maxlength="60" placeholder="예: 문제 하나만 마저 푼다"></div>
  <div class="acts2"><button class="btn" id="exMore">10분 더</button><button class="btn pri" id="exDone">끝냈다 · 덮는다</button></div>`,()=>{
  $('exDone').onclick=()=>{closeDialog();endSession('done');closePrompt();};
  $('exMore').onclick=()=>{const r=$('exR').value.trim();if(!r){toast('이유를 한 줄 적어야 연장된다');$('exR').focus();return;}S.cur.ext+=10;S.cur.exts=(S.cur.exts||[]).concat(r);endedShown=false;save();closeDialog();render();toast('10분 더. 이유대로만');};});}
function closePrompt(){dialog(`<h3>수고했다</h3><p class="help" style="margin-bottom:6px">이제 맥을 덮고 일어난다. 다음 일을 하러 간다.</p><p class="verse">${esc(VERSES[9][0])}<cite>${esc(VERSES[9][1])} · 개역한글</cite></p><div class="acts2"><button class="btn pri" data-close>덮는다</button></div>`);}
function checkIn(){dialog(`<h3>지금, 무엇을 하고 있나?</h3><p class="help">${S.cur?`맥을 연 이유: <b>${esc(S.cur.purpose)}</b>`:'정직하게 고른다. 정죄가 아니라 방향을 바로잡는 시간이다.'}</p>
  <div class="row" style="margin-top:14px;flex-direction:column;align-items:stretch"><button class="btn pri" id="ckY">의도대로 쓰고 있다</button><button class="btn cu" id="ckN">흘러가고 있었다 · 멈춘다</button></div>`,()=>{
  $('ckY').onclick=()=>{S.checks.push({t:Date.now(),ok:true});save();closeDialog();render();toast('좋다. 계속 그 일만');};
  $('ckN').onclick=()=>{S.checks.push({t:Date.now(),ok:false});save();closeDialog();rescue();};});}

/* ---------- 구조 (흘러가고 있다) ---------- */
function rescue(){let step=0,trig=null,bt=null;const v=vOf(S.vOff+3);const dv=VERSES[DRIFT_V[Math.floor(Math.random()*DRIFT_V.length)]];
  const draw=ov=>{const d=ov.querySelector('.dialog');
    if(step===0){d.innerHTML=`<h3>손을 떼고, 숨 세 번</h3><p class="help">키보드와 트랙패드에서 손을 뗀다. 화면 말고 원 하나만 본다.</p><div class="breath" id="br">들이쉬고</div><p class="help" style="text-align:center" id="brN">1 / 3</p><div class="acts2"><button class="btn ghost" id="skip">건너뛰기</button></div>`;
      let n=0,phase=0;const b=$('br');const run=()=>{if(!b.isConnected)return;phase?(b.classList.remove('in'),b.textContent='내쉬고'):(b.classList.add('in'),b.textContent='들이쉬고');if(phase){n++;}const nn=$('brN');if(nn)nn.textContent=Math.min(n+1,3)+' / 3';phase=1-phase;if(n>=3){step=1;setTimeout(()=>draw(ov),600);return;}bt=setTimeout(run,4000);};setTimeout(run,60);
      $('skip').onclick=()=>{clearTimeout(bt);step=1;draw(ov);};}
    else if(step===1){d.innerHTML=`<h3>무엇이 나를 끌고 갔나</h3><p class="help">이름을 붙이면 다음엔 먼저 보인다.</p><div class="row" style="margin:12px 0">${TRIG.map(t=>`<button class="chip" data-tr="${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <p class="verse" style="margin-top:10px">${esc(dv[0])}<cite>${esc(dv[1])} · 개역한글</cite></p>
      <div class="acts2"><button class="btn pri" id="nx">다음</button></div>`;
      d.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{trig=b.dataset.tr;d.querySelectorAll('[data-tr]').forEach(x=>x.classList.toggle('on',x===b));});$('nx').onclick=()=>{step=2;draw(ov);};}
    else{d.innerHTML=`<h3>이제 무엇을 하나</h3><p class="help">탭을 닫고 고른 것을 바로 한다.</p>
      <div class="row" style="margin-top:14px;flex-direction:column;align-items:stretch">
       ${S.cur?`<button class="btn pri" data-go="back">원래 하던 일로: ${esc(S.cur.purpose)}</button>`:'<button class="btn pri" data-go="start">이유를 정하고 다시 시작</button>'}
       <button class="btn" data-go="up">일어나서 물 한 잔, 스트레칭</button><button class="btn" data-go="pray">짧게 기도하고 돌아온다</button><button class="btn cu" data-go="close">오늘은 맥을 덮는다</button></div>`;
      d.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.rescues.push({t:Date.now(),trig:trig||'기타',next:b.dataset.go});save();closeDialog();
        const g=b.dataset.go;if(g==='close'){if(S.cur)endSession('closed');closePrompt();}else if(g==='start'){VIEW='now';render();setTimeout(()=>$('pIn')?.focus(),50);toast('맥을 연 이유부터 적는다');}else{render();toast(g==='back'?'다시 그 일만':g==='up'?'일어난다. 화면은 기다린다':'주님, 제 눈과 손을 다스려 주세요');}});}
  };
  dialog('',draw,()=>clearTimeout(bt));}

/* ---------- 화면 ---------- */

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;render();window.scrollTo(0,0);});

   <div class="row" style="margin-top:14px"><button class="btn pri" id="sDone">끝냈다 · 덮는다</button><button class="btn ghost" id="sStop">그만둔다</button></div>`
  :`<div class="k">맥을 열었다. 왜?</div><div class="purpose" style="font-size:19px">이유를 정하고, 시간을 정하고, 그것만 한다</div>

   <div class="row" style="margin-top:10px">${[15,25,45,60,90].map(m=>`<button class="chip ${MSEL===m?'on':''}" data-mm="${m}">${m}분</button>`).join('')}</div>
   <button class="btn pri wide" id="sGo" style="margin-top:14px;padding:12px">시작</button>`}
  </section>

    <div class="row">${[0,10,15,20,30].map(m=>`<button class="chip ${S.bell.min===m?'on':''}" data-bm="${m}" style="font-size:12.5px;padding:3px 10px">${m?m+'분':'끔'}</button>`).join('')}</div></div>
   <label class="help" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="bAlw" ${S.bell.always?'checked':''}> 세션이 없어도 계속 울리기 (맥을 켜 둔 내내)</label>
   ${ns==='default'?`<div class="row" style="margin-top:10px"><button class="btn sm cu" id="nAsk">맥 알림 켜기</button><span class="help">다른 창에 있어도 종이 알림으로 뜬다</span></div>`:ns==='denied'?'<p class="help" style="margin-top:8px">알림이 막혀 있다. 브라우저 설정에서 이 사이트 알림을 허용하면 다른 창에서도 보인다.</p>':ns==='granted'?'<p class="help" style="margin-top:8px">알림 켜짐. 이 창을 닫지 말고 뒤에 열어 둔다.</p>':''}
  </section>
  ${shutPassed()&&!ev?`<section class="banner"><b>셧다운 시간(${esc(S.shut)})이 지났다.</b><p class="help" style="margin:4px 0 10px">오늘 쓴 것을 돌아보고 맥을 덮는다.</p><button class="btn cu sm" id="evGo">오늘 돌아보기</button></section>`:''}
  ${isSunday()&&S.sabbath?`<section class="banner"><b>주일이다.</b> <span class="help">예배와 쉼을 위해 화면도 쉬게 한다. 꼭 필요한 일만.</span></section>`:''}
  </div><div class="col">
  <section class="card"><div class="lbl"><span>오늘의 말씀</span><button class="btn ghost sm" id="vNx">다른 말씀</button></div><p class="verse">${esc(v0[0])}<cite>${esc(v0[1])} · 개역한글</cite></p></section>
  <section class="card"><div class="lbl"><span>오늘</span><span>${t.slice(5).replace('-','/')}</span></div>
   <div class="stat4"><div>세션<b>${ss.length}${c?'+1':''}</b></div><div>의도대로<b>${ck.filter(x=>x.ok).length}/${ck.length}</b></div><div>멈춘 횟수<b>${rs.length}</b></div><div>규칙<b>${S.rules.filter(r=>rl[r.id]==='y').length}/${S.rules.length}</b></div></div></section>
  <section class="card"><div class="lbl"><span>오늘의 규칙</span><button class="btn ghost sm" id="toRules">고치기 →</button></div>
   ${S.rules.map(r=>ruleRow(r,rl)).join('')||'<p class="help">규칙 탭에서 나만의 울타리를 정한다.</p>'}</section>
  <section class="card"><div class="lbl"><span>하루 돌아보기</span>${ev?'<span class="help">'+ev.score+'/5</span>':''}</div>${ev?`<p class="help">${esc(ev.note||'')}</p><button class="btn ghost sm" id="evGo" style="margin-top:8px">다시 쓰기</button>`:`<p class="help" style="margin-bottom:8px">셧다운 시간(<input type="time" id="shutIn" value="${esc(S.shut)}" class="txt" style="width:auto;display:inline-block;padding:2px 6px;font-size:13px">)에 오늘 기기를 어떻게 썼는지 돌아본다.</p><button class="btn sm" id="evGo">지금 돌아보기</button>`}</section>
  </div></div>`;
  v.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{PSEL=PSEL===b.dataset.pp?null:b.dataset.pp;const i=$('pIn');const keep=i?i.value:'';render();if($('pIn'))$('pIn').value=keep;});
  v.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{MSEL=+b.dataset.mm;const keep=$('pIn')?.value||'';render();if($('pIn'))$('pIn').value=keep;});
  $('sGo')&&($('sGo').onclick=()=>{const p=($('pIn').value.trim()||PSEL||'').trim();if(!p){toast('맥을 연 이유를 적거나 고른다');$('pIn').focus();return;}startSession(PSEL&&$('pIn').value.trim()?`${PSEL} · ${$('pIn').value.trim()}`:p,MSEL);PSEL=null;});
  $('pIn')&&($('pIn').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)$('sGo').click();});
  $('sDone')&&($('sDone').onclick=()=>{endSession('done');closePrompt();});
  $('sStop')&&($('sStop').onclick=e=>armed(e.target,'정말 그만둔다',()=>endSession('stopped')));
  $('drift').onclick=()=>{unlockAudio();rescue();};
  v.querySelectorAll('[data-bm]').forEach(b=>b.onclick=()=>{unlockAudio();S.bell.min=+b.dataset.bm;save();scheduleBell();render();});
  $('bAlw').onchange=e=>{unlockAudio();S.bell.always=e.target.checked;save();scheduleBell();render();};
  $('nAsk')&&($('nAsk').onclick=askNotify);
  $('vNx').onclick=()=>{S.vOff++;save();render();};
  $('toRules').onclick=()=>{VIEW='rules';render();};
  $('shutIn')&&($('shutIn').onchange=e=>{S.shut=e.target.value||'23:00';save();});
  v.querySelectorAll('#evGo').forEach(b=>b.onclick=evening);
  bindRuleYN(v);
}
function ruleRow(r,rl){const s=rl[r.id];return `<div class="rule"><div class="tx">${esc(r.t)}</div><div class="yn"><button class="${s==='y'?'on y':''}" data-ry="${r.id}" data-rv="y">지켰다</button><button class="${s==='n'?'on n':''}" data-ry="${r.id}" data-rv="n">어겼다</button></div></div>`;}
function bindRuleYN(v){v.querySelectorAll('[data-ry]').forEach(b=>b.onclick=()=>{const t=today();const rl=S.ruleLog[t]||(S.ruleLog[t]={});rl[b.dataset.ry]=rl[b.dataset.ry]===b.dataset.rv?undefined:b.dataset.rv;save();render();});}
function evening(){const t=today();const ev=S.evenings[t]||{};let sc=ev.score||0;
  const ck=onDay(S.checks,t),rs=onDay(S.rescues,t);
  dialog(`<h3>오늘, 기기를 주님 뜻대로 썼나</h3><p class="help">세션 ${onDay(S.sessions,t).length}번 · 의도대로 ${ck.filter(x=>x.ok).length}/${ck.length} · 멈춘 횟수 ${rs.length}</p>
   <div class="sublbl">점수</div><div class="scale">${[1,2,3,4,5].map(n=>`<button class="${sc===n?'on':''}" data-sc="${n}">${n}</button>`).join('')}</div>
   <div class="sublbl">감사하거나 회개할 것 한 줄</div><textarea class="txt" id="evN" rows="3" placeholder="예: 저녁에 쇼츠로 40분 흘렸다. 내일은 충전기를 거실에 둔다. 공부 세션 셋을 지킨 건 감사.">${esc(ev.note||'')}</textarea>
   <p class="help" style="margin-top:10px">만일 우리가 우리 죄를 자백하면 저는 미쁘시고 의로우사 우리 죄를 사하시며 우리를 모든 불의에서 깨끗케 하실 것이요 — 요한일서 1:9 (개역한글)</p>
   <div class="acts2"><button class="btn ghost" data-close>나중에</button><button class="btn pri" id="evS">적고 맥을 덮는다</button></div>`,ov=>{
   ov.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{sc=+b.dataset.sc;ov.querySelectorAll('[data-sc]').forEach(x=>x.classList.toggle('on',x===b));});
   $('evS').onclick=()=>{if(!sc){toast('점수를 고른다');return;}S.evenings[t]={score:sc,note:$('evN').value.trim()};if(S.cur)endSession('closed');save();closeDialog();render();toast('수고했다. 이제 덮고 쉰다');};});}

/* ---------- 규칙 ---------- */
let SDRAFT='';
function hostsCmd(){const list=[...new Set(S.sites.flatMap(s=>{s=s.replace(/^https?:\/\//,'').replace(/\/.*$/,'').toLowerCase();return s.startsWith('www.')||s.split('.').length>2?[s]:[s,'www.'+s];}))];
  const lines=['# dasrim-start'].concat(list.map(s=>'0.0.0.0 '+s)).concat(['# dasrim-end']);
  return `sudo sed -i '' '/# dasrim-start/,/# dasrim-end/d' /etc/hosts && printf '%s\\n' ${lines.map(l=>`'${l}'`).join(' ')} | sudo tee -a /etc/hosts > /dev/null && sudo dscacheutil -flushcache && sudo killall -HUP mDNSResponder`;}
const UNDO=`sudo sed -i '' '/# dasrim-start/,/# dasrim-end/d' /etc/hosts && sudo dscacheutil -flushcache && sudo killall -HUP mDNSResponder`;
function rRules(v){const t=today();const rl=S.ruleLog[t]||{};
  v.innerHTML=`<div class="page"><div class="col">
  <section class="card"><h2>나의 울타리</h2><p class="help" style="margin:4px 0 8px">"모든 것이 내게 가하나 다 유익한 것이 아니요"(고전 6:12). 금지 목록이 아니라 나를 지키는 성벽이다. 매일 지켰는지 체크한다.</p>
   ${S.rules.map(r=>`<div class="rule"><div class="tx">${esc(r.t)}<small>최근 7일 ${[0,1,2,3,4,5,6].filter(i=>(S.ruleLog[addD(t,-i)]||{})[r.id]==='y').length}/7 지킴</small></div><div class="yn"><button class="${rl[r.id]==='y'?'on y':''}" data-ry="${r.id}" data-rv="y">지켰다</button><button class="${rl[r.id]==='n'?'on n':''}" data-ry="${r.id}" data-rv="n">어겼다</button></div><button class="x" data-rdel="${r.id}">빼기</button></div>`).join('')}
   <div class="addrow"><input class="txt" id="rIn" maxlength="60" placeholder="규칙 하나 더"><button class="btn sm" id="rAdd">더하기</button></div>
   <div class="sug">${RULE_SUG.filter(s=>!S.rules.some(r=>r.t===s)).map(s=>`<button data-rs="${esc(s)}">+ ${esc(s)}</button>`).join('')}</div></section>
  <section class="card"><h2>디지털 안식</h2>
   <div class="sublbl">셧다운 시간 (이 시간이 지나면 하루 돌아보기를 띄운다)</div><input type="time" class="txt" id="shut2" value="${esc(S.shut)}" style="max-width:160px">
   <label class="help" style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="sab" ${S.sabbath?'checked':''}> 주일에는 화면을 쉬게 하라는 알림 띄우기</label>
   <p class="help" style="margin-top:8px">스크린 타임의 다운타임도 같은 시간으로 맞춰 두면 단단하다(맥 설정 탭).</p></section>
  </div><div class="col">
  <section class="card"><h2>사이트 차단</h2><p class="help" style="margin:4px 0 10px">맥의 hosts 파일에 적으면 브라우저에서 그 사이트가 아예 열리지 않는다. 풀 때도 명령을 쳐야 하니 순간의 충동이 지나간다.</p>
   <div>${S.sites.map((s,i)=>`<span class="site">${esc(s)}<button class="x" data-sdel="${i}" aria-label="${esc(s)} 빼기">×</button></span>`).join('')||'<p class="help">막을 사이트를 추가한다.</p>'}</div>
   <div class="addrow"><input class="txt" id="sIn" maxlength="60" placeholder="예: youtube.com" value="${esc(SDRAFT)}"><button class="btn sm" id="sAdd">추가</button></div>
   <div class="sug">${SITE_SUG.filter(s=>!S.sites.includes(s)).map(s=>`<button data-ss="${esc(s)}">+ ${esc(s)}</button>`).join('')}</div>
   <div class="sublbl">1. 터미널(⌘+스페이스 → "터미널")에 붙여 넣고 엔터 → 맥 암호 입력</div>
   <pre class="cmd" id="cmd">${esc(hostsCmd())}</pre>
   <div class="row"><button class="btn pri sm" id="cpy">차단 명령 복사</button><button class="btn ghost sm" id="cpyU">풀기 명령 복사</button></div>
   <p class="help" style="margin-top:10px">목록을 바꾸면 다시 복사해서 실행한다(예전 차단은 자동으로 바뀐다). 크롬은 설정 → 개인 정보 보호 및 보안 → 보안 → "보안 DNS 사용"을 끄면 확실히 먹는다. 유튜브를 막으면 공부 영상도 막히니, 꼭 필요할 땐 풀기 명령으로 잠깐 연다.</p></section>
  </div></div>`;
  bindRuleYN(v);
  const addR=t=>{t=t.trim();if(!t)return;S.rules.push({id:uid(),t});save();render();};
  $('rAdd').onclick=()=>addR($('rIn').value);$('rIn').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)addR(e.target.value);};
  v.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>addR(b.dataset.rs));
  v.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>armed(b,'정말?',()=>{S.rules=S.rules.filter(r=>r.id!==b.dataset.rdel);save();render();}));
  $('shut2').onchange=e=>{S.shut=e.target.value||'23:00';save();};
  $('sab').onchange=e=>{S.sabbath=e.target.checked;save();};
  $('sIn').oninput=e=>SDRAFT=e.target.value;
  const addS=s=>{s=s.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'').toLowerCase();if(!s||!/^[a-z0-9.-]+\.[a-z]{2,}$/.test(s)){toast('주소 형식으로 적는다 (예: youtube.com)');return;}if(!S.sites.includes(s))S.sites.push(s);SDRAFT='';save();render();};
  $('sAdd').onclick=()=>addS(SDRAFT);$('sIn').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)addS(e.target.value);};
  v.querySelectorAll('[data-ss]').forEach(b=>b.onclick=()=>addS(b.dataset.ss));
  v.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{S.sites.splice(+b.dataset.sdel,1);save();render();});
  const copy=async tx=>{try{await navigator.clipboard.writeText(tx);toast('복사했다. 터미널에 붙여 넣는다');}catch(e){const r=document.createRange();r.selectNodeContents($('cmd'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('선택된 글자를 ⌘C로 복사한다');}};
  $('cpy').onclick=()=>copy(hostsCmd());$('cpyU').onclick=()=>copy(UNDO);
}

/* ---------- 맥 설정 ---------- */
function rMac(v){const n=MAC.filter(m=>S.mac[m[0]]).length;
  v.innerHTML=`<div style="max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px">
  <section class="card"><h2>맥에 울타리 세우기</h2><p class="help" style="margin:4px 0 10px">의지는 순간에 무너진다. 그래서 정신이 맑을 때 환경을 만들어 둔다. 하나씩 하고 체크한다.</p>
   <div class="hb" style="height:8px"><i style="width:${Math.round(n/MAC.length*100)}%;background:var(--moss)"></i></div><p class="help">${n}/${MAC.length} 완료</p></section>
  <section class="card">${MAC.map(m=>`<div class="step"><button class="ck ${S.mac[m[0]]?'on':''}" data-mac="${m[0]}" aria-pressed="${!!S.mac[m[0]]}" aria-label="${esc(m[1])} 완료">${S.mac[m[0]]?'✓':''}</button><div class="tx"><b>${esc(m[1])}</b><div class="path">${esc(m[2])}</div><p>${esc(m[3])}</p></div></div>`).join('')}</section>
  <section class="card"><div class="lbl"><span>백업</span></div><p class="help" style="margin-bottom:8px">기록은 이 맥의 브라우저에만 있다. 가끔 복사해서 메모에 붙여 둔다.</p>
   <div class="row"><button class="btn sm" id="bkC">백업 복사</button><button class="btn sm" id="bkR">복원</button></div><textarea class="txt" id="bkT" rows="3" hidden placeholder="백업 글자를 붙여넣고 복원을 다시 누른다" style="margin-top:8px"></textarea></section></div>`;
  v.querySelectorAll('[data-mac]').forEach(b=>b.onclick=()=>{S.mac[b.dataset.mac]=!S.mac[b.dataset.mac];save();render();});
  $('bkC').onclick=async()=>{const tx=JSON.stringify(S);try{await navigator.clipboard.writeText(tx);toast('백업을 복사했다');}catch(e){const ta=$('bkT');ta.hidden=false;ta.value=tx;ta.select();toast('선택된 글자를 직접 복사한다');}};
  $('bkR').onclick=()=>{const ta=$('bkT');if(ta.hidden||!ta.value.trim()){ta.hidden=false;ta.value='';ta.focus();return;}try{const r=JSON.parse(ta.value);if(!Array.isArray(r.rules))throw 0;S=Object.assign(defS(),r);save();render();toast('복원했다');}catch(e){toast('백업 글자를 읽지 못했다');}};
}

/* ---------- 기록 ---------- */
function rLog(v){const t=today();const days=[...Array(14)].map((_,i)=>addD(t,i-13));
  const mins=d=>onDay(S.sessions,d).reduce((a,s)=>a+Math.round((s.end-s.t)/60000),0);
  const per=days.map(d=>{const c=onDay(S.checks,d);return {d,ok:c.filter(x=>x.ok).length,no:c.filter(x=>!x.ok).length+onDay(S.rescues,d).length,min:mins(d)};});
  const mx=Math.max(1,...per.map(p=>p.ok+p.no));
  const wk=days.slice(7);const wkC=S.checks.filter(x=>ymd(x.t)>=wk[0]);const wkR=S.rescues.filter(x=>ymd(x.t)>=wk[0]);
  const trig={};S.rescues.forEach(r=>trig[r.trig]=(trig[r.trig]||0)+1);const tm=Math.max(1,...Object.values(trig));
  const evs=Object.entries(S.evenings).sort((a,b)=>b[0].localeCompare(a[0]));
  const ruleRate=(()=>{let y=0,n=0;wk.forEach(d=>{const r=S.ruleLog[d]||{};Object.values(r).forEach(x=>{if(x==='y')y++;else if(x==='n')n++;});});return y+n?Math.round(y/(y+n)*100)+'%':'-';})();
  v.innerHTML=`<div class="page"><div class="col">
  <section class="card"><div class="lbl"><span>최근 7일</span></div><div class="stat4"><div>의도대로 비율<b>${wkC.length?Math.round(wkC.filter(x=>x.ok).length/wkC.length*100)+'%':'-'}</b></div><div>멈춘 횟수<b>${wkR.length}</b></div><div>세션 시간<b>${wk.reduce((a,d)=>a+mins(d),0)}분</b></div><div>규칙 지킴<b>${ruleRate}</b></div></div></section>
  <section class="card"><div class="lbl"><span>최근 14일 · 체크인</span></div>
   <div class="bars">${per.map(p=>`<div><div class="st" style="height:${(p.ok+p.no)/mx*86}px">${p.ok?`<i class="a" style="height:${p.ok/(p.ok+p.no)*100}%"></i>`:''}${p.no?`<i class="b" style="height:${p.no/(p.ok+p.no)*100}%"></i>`:''}</div><span>${parseD(p.d).getDate()}</span></div>`).join('')}</div>
   <div class="legend"><span><i style="background:var(--moss)"></i>의도대로</span><span><i style="background:var(--copper)"></i>흘러감·멈춤</span></div></section>
  <section class="card"><div class="lbl"><span>나를 끌고 가는 것</span><span>${S.rescues.length}번</span></div>${Object.keys(trig).length?Object.entries(trig).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="trig"><span>${esc(k)}</span><b>${n}</b></div><div class="hb"><i style="width:${n/tm*100}%"></i></div>`).join(''):'<p class="help">"흘러가고 있다"를 누를 때마다 무엇이 끌었는지 쌓인다. 가장 긴 막대부터 규칙과 차단으로 막는다.</p>'}</section>
  </div><div class="col">
  <section class="card"><div class="lbl"><span>하루 돌아보기</span><span>${evs.length}</span></div>${evs.length?evs.slice(0,30).map(([d,e])=>`<div class="ent"><small>${esc(d)} · ${e.score}/5</small>${esc(e.note||'')}</div>`).join(''):'<p class="help">셧다운 시간에 하루를 돌아보면 여기 쌓인다.</p>'}</section>
  <section class="card"><div class="lbl"><span>최근 세션</span><span>${S.sessions.length}</span></div>${S.sessions.length?S.sessions.slice().reverse().slice(0,20).map(s=>`<div class="ent"><small>${esc(ymd(s.t))} ${hm(s.t)}–${hm(s.end)} · ${Math.round((s.end-s.t)/60000)}분 / 계획 ${s.plan+s.ext}분 · ${s.how==='done'?'끝냄':s.how==='closed'?'덮음':'그만둠'}</small>${esc(s.purpose)}</div>`).join(''):'<p class="help">지금 탭에서 이유를 정하고 시작하면 여기 쌓인다.</p>'}</section>
  </div></div>`;
}

/* ---------- 시작 ---------- */
scheduleBell();render();
document.addEventListener('pointerdown',unlockAudio,{once:true});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
</body>
</html>
