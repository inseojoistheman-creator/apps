<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16212B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="리부트">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>리부트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 한 손에 쥐는 회복 기록장. 위에는 오늘의 숫자와 지금 할 일, 아래 탭으로 충동·계획·배우기·기록을 오간다. 맥에서는 가운데 두 단으로 펼친다. */
:root{
  --bg:#EDF0F2; --card:#FAFBFC; --sunk:#E2E7EA; --line:#D3DADF; --ink:#16212B; --mute:#5A6772; --faint:#8995A0;
  --accent:#2E6F8E; --accent-soft:#D5E6EE; --accent-ink:#FFFFFF;
  --good:#2D8A5F; --good-soft:#D7EEE2; --warn:#C27A22; --warn-soft:#F5E6D0; --urge:#C8443A; --urge-soft:#F6DCD8;
  --f-head:"Hahmlet","Noto Serif KR",serif;
  --f-body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1519; --card:#161E24; --sunk:#1C262D; --line:#26323A; --ink:#E3EAEE; --mute:#97A5AF; --faint:#66737D;
  --accent:#6FB2D2; --accent-soft:#1D3542; --accent-ink:#0B1A22;
  --good:#5CC392; --good-soft:#173328; --warn:#E3A452; --warn-soft:#3A2B17; --urge:#F07B70; --urge-soft:#3D1D1A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1519; --card:#161E24; --sunk:#1C262D; --line:#26323A; --ink:#E3EAEE; --mute:#97A5AF; --faint:#66737D;
  --accent:#6FB2D2; --accent-soft:#1D3542; --accent-ink:#0B1A22;
  --good:#5CC392; --good-soft:#173328; --warn:#E3A452; --warn-soft:#3A2B17; --urge:#F07B70; --urge-soft:#3D1D1A; color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.3}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:22px;letter-spacing:-.01em}
.top .sync{font-size:11.5px;color:var(--faint);margin-left:auto}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px}
#wakeBtn.on{border-color:var(--accent);color:var(--accent)}
@media (max-width:380px){.top .sync{display:none}}
.page{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.page>.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:820px){.page{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-size:17px;margin-bottom:6px}
.card h3{font-size:15px;margin-bottom:4px}
.lbl{font-size:12px;letter-spacing:.04em;color:var(--mute);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--mute)}
.small{font-size:13px}
.help{font-size:13.5px;color:var(--mute);margin:0}
.help b{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.good.on{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.chip.bad.on{background:var(--urge);border-color:var(--urge);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.dang{color:var(--urge);border-color:color-mix(in srgb,var(--urge) 40%,var(--line))}
.btn.wide{width:100%}
.txt{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font:inherit;color:inherit}
textarea.txt{resize:vertical;min-height:90px;line-height:1.6}
/* hero */
.hero{background:var(--ink);color:var(--bg);border:0;position:relative;overflow:hidden}
.hero .eyebrow{font-size:12px;letter-spacing:.08em;opacity:.7}
.hero .big{font-family:var(--f-num);font-size:64px;font-weight:700;line-height:1;margin:6px 0 2px;letter-spacing:-.02em}
.hero .big small{font-size:20px;font-weight:500;margin-left:6px;font-family:var(--f-body)}
.hero .sub{font-size:13.5px;opacity:.8}
.hero .goalbar{height:8px;background:color-mix(in srgb,var(--bg) 18%,transparent);border-radius:4px;overflow:hidden;margin:14px 0 6px}
.hero .goalbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hero .ticks{display:flex;justify-content:space-between;font-size:11.5px;opacity:.7}
.hero .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.hero .stats div{background:color-mix(in srgb,var(--bg) 9%,transparent);border-radius:12px;padding:8px 10px}
.hero .stats small{display:block;font-size:11px;opacity:.7}
.hero .stats b{font-family:var(--f-num);font-size:18px}
.sosbtn{width:100%;border:0;border-radius:16px;padding:18px;background:var(--urge);color:var(--accent-ink);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.sosbtn small{font-weight:500;font-size:13px;opacity:.9}
.phase{border-left:0}
.phase .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.pillars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pillar{border:1px solid var(--line);background:transparent;border-radius:12px;padding:8px 2px;text-align:center;font-size:11.5px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:3px}
.pillar .ic{font-size:18px;line-height:1}
.pillar.on{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
@media (max-width:420px){.pillars{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dots{display:flex;gap:3px;justify-content:center}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.quote{font-family:var(--f-head);font-size:15.5px;line-height:1.65}
.quote cite{display:block;font-family:var(--f-body);font-style:normal;font-size:12.5px;color:var(--mute);margin-top:6px}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 0;font-size:13px}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.checkrow:last-child{border-bottom:0}
.checkrow input{width:20px;height:20px;margin-top:2px;accent-color:var(--good);flex:none}
.checkrow label{flex:1;min-width:0}
.checkrow small{display:block;color:var(--mute);font-size:12.5px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:9px 10px}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--faint);padding:0 4px;font-size:16px;line-height:1}
.plan{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:14px}
.plan b{color:var(--accent)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;justify-content:center;gap:4px}
nav.tabs button{flex:1;max-width:130px;border:0;background:none;border-radius:10px;padding:6px 0;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.tsos{color:var(--urge)}
/* learn */
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{border:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden}
.lesson>button{width:100%;text-align:left;border:0;background:none;padding:13px 14px;display:flex;gap:10px;align-items:center}
.lesson .no{font-family:var(--f-num);font-size:12px;color:var(--faint);width:26px;flex:none}
.lesson .tt{flex:1;min-width:0;font-weight:700}
.lesson .tt small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
.lesson .ok{font-size:12px;color:var(--good);font-weight:700}
.lesson .body{padding:0 16px 16px 50px;font-size:14.5px}
.lesson .body p{margin:0 0 10px}
.lesson .body ul{margin:0 0 10px;padding-left:18px}
.lesson .body li{margin-bottom:4px}
.lesson .body .voice{background:var(--sunk);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.lesson .body .do{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.lesson .body .do b{color:var(--accent)}
@media (max-width:520px){.lesson .body{padding-left:16px}}
.partttl{font-family:var(--f-head);font-size:16px;margin:10px 2px 2px}
/* records */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .d{aspect-ratio:1;border-radius:7px;background:var(--sunk);font-size:11px;display:flex;align-items:flex-start;justify-content:flex-end;padding:3px 5px;color:var(--faint);border:0;max-width:100%}
.cal .d.c{background:var(--good-soft);color:var(--good)}
.cal .d.s{background:var(--urge-soft);color:var(--urge)}
.cal .d.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal .h{font-size:11px;color:var(--faint);text-align:center}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:9px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .v{font-family:var(--f-num);font-size:12px;color:var(--mute);text-align:right}
.entry{border-bottom:1px solid var(--line);padding:10px 0}
.entry:last-child{border-bottom:0}
.entry .meta{font-size:12px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.entry .tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;margin-top:3px}
/* SOS overlay */
.sos{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sos .in{max-width:620px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.ring{position:relative;width:220px;height:220px;margin:4px auto 0;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-family:var(--f-num);font-size:44px;line-height:1}
.ring .c small{font-size:12.5px;color:var(--mute);margin-top:6px}
.mantra{font-family:var(--f-head);font-size:19px;text-align:center;line-height:1.55;min-height:3.2em;display:flex;align-items:center;justify-content:center}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.act b{font-size:14.5px}
.act small{font-size:12.5px;color:var(--mute)}
.act.on{border-color:var(--good);background:var(--good-soft)}
.no-btn{width:100%;border:0;border-radius:16px;padding:16px;background:var(--ink);color:var(--bg);font-family:var(--f-head);font-size:24px;font-weight:700}
.redx{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;pointer-events:none}
.redx svg{width:min(80vw,420px);height:min(80vw,420px);animation:xpop .9s ease-out forwards}
@keyframes xpop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.08);opacity:1}70%{opacity:1}100%{transform:scale(1.2);opacity:0}}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lock .box{max-width:320px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pinpad button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 0;font-family:var(--f-num);font-size:20px}
.pindots{display:flex;gap:10px;justify-content:center}
.pindots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--mute)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,14,18,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:640px){.overlay{align-items:center}}
.dialog{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.dialog h3{font-size:18px;margin-bottom:6px}
.dialog .acts2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:90;max-width:calc(100% - 32px);text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
@media (prefers-reduced-motion:reduce){.redx svg{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="topTitle">리부트</h1>
    <span class="sync" id="syncTxt">이 기기에만 저장</span>
    <button class="iconbtn" id="wakeBtn" aria-pressed="true">화면 켜둠</button>
    <button class="iconbtn" id="setBtn" aria-label="설정">설정</button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="화면">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>오늘</button>
  <button data-v="sos" class="tsos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>충동</button>
  <button data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>계획</button>
  <button data-v="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/></svg>배우기</button>
  <button data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>기록</button>
</nav>
<div id="sosLayer"></div>
<div id="ovl"></div>
<div id="lockLayer"></div>
<div class="toast" id="toast" hidden></div>
<script>
/* ---------- 책 내용 (요약·재구성) ---------- */
const PARTS=[
 {k:'brain',t:'1부 · 뇌가 어떻게 걸려드는가'},
 {k:'sym',t:'2부 · 몸과 마음에 나타나는 신호'},
 {k:'reboot',t:'3부 · 리부트: 뇌에 휴식 주기'},
 {k:'hard',t:'4부 · 리부트 중에 찾아오는 것들'},
 {k:'trap',t:'5부 · 리부트를 무너뜨리는 함정'},
 {k:'urge',t:'6부 · 충동을 넘기는 기술'},
 {k:'life',t:'7부 · 뇌의 균형을 되찾는 생활'},
 {k:'faq',t:'8부 · 자주 묻는 질문과 맺음말'}
];
const LESSONS=[
/* 1부 */
{id:'dopa',p:'brain',t:'도파민은 만족이 아니라 "더"를 말한다',s:'보상회로가 하는 일',h:`
<p>뇌 깊숙한 곳의 보상회로는 생존과 번식에 도움이 되는 것, 곧 음식·성·사랑·우정·새로움을 좇게 만든다. 이걸 <b>자연 보상</b>이라 한다.</p>
<p>그 엔진이 도파민이다. 도파민의 메시지는 "됐다, 만족한다"가 아니라 <b>"계속 가라, 만족이 바로 저기 있다"</b>에 가깝다. 그래서 도파민은 '좋아함'보다 '원함'의 화학물질이다.</p>
<p>중독은 한마디로 <b>원함이 폭주한 상태</b>다. 약물이든 행동이든 보상회로는 하나뿐이고, 중독에서 생기는 핵심 변화도 같다.</p>
<div class="do"><b>오늘 기억할 것</b> · 강하게 "원한다"는 느낌이 곧 "필요하다"는 뜻은 아니다. 도파민이 내는 소리일 뿐이다.</div>`},
{id:'novel',p:'brain',t:'새로움, 새로움, 또 새로움',s:'쿨리지 효과와 클릭 한 번의 세계',h:`
<p>짝짓기를 마친 동물도 새 상대가 나타나면 다시 의욕이 살아난다. 이를 <b>쿨리지 효과</b>라 한다. 새로운 것 앞에서 도파민이 다시 솟기 때문이다.</p>
<p>인터넷은 이 성질을 정확히 겨눈다. 한 페이지에 수십 개의 새 영상, 여러 개의 탭, 끝없는 검색. 조상들이 평생 보지 못한 '새로운 상대'를 몇 분 만에 넘긴다. 실제로는 화면 앞에서 보낸 시간뿐인데 뇌는 엄청난 보물을 찾은 줄 안다.</p>
<p>그래서 이 중독의 정체는 '야한 것'이 아니라 <b>화면 속 새로움</b>에 대한 중독이다.</p>`},
{id:'super',p:'brain',t:'초정상 자극',s:'가짜 알을 품는 새, 맥주병에 반한 딱정벌레',h:`
<p>노벨상 수상자 틴베르헌은 새들이 진짜 알보다 크고 화려한 가짜 알을 더 품으려 한다는 걸 발견했다. 어떤 딱정벌레 수컷은 진짜 암컷을 두고 갈색 맥주병에 매달린다. 이렇게 진짜보다 과장된 가짜 자극을 <b>초정상 자극</b>이라 한다.</p>
<p>위험해지는 조건은 네 가지다.</p>
<ul><li>우리가 본래 끌리게 진화한 것(고칼로리 음식, 성적 흥분)의 <b>과장된 버전</b>이다</li><li><b>끝없이</b> 손쉽게 얻을 수 있다</li><li>종류가 <b>엄청나게 다양</b>하다</li><li>그래서 <b>만성적으로 과소비</b>하게 된다</li></ul>
<p>정크푸드가 대표적이다. 그런데 음식은 배가 차면 멈추지만, 화면에는 그런 한계가 없다. 잠과 화장실 말고는 끊을 이유가 없어서 몇 시간이고 이어진다.</p>
<p>게다가 놀람·충격·불안·탐색도 도파민을 올린다. 그래서 같은 자극에 무뎌질수록 더 세고 낯선 쪽으로 옮겨 가기 쉽다.</p>`},
{id:'four',p:'brain',t:'뇌에 생기는 네 가지 변화',s:'모든 중독에 공통인 핵심',h:`
<p>지나친 자극이 오래 이어지면 뇌는 스스로를 지키려고 적응한다. 문제는 그 적응이 나에게 불리하다는 것이다.</p>
<ul>
<li><b>탈감작</b> · 쾌감에 무뎌진다. 도파민 신호가 줄어 일상의 즐거움이 밍밍해지고, 같은 효과를 내려면 더 큰 자극이 필요해진다.</li>
<li><b>민감화</b> · 그 자극에 대한 '초강력 기억'이 생긴다. 컴퓨터를 켜는 것, 혼자 있는 것 같은 신호만으로 갑자기 강한 갈망이 터진다. 마치 출구가 하나뿐인 터널에 들어간 느낌이다.</li>
<li><b>전두엽 기능 저하</b> · 충동을 누르고 결과를 내다보는 앞이마 쪽 뇌가 약해진다. 머릿속에서 줄다리기가 벌어지고, 약해진 쪽이 대개 진다.</li>
<li><b>스트레스 회로 이상</b> · 작은 스트레스에도 갈망과 재발이 일어난다.</li>
</ul>
<div class="voice">이 변화들이 말을 한다면 · 탈감작은 "아무것도 만족스럽지 않아", 민감화는 "네게 딱 필요한 게 여기 있어", 전두엽은 "안 좋은 생각인데… 못 말리겠다", 스트레스 회로는 "지금 당장 뭐라도 필요해!"라고 한다.</div>
<p>좋은 소식은 <b>회복하면 이 변화들이 되돌아간다</b>는 것이다. 뇌는 천천히 '정상적으로 원하는 법'을 다시 배운다.</p>`},
{id:'fosb',p:'brain',t:'시멘트를 붓는 일꾼, 델타포스비',s:'반복이 습관을 굳히는 원리',h:`
<p>도파민이 크게 솟을 때마다 <b>델타포스비(DeltaFosB)</b>라는 단백질이 보상회로에 조금씩 쌓인다. 도파민이 "이거 중요해, 다시 해!"라고 외치는 감독이라면, 델타포스비는 실제로 시멘트를 붓는 일꾼이다.</p>
<p>쌓일수록 그 행동을 반복하고 싶은 충동이 커지고, 민감화가 생기고, 계속되면 탈감작까지 온다. 폭식, 강박적 탐색이 모두 이 길을 탄다.</p>
<p>반대로 반복을 멈추면 쌓인 것은 서서히 줄어든다. 그래서 리부트에는 <b>시간</b>이 필요하다.</p>`},
{id:'cond',p:'brain',t:'함께 발화하면 함께 연결된다',s:'무의식적인 성적 조건화',h:`
<p>뇌는 흥분을 느낀 순간에 함께 있던 것들을 묶어서 기억한다. 신경세포는 함께 발화하면 함께 연결된다. 파블로프의 개가 종소리에 침을 흘리게 된 것과 같은 원리다.</p>
<p>그래서 화면을 보며 흥분을 반복하면 의식하지 못한 채 <b>화면, 끝없는 새로움, 클릭해서 넘기기, 구부정한 자세, 침대에서 폰 보기</b> 같은 것 자체가 흥분의 신호로 묶인다.</p>
<p>의식적으로 "저건 연출이야"라고 아는 것만으로는 이 무의식적 학습을 막지 못한다. 뇌의 원시적인 부분의 원칙은 단순하다. "도파민 = 좋은 것."</p>`},
{id:'teen',p:'brain',t:'십 대의 뇌가 특히 잘 휘는 이유',s:'가소성의 양날',h:`
<p>청소년기의 중요한 과제 중 하나는 성에 대해 배우는 것이다. 그래서 이 시기의 뇌는 주변의 성적 신호에 아주 빠르게 연결된다. 새롭고 충격적인 자극은 어른 뇌보다 십 대 뇌를 훨씬 크게 흔든다.</p>
<p>12살 무렵부터 뇌는 쓰는 연결은 남기고 안 쓰는 연결은 잘라 내며 정리한다. 이 시기에 생긴 강한 연결은 오래간다.</p>
<p>같은 가소성이 회복의 근거이기도 하다. <b>뇌는 바뀔 수 있고, 행동을 바꾸면 뇌 구조가 바뀐다.</b> 다만 일찍 시작한 사람은 되돌리는 데 시간이 더 걸릴 수 있다.</p>`},
{id:'test',p:'brain',t:'중독인지 아닌지의 기준',s:'부정적 결과에도 계속하는가',h:`
<p>내성(점점 센 자극이 필요함)이나 심한 금단 증상은 중독의 필수 조건이 아니다. 모든 중독 평가에 공통인 기준은 하나다. <b>"나쁜 결과를 겪으면서도 계속하는가."</b></p>
<p>책은 무엇이 원인이고 무엇이 결과인지 가리는 가장 좋은 방법으로 <b>직접 실험</b>을 권한다. 의심되는 변수를 한동안 빼 보고 무엇이 달라지는지 보는 것이다. 처음부터 인터넷을 안 쓰던 대학 신입생 중 중독된 이들에게 1년 뒤 우울·불안이 늘었다는 연구처럼, 중독이 정신 건강 문제를 만들 수 있다는 근거도 쌓이고 있다.</p>`},
/* 2부 */
{id:'signs',p:'sym',t:'끊고 나서 사람들이 알아챈 변화',s:'집중력, 기분, 자신감',h:`
<p>그만둔 사람들이 흔히 보고하는 변화다. 모두에게 다 나타나지는 않는다.</p>
<ul>
<li><b>집중력</b> · 브레인 포그가 걷히고, 생각이 맑아지고, 기억력이 좋아졌다. 긴 강의를 버틸 수 있게 됐다.</li>
<li><b>기분과 에너지</b> · 우울감과 무가치감이 줄고, 아침에 일어나기가 쉬워졌다. 우울은 낮은 에너지·낮은 동기의 상태이고, 그 중심에 도파민 신호가 있다.</li>
<li><b>사회성과 자존감</b> · 사람과 연결되고 싶은 마음이 커지고, 눈을 마주치고, 농담이 늘고, 위축되지 않게 됐다.</li>
<li><b>실제 사람에게 끌림</b> · 화면이 아닌 현실의 사람이 다시 매력적으로 보이기 시작했다.</li>
</ul>
<div class="do"><b>해 볼 것</b> · 기록 탭에서 매일 기분·에너지를 남긴다. 몇 주 뒤 직접 비교해 보는 게 어떤 설명보다 설득력 있다.</div>`},
{id:'body',p:'sym',t:'성 기능에 문제가 느껴진다면',s:'먼저 병원, 그다음 리부트',h:`
<p>책은 화면 자극에 길들여진 뇌 때문에 실제 관계에서 성 기능 문제가 생기는 사례를 많이 다룬다. 젊은 사람에게서도 늘고 있다고 한다.</p>
<p>먼저 <b>비뇨기과에서 신체적 원인이 없는지 확인</b>하는 것이 첫 단계다. 신체 문제가 없다면, 화면 자극을 끊고 시간이 지나며 회복된 사례가 많다. 이 경우 더 오래 걸리기도 한다(뒤의 '플랫라인' 참고).</p>`},
/* 3부 */
{id:'what',p:'reboot',t:'리부트란 무엇인가',s:'인공적인 성적 자극에서 몇 달 쉬기',h:`
<p>첫걸음은 <b>모든 인공적인 성적 자극에서 몇 달간 뇌를 쉬게 하는 것</b>이다. 그러면 다음 네 가지가 일어난다.</p>
<ul><li>보상회로의 감도가 돌아와 일상의 즐거움을 다시 느낀다</li><li>"당장 해야 해!" 경로의 세기가 줄어든다</li><li>의지력(전두엽)이 다시 선다</li><li>스트레스가 심한 갈망을 일으키지 않게 된다</li></ul>
<p>'인공적인 성적 자극'은 영상만이 아니다. 자극적인 SNS·유튜브·사진 넘기기, 야한 글, 채팅, 그 장면을 떠올리는 판타지까지, 뇌가 같은 방식으로 쓰던 것이면 모두 해당한다. 알코올 중독자가 도수 낮은 맥주로 바꾸는 것과 같아서 소용이 없다.</p>
<div class="voice">어느 회복자의 비유 · 즐거움의 원천 하나를 빼는 건 탁자 다리 하나를 빼는 것과 같다. 뇌는 처음엔 온갖 방법으로 아프게 해서 다리를 도로 끼우게 하려 한다. 그러다 다리가 정말 없다는 걸 받아들이고 균형을 다시 잡는다.</div>
<p>얼마나 할지는 내가 정한다. 많은 이들이 <b>100일(약 3개월)</b>을 목표로 잡고 그 사이에 작은 목표를 둔다. 리부트는 <b>나의 실험실</b>이다. 결과가 안 나오면 조정하되, 한 방법은 적어도 두 달은 유지해 본다.</p>
<p>주의할 점이 있다. 다 회복한 뒤에 "이제 괜찮겠지" 하고 돌아가면, 깊게 파인 경로가 쉽게 되살아난다.</p>`},
{id:'access',p:'reboot',t:'접근을 끊는 환경 만들기',s:'삭제, 재배치, 차단기',h:`
<ul>
<li><b>모두 지운다</b> · 파일, 북마크, 방문 기록, 백업과 휴지통까지. 변하겠다는 결심이 진짜라는 신호를 뇌에 보낸다.</li>
<li><b>가구 배치를 바꾼다</b> · 늘 쓰던 장소와 자세는 그 자체로 도파민을 부르는 신호다. 책상 방향을 바꾸거나, 기기를 덜 사적인 곳에서 쓰거나, 서서 쓰는 책상으로 바꾼 사람들도 있다.</li>
<li><b>차단기를 쓴다</b> · 차단기는 완벽하지 않다. 과속방지턱처럼 "내가 정말 이걸 원하나?" 생각할 시간을 벌어 준다. 자제력이 약한 초기에 특히 도움이 되고, 나중엔 필요 없어진다.</li>
<li><b>광고 차단기를 쓴다</b> · 다른 일을 하다 자극적인 광고에 걸리는 일을 막는다.</li>
</ul>
<div class="voice">게임을 많이 하는 사람이라면 · 차단기를 '뚫어야 할 퀘스트'처럼 여기게 될 수 있다. 그렇다면 차단기를 지우고 다른 방법을 쓴다.</div>
<div class="do"><b>해 볼 것</b> · 계획 탭의 '환경 정리' 목록을 하나씩 체크한다.</div>`},
{id:'count',p:'reboot',t:'날짜 세기의 장점과 함정',s:'숫자보다 뇌의 균형',h:`
<p>날짜를 세고 막대가 차는 걸 보는 건 큰 동기가 된다. 하지만 함정이 있다. 한 번 넘어지면 "어차피 날짜 몇 개 안 날아가니까" 하며 며칠 몰아서 쓰게 된다. <b>몰아 쓰기는 한 번의 실수보다 훨씬 많이 되돌린다.</b></p>
<p>정말 중요한 건 날짜가 아니라 <b>뇌의 균형</b>이다. 뇌는 정해진 일정대로 돌아오지 않고, 운동·사람·자연·자제력·자기 돌봄도 균형을 돕는다.</p>
<div class="do"><b>이 앱에서는</b> · 연속 일수와 함께 '지킨 날 합계'를 크게 보여 준다. 넘어져도 쌓아 온 날은 사라지지 않는다. 그리고 작은 목표(3·7·14·30일…)를 하나씩 넘긴다.</div>`},
{id:'exti',p:'reboot',t:'소거 훈련 (모두에게 맞지는 않다)',s:'종을 울리고 고기를 주지 않기',h:`
<p>파블로프는 개가 종소리에 침을 흘리게 만든 뒤, 종을 울리고 고기를 주지 않는 걸 반복해서 그 반응을 없앴다. 이것이 <b>신호 소거</b>다.</p>
<p>원치 않는 자극을 우연히 마주쳤을 때 <b>바로 닫는 것</b>은 의지력을 키운다. 하지만 일부러 자극에 다가가 시험하는 방식은 한 번 보면 무너지는 사람에게 위험하다. 그렇다면 운동이나 명상처럼 간접적으로 의지력을 키우는 방법부터 쓴다.</p>`},
{id:'support',p:'reboot',t:'혼자 싸우지 않는다',s:'함께하는 사람, 상담, 일지',h:`
<ul>
<li><b>함께하는 사람</b> · 같은 목표를 가진 모임이나 서로 점검해 주는 파트너가 가장 힘든 순간에 힘이 된다. 다만 온라인 활동이 또 다른 도피가 되면 안 된다. 중요한 건 지지를 어디서 받느냐보다 <b>받는다는 것</b> 자체다.</li>
<li><b>상담과 의료</b> · 행동 중독을 진짜 중독으로 이해하는 상담자는 큰 도움이 된다. 다른 어려움이 함께 있거나 금단 불안이 너무 심하면 의사와 상의한다.</li>
<li><b>일지</b> · 리부트는 직선이 아니다. 나쁜 날엔 뇌가 "하나도 안 나아졌어, 희망 없어"라고 속삭인다. 그때 지난 일지를 읽으면 금세 시야가 돌아온다. 남에게 말 못 할 것을 털어놓는 곳도 된다. 비밀번호를 걸어 둔다.</li>
</ul>
<div class="do"><b>이 앱에서는</b> · 기록 탭에 일지가 있고, 설정에서 잠금 번호를 걸 수 있다.</div>`},
/* 4부 */
{id:'wd',p:'hard',t:'금단 증상',s:'첫 두 주가 가장 힘들다',h:`
<p>오랜 과자극을 멈추면 실제 신경화학적 변화가 일어난다. 스트레스 반응이 과해지고, 그것 없이는 세상이 온통 회색이고 무의미하게 느껴진다.</p>
<p><b>흔한 증상</b> · 짜증, 불안이나 공황, 이유 없는 눈물, 안절부절, 무기력, 두통, 브레인 포그, 우울, 기분 기복, 혼자 있고 싶음, 근육 긴장, 불면, 강한 갈망.</p>
<p><b>덜 흔한 증상</b> · 잦은 소변, 떨림, 메스꺼움, 가슴 답답함, 절망감, 열감이나 오한, 폭식이나 입맛 없음, 몽정.</p>
<p>보통 <b>첫 2주</b>가 가장 힘들다. 어떤 사람은 몇 달 동안 간헐적으로 증상이 이어진다(급성기 이후 금단, PAWS). 좋은 날이 점점 많아지지만, 나쁜 날도 한동안 섞여 온다. 남의 회복 속도와 비교하지 않는다.</p>
<div class="voice">어느 회복자 · 하루에도 좋은 날과 최악의 날이 오갔다. 견디기 힘들었지만, 무언가 스스로 바로잡히고 있다는 신호 같아서 안심이 됐다.</div>
<p>기분이 크게 출렁이는 것은 무뎌졌던 감각이 돌아오는 첫 신호인 경우가 많다.</p>
<div class="do"><b>해 볼 것</b> · 오늘 탭의 체크인에서 증상을 표시한다. 몇 주 뒤 줄어드는 게 눈으로 보인다.</div>`},
{id:'flat',p:'hard',t:'플랫라인',s:'모든 게 시들해지는 시기',h:`
<p>며칠의 갈망 뒤에, 몇 주 동안 성욕이나 관심이 거의 사라지는 시기가 오기도 한다. 이를 <b>플랫라인</b>이라 한다. 많은 사람이 여기서 "영영 망가진 건 아닐까" 겁을 먹고 돌아간다.</p>
<p>하지만 이 시기를 버틴 사람들은 대개 다시 돌아왔다고 보고한다. 어떤 이는 7주쯤에 끝났고, 더 오래 걸린 이도 있다. 모두가 겪지는 않으며, 강도와 기간은 사람마다 다르다.</p>
<div class="do"><b>기억할 것</b> · 플랫라인은 실패가 아니라 회복 과정의 일부다. 지친 뇌가 쉬며 다시 반응할 준비를 하는 시간으로 본다.</div>`},
{id:'sleep',p:'hard',t:'잠이 안 올 때',s:'피곤은 재발의 방아쇠다',h:`
<p>피곤하면 무너지기 쉽다. 그런데 오랫동안 잠들기 위한 의식처럼 써 왔다면 처음엔 잠이 안 온다. 시간이 지나면 나아진다. 술로 대신하지 않는다. 일찍 깨게 만들고, 또 다른 중독이 될 수 있다.</p>
<ul>
<li>침대에선 노트북·폰을 쓰지 않는다. 피곤할 때만 눕는다.</li>
<li>잠자리 스탠드 하나만 켜고 종이책을 읽는다.</li>
<li>낮에 운동하고 햇볕을 많이 쬔다. 자기 직전 격한 운동은 피한다.</li>
<li>같은 시각에 자고 일어난다. 일찍 일어나 운동하면 밤에 자연히 졸리다.</li>
<li>집중할 수 있는 잔잔한 음악을 튼다.</li>
<li>누워서 감사한 것을 하나씩 떠올린다.</li>
<li>"하룻밤 못 자도 세상이 끝나지 않는다"고 스스로에게 말한다.</li>
</ul>`},
{id:'trig',p:'hard',t:'트리거',s:'신호를 알면 미리 대비할 수 있다',h:`
<p><b>바깥 신호</b> · 자극적인 장면이 나오는 드라마·영화, 떠오르는 장면, 아침의 몸 상태, 술·약물, 관련된 단어, 자극적인 광고, 쇼츠·SNS 피드.</p>
<p><b>마음 상태</b> · 지루함, 불안, 스트레스, 우울, 외로움, 거절당함, 피곤, 좌절, 화남, 실패감, 자기 연민, "수고했으니 보상받아야지", 과신, 질투, 숙취.</p>
<p><b>미루기</b> · 할 일을 미루다 무너지는 경우가 아주 많다. 해야 할 일 목록과, 의욕이 없을 때 할 '안전한 활동' 목록을 따로 만들어 둔다.</p>
<p>신호는 사람마다 다르다. 어떤 이는 부모님이 외출하며 문 닫히는 소리가 신호였다는 걸 깨닫고, 그때마다 산책을 나가거나 친구에게 전화하거나 컴퓨터를 껐다. 어떤 이는 밤 11시에 모든 기기를 끄고 노트북은 옷장에, 폰은 침대에서 먼 곳에 두고 씻은 뒤 책을 읽었다.</p>
<p>트리거 경로는 다 회복한 뒤에도 오래 남는다. 대신 약해진다. 미리 정해 둔 대응이 있으면 넘길 수 있고, 충동은 <b>10~15분</b> 버티면 대개 지나간다.</p>
<div class="do"><b>충동이 오면 스스로 묻는다</b> · 지금 어떤 감정인가? 몇 시인가? 누가 곁에 있나? 방금 뭘 했나? 어디에 있나? 지금 내게 진짜 필요한 걸 채워 줄 다른 일은 뭔가?<br><br>그리고 계획을 적는다. <b>"(트리거)가 오면, (새 행동)을 한다. 그게 내게 (보상)을 주기 때문이다."</b> 마주하고 바꾸기를 반복하면 새 행동이 자동이 된다. 바로 행동할 수 없으면 운동선수처럼 그 행동을 하는 내 모습을 자세히 그려 본다.</div>`},
{id:'emo',p:'hard',t:'감정이 돌아온다',s:'높이 오르려면 낮은 곳도 겪는다',h:`
<p>그만두면 감정이 훨씬 크게 느껴진다. 설명할 수 없는 기쁨도, 무너질 것 같은 슬픔도 온다. 그동안 그것이 모든 감정을 눌러 왔기 때문이다.</p>
<p>시험을 망치면 이제는 대충 넘기지 않고 걱정하게 된다. 아프지만 이게 사람을 자라게 하는 고통이다. 감정은 지나가고, 지나고 나면 더 단단해진다.</p>
<div class="voice">어느 회복자 · 아픔만 골라서 마비시킬 수는 없다. 외로움과 두려움을 무디게 하면 기쁨과 희망과 사랑도 함께 무뎌진다.</div>`},
{id:'chaser',p:'hard',t:'체이서 효과',s:'절정 뒤에 오히려 더 당기는 이유',h:`
<p>절정 뒤 며칠 동안 오히려 갈망이 강해지는 현상을 <b>체이서</b>라 한다. 몽정 뒤에 느끼는 사람도 있다. 방심한 순간 몰아 쓰기로 이어지기 쉽다.</p>
<p>넘어진 뒤 2~3일이 특히 위험한 이유다. 그 며칠은 알고 버티면 된다. 회복이 진행될수록 체이서는 약해지고, 체이서가 거의 없어지는 것이 회복의 신호가 되기도 한다.</p>
<div class="do"><b>이 앱에서는</b> · 넘어졌다고 기록하면 다음 3일 동안 오늘 탭에 '체이서 주의' 카드가 뜬다.</div>`},
{id:'dream',p:'hard',t:'꿈과 플래시백',s:'머릿속 대청소',h:`
<p>그만두면 꿈이 생생해지고 잘 기억난다. 다시 보는 꿈을 꾸기도 하는데, 뇌가 익숙한 회로를 돌려 보는 것이고 점차 사라진다.</p>
<p>낮에 갑자기 떠오르는 장면(플래시백)도 흔하다. <b>머릿속 청소 과정</b>으로 보고, 의미를 붙이지 말고 그냥 지나가게 둔다. 리부트가 실패하고 있다는 증거가 아니다.</p>`},
{id:'shame',p:'hard',t:'수치심의 악순환',s:'자책 대신 자기 연민과 행동',h:`
<p>금지된 것, 위험한 것을 앞두면 도파민이 크게 솟는다. 특히 십 대에서 그렇다. 그래서 몰래 하는 것은 더 자극적으로 느껴지고, 수치심이 들 때 잠깐의 도피처가 된다. 이렇게 <b>수치심 → 몰아 쓰기 → 수치심</b>의 고리가 생긴다.</p>
<p>많은 사람이 이 문제를 <b>뇌의 원리로 다시 이해한 뒤</b> 빠르게 나아졌다. 신앙이 있는 사람들도 마찬가지였다. 도파민이 위험한 행동을 어떻게 몰아가는지, 과자극이 왜 반동으로 갈망을 더 키우는지 알게 되면, 내가 이미 행동을 다스릴 힘이 있다는 걸 깨닫는다.</p>
<p>열쇠는 고통스럽지만 묘하게 자극적인 내면의 싸움에 에너지를 쏟는 대신, <b>건설적인 행동과 자기 연민</b>에 쏟는 것이다.</p>
<div class="voice">그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니 · 로마서 8:1</div>`},
/* 5부 */
{id:'edge',p:'trap',t:'함정 ① 끝없이 미루며 자극 이어 가기',s:'리부트를 가장 많이 무너뜨리는 것',h:`
<p>절정 직전까지 갔다 멈추기를 몇 시간씩 반복하는 것이 가장 흔하게 리부트를 무너뜨린다. 도파민은 절정 직전에 가장 높다. 그 상태를 몇 시간 유지하면 뇌는 지금 보는 것과 흥분을 아주 강하게 묶고, 탈감작도 앞당긴다.</p>
<p>원래 절정 뒤에는 도파민을 기본선으로 내리는 브레이크(프롤락틴)가 걸린다. 브레이크 없이 가속 페달만 밟으면 <b>만족 없는 갈망</b>만 계속된다.</p>`},
{id:'fant',p:'trap',t:'함정 ② 판타지',s:'뇌는 화면과 상상을 구별하지 않는다',h:`
<p>상상은 실제로 하는 것과 비슷한 신경회로를 쓴다. 그래서 예전에 본 장면을 머릿속에서 다시 돌리는 건 다시 보는 것과 거의 같다. 초기엔 판타지를 피하는 게 갈망을 줄이는 데 큰 도움이 된다.</p>
<p>떠오르면 붙잡지 말고 흘려보낸다. 손을 잡거나 미소를 주고받는 것처럼 친밀함에 관한 상상은 오히려 좋은 쪽으로 작용했다는 사람도 있다.</p>`},
{id:'subs',p:'trap',t:'함정 ③ 대체물',s:'"이건 그거 아니잖아"라는 합리화',h:`
<p>"수영복 사진은 아니잖아", "그냥 유튜브인데"라고 합리화하기 쉽다. 하지만 뇌의 원시적인 부분은 무엇이 '그것'인지 모른다. <b>나를 흥분시키느냐 아니냐</b>만 안다.</p>
<p>물어야 할 질문은 이것이다. <b>"어떤 훈련이 지금의 문제를 만들었고, 나는 그걸 반복하고 있는가?"</b> 자극을 찾아 검색하고 클릭하고 넘기는 행동이면 모두 같은 경로를 강화한다. 반대로 우연히 마주친 것을 바로 닫는 건 의지력을 키운다.</p>
<p>방향은 둘 중 하나다. 현실의 사람과 관계를 맺거나, 성과 전혀 상관없는 일(공부, 운동, 친구 만나기)을 한다. 가상의 세계에서 현실로 옮겨 가는 것이 핵심이다.</p>`},
{id:'force',p:'trap',t:'함정 ④ 서두르기',s:'자연스럽게 깨어나기를 기다린다',h:`
<p>회복을 확인하려고 억지로 자극을 시험하면 오히려 늦어진다. 감각은 <b>압박 없이 자연스럽게</b> 돌아오게 둔다. "다 쓰기보다 아쉬움을 남기는 편이 낫다."</p>`},
{id:'fetish',p:'trap',t:'함정 ⑤ "이게 원래 나야"라는 착각',s:'취향도 만들어질 수 있다',h:`
<p>탈감작이 오면 뇌는 더 센 것, 낯선 것, 충격적인 것에서 도파민을 찾는다. 그래서 예전 취향이 시시해지고 엉뚱한 쪽으로 끌리면서 "내가 원래 이런 사람인가" 혼란에 빠지기 쉽다. 확인하려고 이것저것 보는 건 더 깊이 빠지게 할 뿐이다.</p>
<p>뇌에 필요한 건 시험이 아니라 <b>휴식</b>이다. 몇 달 끊고 나면 화면이 만든 취향은 흐려지는 경우가 많다. 만족은 더 센 자극 쪽이 아니라 <b>균형 잡힌 뇌</b> 쪽에 있다.</p>`},
/* 6부 */
{id:'plan',p:'urge',t:'충동은 오기 전에 다룬다',s:'미리 짜 두는 계획',h:`
<ul>
<li>처음 며칠은 <b>집에 있는 시간을 줄인다</b>. 도서관, 서점, 공원에서 책을 읽는다. 늘 쓰던 장소에서 멀어지는 것만으로 첫 금단을 넘기기 쉬워진다.</li>
<li><b>그만두는 이유 목록</b>을 지금 만들고, 충동이 오면 읽는다.</li>
<li>충동에 지면 그 뒤 하루가 어떻게 흘러가는지 <b>미래의 나에게 편지</b>를 쓴다. 잠깐의 안도, 한 시간 뒤의 에너지 저하와 멍함, 불안, 미뤄지는 일, 다음 날까지 이어지는 무기력.</li>
<li>충동이 오면 대신 할 일 목록을 만든다.</li>
</ul>
<div class="do"><b>이 앱에서는</b> · 계획 탭에 이유 목록, 미래의 나에게 쓰는 편지, 대신 할 일 목록이 있고, 충동 버튼을 누르면 바로 보여 준다.</div>`},
{id:'tech',p:'urge',t:'충동을 넘기는 기술 모음',s:'레드 X부터 "오늘만은 안 한다"까지',h:`
<ul>
<li><b>레드 X</b> · 장면이 떠오르는 즉시 그 위에 커다란 빨간 X를 그리고 사이렌 소리를 상상한다. 끈질기면 폭파시킨다. 바로 하는 게 핵심이고, 할수록 자동이 된다.</li>
<li><b>그냥 지켜보기</b> · "갈망이 왔다. 아무 데서나 왔고, 내게 힘이 없다. 나는 내 생각이 아니다. 내가 부르지 않았고, 원하지 않고, 따를 필요도 없다." 대개 흔적 없이 사라진다.</li>
<li><b>뇌와 토론하지 않는다</b> · 뇌는 어떻게든 합리화한다. 따지지 말고 생각이 왔다는 것만 알아차리거나, 한 단어로 답한다. <b>"아니."</b></li>
<li><b>찬물</b> · 찬물로 씻으면 갈망이 꺾인다.</li>
<li><b>에너지를 위로</b> · 하체의 긴장을 가슴과 상체로 끌어올린다고 상상한다. 힘이 넘치는 느낌으로 바뀐다.</li>
<li><b>"이번이 마지막"을 버린다</b> · 대신 <b>"오늘만은 안 한다"</b>로 바꾼다.</li>
<li><b>선택지에서 지운다</b> · 매일 충동과 싸우지 말고, 그것이 없는 사람처럼 산다. 다시는 안 봐도 괜찮다고 받아들인다.</li>
<li><b>기기를 끄고 생각한다</b> · 통제가 안 될 것 같으면 일단 끄고 생각해 본다. 그 뒤에 하더라도 의식하고 하는 것이 변화의 첫걸음이다.</li>
</ul>
<p>모든 충동은 결국 가라앉는다. 대개 15분 안에. 그 '한 번의 나쁜 충동'을 이겨 내면, 내가 충동보다 크다는 걸 알게 된다. 그 너머에 돌파가 있다.</p>
<div class="voice">절대 그만두지 마라 · 한 달 내내 이틀에 한 번 무너져도, 예전보다 절반으로 줄인 것이다. 3년을 애쓴 끝에 15일을 이어 간 사람의 이야기가 가장 큰 감동이었다는 회복자가 있다. 계속 돌아오는 한 실패할 수 없다.</div>`},
/* 7부 */
{id:'exer',p:'life',t:'운동과 이로운 스트레스',s:'가장 보편적으로 효과 있는 방법',h:`
<p>회복자들이 시도한 방법 중 <b>운동</b>이 가장 보편적으로 효과가 있었다. 충동을 돌리는 데 좋고, 자신감과 체력이 늘고, 기분을 조절한다. 짧게 하면 도파민이 오르고, 꾸준히 하면 도파민 신호가 지속적으로 회복되어 회복기의 바닥난 느낌을 메워 준다.</p>
<ul><li><b>팔굽혀펴기</b> · 언제든 할 수 있고, 20개에 30초면 된다. 충동이 남으면 팔이 떨어질 것 같을 때까지 세트를 이어 간다.</li><li><b>근력 운동</b> · 헬스장 기구부터 시작해도 된다.</li><li><b>찬물 샤워</b> · 이로운 스트레스의 대표. 의지력과 감정의 평형을 되찾는 데 좋다는 후기가 많다. 무엇이든 지나치지는 않게 한다.</li></ul>`},
{id:'out',p:'life',t:'밖으로, 자연으로',s:'빛나는 사각형 대신 햇빛',h:`
<p>자연 속에서 보내는 시간은 창의성과 문제 해결력을 높인다. 도시라면 공원을 걷는다. 기술에서 떨어져 자연에 있으면 회복이 빨라진다고 느낀 사람들이 많다. 우리는 하루 종일 빛나는 사각형을 보며 재순환 공기를 마시도록 만들어지지 않았다.</p>`},
{id:'people',p:'life',t:'사람과 연결되기',s:'뇌는 혼자서 기분을 오래 조절하지 못한다',h:`
<p>사람은 무리 지어 사는 동물이다. 고립되면 불안하고 우울해지기 쉽고, 그걸 중독으로 달래게 된다. 반대로 연결은 스트레스 호르몬을 낮추는 최고의 보험이다. 익숙한 '위안'에서 눈을 떼면 보상회로는 원래 찾게 되어 있던 것, 곧 다정한 대화·자연·운동·성취·창작을 찾아낸다.</p>
<ul><li>부담 없는 곳부터 · 도서관, 서점, 카페, 공원 벤치에서 책 읽기.</li><li>어색할 때마다 웃는다.</li><li>모임·동아리·봉사, 하루 한 번 모르는 사람에게 작은 친절.</li><li><b>눈맞춤 게임</b> · 지나치는 사람과 눈을 맞춘다. 어르신부터 시작해 점수를 올린다. 익숙해지면 미소, 끄덕임, 인사를 더한다.</li></ul>`},
{id:'medit',p:'life',t:'명상과 호흡',s:'이성의 뇌를 운전석에 앉히기',h:`
<p>매일 명상하면 금단 스트레스가 가라앉고, 앞이마 쪽 이성의 뇌가 운전석을 지키는 데 도움이 된다는 연구가 있다. 중독이 약하게 만든 것을 강하게 하고, 충동적인 원시 뇌는 조용하게 한다.</p>
<div class="voice">어느 회복자 · 꾸준히 명상할 때는 그만둬야 한다는 걸 아는 내가 힘이 셌고, 거르면 지루함과 스트레스를 핑계로 합리화하는 내가 힘이 셌다.</div>
<div class="do"><b>해 볼 것</b> · 충동 화면의 '1분 호흡'을 매일 한 번 한다. 기도로 해도 좋다.</div>`},
{id:'create',p:'life',t:'창작, 취미, 삶의 목적',s:'첫 몇 주는 주의 돌리기 싸움',h:`
<p>첫 몇 주는 <b>무엇으로 시간을 채우느냐</b>의 싸움이다. 일하다 웹서핑, 또 일하다 웹서핑하는 생활을 그대로 두고 변화를 기대할 수는 없다. 새로운 걸 배우고 만드는 건 좋은 주의 돌리기이자 그 자체로 보상이다. 그만둔 뒤 작곡과 연주, 글쓰기를 다시 시작했다는 사람이 많다. 요리, 요가, 악기, 운동, 옷 입는 법 배우기도 있었다.</p>
<p><b>'빈 도파민'을 줄인다</b> · 강렬한 게임, 정크푸드, 도박, SNS 무한 스크롤, 의미 없는 TV. 대신 당장은 덜 짜릿해도 오래가는 만족을 주는 것, 곧 좋은 대화, 정리정돈, 목표 세우기, 누군가를 찾아가기, 뭔가를 만들기를 고른다.</p>
<p>몸이 좋아질수록 스스로를 달랠 필요가 줄어든다. 긴 안목으로 삶의 철학을 세우고, 그대로 살아 본다.</p>`},
{id:'gentle',p:'life',t:'스스로에게 너그럽게',s:'서핑하듯 유연하게',h:`
<p>비교적 쉽게 리부트하는 사람들은 유머를 잃지 않고, 자신이 사람이라는 걸 받아들이고, 성을 존중하며 천천히 새 길로 들어선다. 스스로를 두들겨 패거나 파멸로 협박하지 않는다. 넘어지면 용서하고 계속 간다.</p>
<p>뇌를 이해하는 것도 큰 힘이 된다. 어떻게 여기까지 왔고 어떻게 방향을 틀지 알게 되면 마음이 놓인다. 매일 영감을 받을 곳을 정해 둔다. 좋아하는 책이나 말씀처럼.</p>
<div class="voice">어느 회복자가 도움받은 원칙 · 이루고 싶은 목표를 정하고, 필요한 단계를 정하고, <b>기분과 상관없이</b> 한다. 내키지 않아도 동아리에 들고, 말을 걸고, 모임에 나갔더니 결국 좋은 친구들이 생겼다.</div>`},
/* 8부 */
{id:'faq1',p:'faq',t:'얼마나 해야 하나?',s:'정해진 날짜는 없다',h:`
<p>60일, 90일 같은 정답은 없다. 문제가 얼마나 깊은지, 뇌가 어떻게 반응하는지, 목표가 무엇인지에 달렸다. 리부트는 <b>무엇이 진짜 나이고 무엇이 그것 때문이었는지</b> 발견하는 과정이다. 집중력, 사회불안, 넘치는 성욕, 우울이 무엇에서 왔는지 알게 되면 스스로 배를 몰 수 있다.</p>`},
{id:'faq2',p:'faq',t:'자위도 끊어야 하나?',s:'사람마다 다르다',h:`
<p>꼭 그렇지는 않다. 먼저 영상·판타지·대체물을 끊어 본다. 그것만으로 균형이 돌아오는 사람도 있다. 하지만 자위 자체가 강한 트리거가 되어 예전 경로로 이어진다면 한동안 쉬는 편이 낫다. 성 기능 문제가 있다면 대부분 한동안 크게 줄여야 했다고 한다. 부러진 다리를 깁스하는 것처럼, 강한 자극 없이 뇌가 나을 시간을 준다. 억지로 하지는 않는다.</p>`},
{id:'faq3',p:'faq',t:'회복됐다는 걸 어떻게 아나?',s:'좋은 신호들',h:`
<ul><li>현실의 사람이 훨씬 매력적으로 보이고, 다가가고 싶다</li><li>아침에 몸이 자연스럽게 반응한다</li><li>체이서 없이 지나간다</li><li>성욕의 결이 달라진다. 훔쳐보고 싶은 마음은 사라지고 더 건강한 끌림이 남는다</li></ul>
<p>젊은 사람일수록 리부트 기간이 끝난 뒤에도 오래 좋아지는 경우가 많다.</p>`},
{id:'faq4',p:'faq',t:'그냥 성욕이 강한 건 아닐까?',s:'끊어 보면 안다',h:`
<p>몇 주 끊고 나서 성욕이 어떤지 본다. 많은 사람이 화면 없이는 생각보다 별로 당기지 않는다는 걸 발견하고 놀란다. 강한 성욕이 아니라 <b>갈망</b>이 몰아붙이고 있었던 것이다. 뇌가 원한 건 해소가 아니라 잠깐의 도파민이었다.</p>`},
{id:'end',p:'faq',t:'맺음말 · 직접 실험해 보라',s:'정크푸드를 식단에서 빼듯이',h:`
<p>전문가들의 합의를 기다릴 필요는 없다. 그만두는 건 검증 안 된 수술이나 위험한 약이 아니다. <b>정제 설탕이나 트랜스지방을 식단에서 빼는 것</b>과 같다. 얼마 전까지 아무도 없이 잘 살던 오락 하나를 빼는 것뿐이다.</p>
<p>담배가 그랬듯, 확실한 연구가 쌓이는 데는 수십 년이 걸린다. 그사이에 남의 주장이 아니라 <b>내 경험</b>으로 판단한다. 직접 겪어 보면 누구의 선전에도 속지 않는다.</p>
<p>책의 서문을 쓴 신경과학자 앤서니 잭은 말한다. 쉽고 빠른 해결책은 없지만, 집중된 주의는 뇌의 구조를 바꾸고 새 힘을 준다. 가소성 있는 뇌를 잘 훈련하는 최선의 길은 배우고, 탐구하고, 묵상하는 것이고, 그건 시간과 인내가 드는 일이다.</p>`}
];

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffD=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>ymd(Date.now());
const clone=o=>JSON.parse(JSON.stringify(o));
let toastT;function toast(m,ms=2600){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms);}
function dialog(html,bind){$('ovl').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`;const ov=$('ovl').firstChild;ov.onclick=e=>{if(e.target===ov||e.target.hasAttribute('data-close'))closeDialog();};bind&&bind(ov);}
function closeDialog(){$('ovl').innerHTML='';}
function armed(btn,label,fn){if(btn.dataset.arm){fn();return;}btn.dataset.arm=1;const old=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.textContent=old;}},3000);}

/* ---------- 저장 (이 기기 + 아이폰·맥 동기화) ---------- */
const LS='reboot-v1';
let DOCS={};
try{DOCS=JSON.parse(localStorage.getItem(LS)||'{}').docs||{};}catch(e){}
function defState(){return {start:null,goal:100,days:{},reasons:[],letter:'',plans:[],safe:[],todo:[],env:{},read:{},pin:null};}
if(!DOCS.state)DOCS.state=Object.assign(defState(),{updatedAt:0});
const ST=()=>DOCS.state;
let COL=null; const wq={}; const wt={};
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({docs:DOCS}));}catch(e){}}
function touch(name){const d=DOCS[name];if(!d)return;d.updatedAt=Date.now();saveLocal();push(name);}
function push(name){if(!COL)return;clearTimeout(wt[name]);wt[name]=setTimeout(()=>{const body=DOCS[name]?clone(DOCS[name]):null;wq[name]=(wq[name]||Promise.resolve()).then(()=>body?COL.doc(name).set(body):COL.doc(name).delete()).then(()=>{$('syncTxt').textContent='아이폰·맥 동기화';}).catch(()=>{$('syncTxt').textContent='동기화 실패 · 이 기기에는 저장됨';});},500);}
function removeDoc(name){delete DOCS[name];saveLocal();if(COL){clearTimeout(wt[name]);wq[name]=(wq[name]||Promise.resolve()).then(()=>COL.doc(name).delete()).catch(()=>{});}}
(async()=>{try{
  const user=await (window.claude?.use?.('user')??Promise.resolve(null)); const id=user?await user.id():null;
  const db=await (window.claude?.use?.('db')??Promise.resolve(null)); if(!db||!id) return;
  COL=db.collection('data/users/'+id); let first=true;
  COL.onSnapshot(qs=>{let changed=false;const seen=new Set();
    for(const d of qs.docs){seen.add(d.id);const r=d.data();if(!r)continue;const l=DOCS[d.id];if(!l||(r.updatedAt||0)>(l.updatedAt||0)){DOCS[d.id]=clone(r);changed=true;}}
    for(const ch of qs.docChanges()){if(ch.type==='removed'&&!first&&DOCS[ch.doc.id]){delete DOCS[ch.doc.id];changed=true;}}
    if(first){first=false;for(const k in DOCS){if(!seen.has(k)&&(DOCS[k].updatedAt||0)>0)push(k);else if(seen.has(k)){const r=qs.docs.find(x=>x.id===k)?.data();if(r&&(DOCS[k].updatedAt||0)>(r.updatedAt||0))push(k);}}}
    $('syncTxt').textContent='아이폰·맥 동기화';
    if(changed){saveLocal();safeRender();}
  },()=>{$('syncTxt').textContent='동기화 끊김 · 이 기기에는 저장됨';});
}catch(e){}})();
function safeRender(){const a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')&&$('view').contains(a)){pendingRender=true;return;}render();checkLock();}

/* ---------- 계산 ---------- */
const GOALS=[3,7,14,30,60,90,100,120,180,365];
function dayRec(d){return ST().days[d]||null;}
function slipDays(){return Object.entries(ST().days).filter(([d,v])=>v.s==='slip').map(([d])=>d).sort();}
function streak(){const s=ST();if(!s.start)return 0;const t=today();const sl=slipDays().filter(d=>d>=s.start&&d<=t);const last=sl[sl.length-1];
  if(last===t)return 0; const from=last?addD(last,1):s.start; if(from>t)return 0; return diffD(from,t)+(dayRec(t)?.s==='clean'?1:0);}
function totalClean(){const s=ST();if(!s.start)return 0;const t=today();if(s.start>t)return 0;const past=diffD(s.start,t);const sl=slipDays().filter(d=>d>=s.start&&d<t).length;return past-sl+(dayRec(t)?.s==='clean'?1:0);}
function longest(){const s=ST();if(!s.start)return 0;const t=today();let best=0,cur=0;for(let d=s.start;d<=t;d=addD(d,1)){const r=dayRec(d);if(r?.s==='slip')cur=0;else if(d<t||r?.s==='clean'){cur++;best=Math.max(best,cur);}}return best;}
function urgesAll(){let a=[];for(const k in DOCS)if(k.startsWith('u_'))a=a.concat(DOCS[k].list||[]);return a.sort((x,y)=>x.t-y.t);}
function addUrge(u){const k='u_'+ymd(u.t).slice(0,7);if(!DOCS[k])DOCS[k]={list:[],updatedAt:0};DOCS[k].list.push(u);touch(k);}
function journal(){return Object.entries(DOCS).filter(([k])=>k.startsWith('j_')).map(([k,v])=>Object.assign({id:k},v)).sort((a,b)=>b.t-a.t);}
function setDay(d,patch){const s=ST();s.days[d]=Object.assign({},s.days[d]||{},patch);touch('state');}
function lastSlipWithin(n){const sl=slipDays();const l=sl[sl.length-1];if(!l)return null;const g=diffD(l,today());return g>=0&&g<n?g:null;}
function phase(n){
  if(!ST().start)return null;
  if(n<4)return {tag:'시작',t:'처음 며칠',b:'집에 있는 시간을 줄이고, 그만두는 이유 목록과 미래의 나에게 쓰는 편지를 만든다. 환경 정리 목록부터 체크한다.'};
  if(n<15)return {tag:'급성 금단 구간',t:'첫 두 주가 가장 힘들다',b:'짜증, 불안, 불면, 기분 기복은 뇌가 다시 균형을 잡는 신호다. 운동과 찬물, 밖에 나가기로 버틴다. 하루에 한 번, "아니"만 말하면 된다.'};
  if(n<50)return {tag:'재조정 구간',t:'시들함(플랫라인)이 올 수 있다',b:'모든 게 밍밍하고 관심이 사라져도 망가진 게 아니다. 버틴 사람들은 대개 돌아왔다. 시험하지 말고 기다린다.'};
  if(n<90)return {tag:'균형을 찾는 중',t:'좋은 날이 늘어난다',b:'나쁜 날이 섞여도 직선이 아닐 뿐이다. 사람을 만나고, 하고 싶던 걸 만들고 배우는 데 남는 에너지를 쓴다.'};
  return {tag:'유지 구간',t:'트리거 경로는 오래 남는다',b:'"이제 괜찮겠지" 하고 시험하면 깊은 경로가 되살아난다. 그것이 선택지에 없는 사람처럼 산다.'};
}

/* ---------- 충동 (SOS) ---------- */
let SOS=null,sosI=null,mI=null;
function openSOS(mode){SOS={t0:Date.now(),acts:new Set(),no:0,mode:mode==='slip'?'slip':'hold',mi:0,form:{level:3,emo:[],who:null,did:[],where:null}};
  if(mode==='slip')SOS.mode='slip';drawSOS();applyWake();
  clearInterval(sosI);sosI=setInterval(tickSOS,500);clearInterval(mI);mI=setInterval(()=>{if(!SOS||SOS.mode!=='hold')return;SOS.mi=(SOS.mi+1)%MANTRAS.length;const m=$('mantra');if(m)m.textContent=MANTRAS[SOS.mi];},7000);}
function closeSOS(){SOS=null;clearInterval(sosI);clearInterval(mI);$('sosLayer').innerHTML='';render();applyWake();}
function tickSOS(){if(!SOS||SOS.mode!=='hold')return;const el=(Date.now()-SOS.t0)/1000;const tgt=15*60;const r=$('ringArc');if(!r)return;const C=2*Math.PI*96;r.style.strokeDashoffset=C*(1-Math.min(1,el/tgt));
  $('ringTime').textContent=`${pad(Math.floor(el/60))}:${pad(Math.floor(el%60))}`;$('ringSub').textContent=el<600?'10분이면 대개 꺾인다':el<900?'거의 다 왔다. 15분이면 지나간다':'충동보다 내가 컸다';}
function drawSOS(){const L=$('sosLayer');const S=SOS;const st=ST();
  if(S.mode==='hold'){const C=2*Math.PI*96;
    L.innerHTML=`<div class="sos" role="dialog" aria-label="충동 버티기"><div class="in">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:20px">충동이 왔다</h2><button class="iconbtn" id="sosX">닫기</button></div>
    <div class="ring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="96" fill="none" stroke="var(--sunk)" stroke-width="12"/><circle id="ringArc" cx="110" cy="110" r="96" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="c"><b class="num" id="ringTime">00:00</b><small id="ringSub">10분이면 대개 꺾인다</small></div></div>
    <p class="mantra" id="mantra" aria-live="polite">${esc(MANTRAS[S.mi])}</p>
    <button class="no-btn" id="noBtn">아니.${S.no?` <span class="num" style="font-size:15px;opacity:.7">×${S.no}</span>`:''}</button>
    <div class="row"><button class="btn" id="redxBtn" style="flex:1">장면 위에 레드 X</button><button class="btn" id="offBtn" style="flex:1">"오늘만은 안 한다"</button></div>
    <div class="lbl" style="margin:4px 0 -4px"><span>지금 바로 할 것 · 하나만 골라 일어선다</span></div>
    <div class="acts">${ACTIONS.map(a=>`<button class="act ${S.acts.has(a.k)?'on':''}" data-a="${a.k}"><b>${a.t}</b><small>${a.s}</small></button>`).join('')}</div>
    <div id="actPanel"></div>
    <div class="row"><button class="btn pri" id="passBtn" style="flex:1">지나갔다</button><button class="btn dang" id="slipBtn" style="flex:1">넘어졌다</button></div>
    <p class="help" style="text-align:center">버티지 못해도 괜찮다. 기기를 끄고 생각한 뒤라면, 의식하고 하는 것만으로 변화의 첫걸음이다.</p>
    </div></div>`;
    $('sosX').onclick=closeSOS;
    $('noBtn').onclick=()=>{S.no++;$('noBtn').innerHTML=`아니. <span class="num" style="font-size:15px;opacity:.7">×${S.no}</span>`;navigator.vibrate?.(30);};
    $('redxBtn').onclick=redX;
    $('offBtn').onclick=()=>{$('mantra').textContent='이번이 마지막이 아니다. 오늘만은 안 한다. 내일은 내일의 내가 한다.';};
    L.querySelectorAll('.act').forEach(b=>b.onclick=()=>{const k=b.dataset.a;S.acts.add(k);b.classList.add('on');actPanel(k);});
    $('passBtn').onclick=()=>{S.mode='pass';S.dur=Math.round((Date.now()-S.t0)/1000);drawSOS();};
    $('slipBtn').onclick=()=>{S.mode='slip';S.dur=Math.round((Date.now()-S.t0)/1000);drawSOS();};
    tickSOS(); return;}
  const slip=S.mode==='slip'; const f=S.form; const vs=slip?VERSES[0]:null;
  L.innerHTML=`<div class="sos" role="dialog" aria-label="${slip?'넘어졌을 때':'충동을 넘긴 뒤'}"><div class="in">
   <div class="row" style="justify-content:space-between"><h2 style="font-size:20px">${slip?'넘어졌다. 끝이 아니다':'넘겼다'}</h2><button class="iconbtn" id="sosX">닫기</button></div>
   ${slip?`<section class="card"><p class="quote">${esc(vs[0])}<cite>${esc(vs[1])}</cite></p></section>
   <section class="card"><ul style="margin:0;padding-left:18px;font-size:14.5px">
     <li><b>지킨 날 합계 ${totalClean()}일은 그대로다.</b> 쌓아 온 날은 사라지지 않는다.</li>
     <li>"어차피 깨졌으니"는 몰아 쓰기의 시작이다. 몰아 쓰기가 한 번의 실수보다 훨씬 많이 되돌린다.</li>
     <li>앞으로 2~3일은 체이서 때문에 더 당긴다. 알고 버틴다.</li>
     <li>자책은 수치심 → 몰아 쓰기 → 수치심의 고리를 돌린다. 대신 무엇이 방아쇠였는지 적고, 다음 계획을 하나 만든다.</li>
     <li>계속 돌아오는 한 실패할 수 없다.</li></ul></section>`:
   `<section class="card" style="background:var(--good-soft);border-color:var(--good)"><p style="margin:0">${S.dur>=60?`${Math.floor(S.dur/60)}분 ${S.dur%60}초`:S.dur+'초'} 버텼다. 이 한 번이 그 경로를 약하게 하고, 의지력을 키운다. 하나의 나쁜 충동을 이기면 내가 충동보다 크다는 걸 알게 된다.</p></section>`}
   <section class="card"><div class="lbl"><span>무엇이 방아쇠였나 · 다음을 위해</span></div>
    <div class="lbl"><span>세기</span></div><div class="scale" id="fLevel">${[1,2,3,4,5].map(i=>`<button class="${f.level===i?'on':''}" data-i="${i}">${i}</button>`).join('')}</div>
    <div class="lbl" style="margin-top:10px"><span>어떤 감정이었나</span></div><div class="row" id="fEmo">${EMOS.map(x=>`<button class="chip ${f.emo.includes(x)?'on':''}" data-x="${x}">${x}</button>`).join('')}</div>
    <div class="lbl" style="margin-top:10px"><span>방금 뭘 하고 있었나</span></div><div class="row" id="fDid">${DID.map(x=>`<button class="chip ${f.did.includes(x)?'on':''}" data-x="${x}">${x}</button>`).join('')}</div>
    <div class="lbl" style="margin-top:10px"><span>누가 곁에</span></div><div class="row" id="fWho">${WHO.map(x=>`<button class="chip ${f.who===x?'on':''}" data-x="${x}">${x}</button>`).join('')}</div>
    <div class="lbl" style="margin-top:10px"><span>어디서</span></div><div class="row" id="fWhere">${WHERE.map(x=>`<button class="chip ${f.where===x?'on':''}" data-x="${x}">${x}</button>`).join('')}</div>
    <p class="help" style="margin-top:10px">시각은 ${hm(S.t0)}로 자동 기록된다.</p>
   </section>
   <section class="card"><div class="lbl"><span>다음엔 이렇게 한다 (선택)</span></div>
    <input class="txt" id="pWhen" placeholder="언제 · 예: 혼자 집에서 공부를 미루고 싶어지면" style="margin-bottom:6px">
    <input class="txt" id="pDo" placeholder="무엇을 · 예: 바로 팔굽혀펴기 20개 하고 도서관에 간다" style="margin-bottom:6px">
    <input class="txt" id="pWhy" placeholder="왜냐하면 · 예: 해냈다는 뿌듯함과 맑은 머리를 주니까">
   </section>
   <button class="btn pri wide" id="saveUrge">${slip?'오늘을 넘어짐으로 기록하고 다시 시작':'기록하고 닫기'}</button>
   </div></div>`;
  $('sosX').onclick=closeSOS;
  $('fLevel').querySelectorAll('button').forEach(b=>b.onclick=()=>{f.level=+b.dataset.i;$('fLevel').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
  const multi=(id,arr)=>$(id).querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const i=arr.indexOf(b.dataset.x);i>=0?arr.splice(i,1):arr.push(b.dataset.x);b.classList.toggle('on');sugg();});
  const single=(id,key)=>$(id).querySelectorAll('.chip').forEach(b=>b.onclick=()=>{f[key]=f[key]===b.dataset.x?null:b.dataset.x;$(id).querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.x===f[key]));sugg();});
  multi('fEmo',f.emo);multi('fDid',f.did);single('fWho','who');single('fWhere','where');
  function sugg(){const w=$('pWhen');if(w.dataset.touched)return;const parts=[f.who==='혼자'?'혼자':'',f.where?f.where+'에서':'',f.did[0]||'',f.emo[0]?f.emo[0]+'이 올 때':''].filter(Boolean);w.value=parts.length?parts.join(' ')+(f.emo[0]?'':' 충동이 오면'):'';}
  $('pWhen').oninput=e=>e.target.dataset.touched=1;
  $('saveUrge').onclick=()=>{const st=ST();
    addUrge({t:S.t0,dur:S.dur||0,level:f.level,emo:f.emo,did:f.did,who:f.who,where:f.where,acts:[...S.acts],no:S.no,out:slip?'slip':'pass'});
    const pw=$('pWhen').value.trim(),pd=$('pDo').value.trim(),py=$('pWhy').value.trim();
    if(pw&&pd){st.plans.push({id:uid(),when:pw,do:pd,why:py});}
    if(slip){if(!st.start)st.start=today();st.days[today()]=Object.assign({},st.days[today()]||{},{s:'slip'});}
    touch('state');closeSOS();toast(slip?'기록했다. 지금부터 다시 1일째다':'기록했다. 잘 넘겼다');};
}
function actPanel(k){const P=$('actPanel');const st=ST();
  if(k==='read'){P.innerHTML=`<section class="card"><div class="lbl"><span>내가 그만두는 이유</span></div>${st.reasons.length?`<div class="list">${st.reasons.map(r=>`<div class="li"><span class="t">${esc(r)}</span></div>`).join('')}</div>`:'<p class="help">아직 적은 이유가 없다. 계획 탭에서 만든다.</p>'}
    ${st.letter?`<div class="lbl" style="margin-top:12px"><span>미래의 나에게</span></div><p style="white-space:pre-wrap;margin:0;font-size:14.5px">${esc(st.letter)}</p>`:''}</section>`;}
  else if(k==='study'){const L=[...st.safe,...st.todo.filter(t=>!t.done).map(t=>t.t)];P.innerHTML=`<section class="card"><div class="lbl"><span>안전한 활동 · 할 일</span></div>${L.length?`<div class="list">${L.map(r=>`<div class="li"><span class="t">${esc(r)}</span></div>`).join('')}</div>`:'<p class="help">계획 탭에서 목록을 만들어 두면 여기 뜬다. 예: 수학 한 문제, 기타 한 곡, 설거지, 단어 10개.</p>'}</section>`;}
  else if(k==='breath'){P.innerHTML=`<section class="card" style="text-align:center"><div class="lbl" style="justify-content:center"><span>4초 들이쉬고 6초 내쉰다 · 6번</span></div><div id="bCirc" style="width:120px;height:120px;border-radius:50%;background:var(--accent-soft);border:3px solid var(--accent);margin:8px auto;transition:transform 4s ease-in-out"></div><p class="mantra" id="bTxt" style="min-height:0;font-size:17px">들이쉰다</p></section>`;
    let n=0;const c=$('bCirc');const step=()=>{if(!$('bCirc')||n>=12){$('bTxt')&&($('bTxt').textContent='잘했다. 이제 일어나 다른 걸 한다');return;}const inh=n%2===0;c.style.transition=`transform ${inh?4:6}s ease-in-out`;c.style.transform=inh?'scale(1.35)':'scale(.85)';$('bTxt').textContent=inh?'들이쉰다':'내쉰다';n++;setTimeout(step,inh?4000:6000);};setTimeout(step,100);}
  else if(k==='push'){let c=0;P.innerHTML=`<section class="card" style="text-align:center"><div class="lbl" style="justify-content:center"><span>한 번 할 때마다 누른다</span></div><button class="no-btn" id="pushBtn" style="font-family:var(--f-num)">0</button><p class="help" style="margin-top:8px">20개를 넘겨도 충동이 남으면 잠깐 쉬고 한 세트 더.</p></section>`;$('pushBtn').onclick=()=>{c++;$('pushBtn').textContent=c;if(c===20)toast('20개. 심장이 뛰면 충동은 물러난다');};}
  else{const M={cold:'지금 일어나 찬물로 세수하거나 샤워한다. 몸이 놀라면 갈망이 꺾인다.',leave:'기기를 끄고 이 방을 나간다. 늘 쓰던 장소와 자세가 신호였다. 장소를 바꾸면 회로가 끊긴다.',walk:'신발을 신고 나간다. 10분 걷고 오면 대개 지나가 있다.',call:'가족이나 친구에게 연락한다. 이 얘기를 안 해도 된다. 사람과 연결되는 것만으로 스트레스가 내려간다.'};P.innerHTML=`<section class="card"><p style="margin:0">${M[k]||''}</p></section>`;}
}
function redX(){const d=document.createElement('div');d.className='redx';d.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M15 15L85 85M85 15L15 85" stroke="var(--urge)" stroke-width="14" stroke-linecap="round"/></svg>`;document.body.appendChild(d);navigator.vibrate?.([60,40,60]);
  try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(700,a.currentTime);o.frequency.linearRampToValueAtTime(1100,a.currentTime+.35);o.frequency.linearRampToValueAtTime(700,a.currentTime+.7);g.gain.setValueAtTime(.06,a.currentTime);g.gain.linearRampToValueAtTime(0,a.currentTime+.75);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.8);}catch(e){}
  setTimeout(()=>d.remove(),950);const m=$('mantra');if(m)m.textContent='지웠다. 다시 떠오르면 다시 지운다. 할수록 자동이 된다.';}

잠깐의 안도. "별거 아니네, 이제 일하자."
한 시간쯤 지나면 에너지가 떨어지고 머리가 멍해진다. 불안이 따라온다.
집중이 안 되고, 하기로 한 공부는 미뤄진다.
저녁엔 할 일을 못 끝낸 나를 탓하고, 다음 날까지 무기력이 이어진다.
사람을 만나기 싫어지고, 다시 그만두기로 결심한다.

그러니 지금, 이 한 번만 "아니"라고 한다.`;
function listCard(title,key,ph,help){const a=ST()[key];return `<section class="card"><div class="lbl"><span>${title}</span><span class="muted">${a.length}</span></div>${help?`<p class="help" style="margin-bottom:10px">${help}</p>`:''}

   <textarea class="txt" id="letterIn" rows="7" placeholder="지금 지면 이렇게 된다…">${esc(s.letter)}</textarea>
   <div class="row" style="margin-top:8px"><button class="btn" id="tplBtn">책의 예시로 시작</button><span class="small muted" id="letterSaved"></span></div></section>
  <section class="card"><div class="lbl"><span>트리거 계획 · 언제 하면 왜냐하면</span><span class="muted">${s.plans.length}</span></div>
   <p class="help" style="margin-bottom:10px">트리거를 알아내고 대신할 보상을 정해 두면, 마주하고 바꾸기를 반복하는 동안 새 행동이 자동이 된다.</p>
   <div class="list" style="margin-bottom:10px">${s.plans.map(p=>`<div class="plan"><div style="display:flex;gap:8px"><div style="flex:1;min-width:0"><b>언제</b> ${esc(p.when)}<br><b>하면</b> ${esc(p.do)}${p.why?`<br><b>왜냐하면</b> ${esc(p.why)}`:''}</div><button class="x" data-plan="${p.id}" aria-label="계획 지우기">×</button></div></div>`).join('')||'<p class="help">아직 계획이 없다. 충동을 넘긴 뒤 기록하면서 만들 수도 있다.</p>'}</div>
   <form id="planForm" style="display:flex;flex-direction:column;gap:6px"><input class="txt" id="pfWhen" placeholder="언제 · 예: 밤 11시에 침대에 누우면" maxlength="100"><input class="txt" id="pfDo" placeholder="무엇을 · 예: 폰은 책상에 두고 종이책을 읽는다" maxlength="100"><input class="txt" id="pfWhy" placeholder="왜냐하면 · 예: 아침에 개운하니까" maxlength="100"><button class="btn" type="submit">계획 추가</button></form></section>
  </div><div class="col">

  ${listCard('안전한 활동','safe','예: 기타 한 곡, 단어 20개, 산책','의욕이 없을 때도 할 수 있는, 위험 없는 활동. 미루기가 방아쇠가 되지 않게 한다.')}

   <div class="list" style="margin-bottom:8px">${s.todo.map((t,i)=>`<div class="li"><input type="checkbox" data-todo="${i}" ${t.done?'checked':''} style="width:18px;height:18px;accent-color:var(--good)" aria-label="완료"><span class="t" style="${t.done?'text-decoration:line-through;color:var(--faint)':''}">${esc(t.t)}</span><button class="x" data-tdel="${i}" aria-label="지우기">×</button></div>`).join('')}</div>
   <form class="row" id="todoForm"><input class="txt" style="flex:1" id="todoIn" placeholder="예: 수특 독서 3지문" maxlength="80"><button class="btn" type="submit">추가</button></form></section>
  </div></div>`;

function moodSvg(){const W=560,H=150,pl=26,pr=8,pt=10,pb=22;const days=[];for(let i=29;i>=0;i--)days.push(addD(today(),-i));
  const x=i=>pl+(W-pl-pr)*i/29,y=v=>pt+(H-pt-pb)*(1-(v-1)/4);
  const line=(k,col)=>{let d='',pts='';days.forEach((dd,i)=>{const r=dayRec(dd);if(r&&r[k]){d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(r[k]).toFixed(1);pts+=`<circle cx="${x(i).toFixed(1)}" cy="${y(r[k]).toFixed(1)}" r="2.6" style="fill:${col}"/>`;}});return d?`<path d="${d}" fill="none" style="stroke:${col}" stroke-width="2"/>`+pts:'';};
  let g='';[1,3,5].forEach(v=>g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" style="fill:var(--faint)">${v}</text>`);
  days.forEach((dd,i)=>{if(dayRec(dd)?.s==='slip')g+=`<rect x="${x(i)-3}" y="${pt}" width="6" height="${H-pt-pb}" style="fill:var(--urge-soft)"/>`;});
  [0,15,29].forEach(i=>g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" style="fill:var(--faint)">${days[i].slice(5).replace('-','.')}</text>`);
  const any=days.some(d=>dayRec(d)?.mood||dayRec(d)?.energy);

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rb|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let h=0;for(const c of 'rb|'+s)h=(h*31+c.charCodeAt(0))|0;return 'w'+h;}}

function wakeMode(){return ST().wake||'all';}
function wantWake(){const m=wakeMode();return document.visibilityState==='visible'&&(m==='all'||(m==='sos'&&!!SOS));}
function startNoSleep(){try{if(!NSV){NSV=document.createElement('video');NSV.setAttribute('playsinline','');NSV.setAttribute('webkit-playsinline','');NSV.muted=true;NSV.loop=true;NSV.src=NOSLEEP_SRC;NSV.setAttribute('aria-hidden','true');NSV.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;bottom:0';document.body.appendChild(NSV);}const p=NSV.play();p&&p.then(()=>{if(!wantWake())NSV.pause();}).catch(()=>{});}catch(e){}}
function stopNoSleep(){try{NSV&&NSV.pause();}catch(e){}}
async function applyWake(){
  if(wantWake()){
    if('wakeLock' in navigator&&!WL){try{WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null;updWakeUI();if(wantWake())setTimeout(applyWake,500);});}catch(e){WL=null;}}
    startNoSleep();
  }else{if(WL){try{await WL.release();}catch(e){}WL=null;}stopNoSleep();}
  updWakeUI();}
function updWakeUI(){const b=$('wakeBtn');if(!b)return;const m=wakeMode();b.textContent=m==='off'?'화면 자동 꺼짐':m==='sos'?'화면 켜짐 · 충동 때':'화면 켜둠';b.setAttribute('aria-pressed',m!=='off');b.classList.toggle('on',m!=='off');}
$('wakeBtn').onclick=()=>{const s=ST();s.wake=wakeMode()==='off'?'all':'off';touch('state');applyWake();toast(s.wake==='off'?'이제 화면이 평소처럼 꺼진다':'앱을 쓰는 동안 화면을 켜 둔다');};
document.addEventListener('visibilitychange',()=>{applyWake();});
['pointerdown','keydown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(wantWake()&&(!WL||(NSV&&NSV.paused)))applyWake();},{passive:true}));


/* ---------- 잠금 ---------- */
let unlocked=false,hiddenAt=0;
function checkLock(){if(ST().pin&&!unlocked&&!$('lockLayer').innerHTML)pinPad('unlock');}
function pinPad(mode){let code='',first=null;const L=$('lockLayer');
  const draw=(msg)=>{L.innerHTML=`<div class="lock"><div class="box"><h2>${mode==='set'?(first?'한 번 더 누른다':'잠금 번호 4자리'):'리부트'}</h2><p class="help">${msg||(mode==='set'?'앱을 열 때마다 묻는다':'번호를 누른다')}</p>
    <div class="pindots">${[0,1,2,3].map(i=>`<i class="${i<code.length?'on':''}"></i>`).join('')}</div>
    <div class="pinpad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}" aria-label="${k==='⌫'?'지우기':k}">${k}</button>`).join('')}</div>
    ${mode==='set'?'<button class="btn ghost" id="pinCancel">취소</button>':''}</div></div>`;
    L.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));$('pinCancel')&&($('pinCancel').onclick=()=>{L.innerHTML='';});};
  const press=async k=>{if(k==='⌫'){code=code.slice(0,-1);draw();return;}if(code.length>=4)return;code+=k;draw();
    if(code.length===4){if(mode==='set'){if(!first){first=code;code='';draw();}else if(first===code){ST().pin=await sha(code);touch('state');unlocked=true;L.innerHTML='';toast('잠금 번호를 걸었다');}else{first=null;code='';draw('두 번이 달랐다. 처음부터 다시');}}
     else{if(await sha(code)===ST().pin){unlocked=true;L.innerHTML='';}else{code='';draw('번호가 다르다');navigator.vibrate?.(80);}}}};
  draw();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(ST().pin&&hiddenAt&&Date.now()-hiddenAt>120000){unlocked=false;checkLock();}});
document.addEventListener('keydown',e=>{const L=$('lockLayer');if(!L.innerHTML)return;const b=L.querySelector(`[data-k="${e.key==='Backspace'?'⌫':e.key}"]`);if(b){e.preventDefault();b.click();}});

/* ---------- 시작 ---------- */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.v==='sos'){openSOS();return;}VIEW=b.dataset.v;render();window.scrollTo(0,0);});
document.addEventListener('dblclick',e=>{if(!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))e.preventDefault();},{passive:false});
render();checkLock();applyWake();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}</script>
</body>
