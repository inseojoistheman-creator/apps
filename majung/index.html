<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101A28">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>마중 · 미래의 나</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="마중">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: 역 도착 안내판(전광판)이 맨 위에 항상 보이고, 아래 카드가 7정거장 노선도를 따라 이어진다.
   Color: ink 먹청 / paper 새벽 안개 / route 청록 / signal 전광판 호박색 / good / warn */
:root{
  --bg:#EBEFF3; --card:#FFFFFF; --card2:#F3F5F8; --ink:#142030; --muted:#566476; --line:#D2D9E1;
  --route:#0B7A75; --route-ink:#FFFFFF; --signal:#A85A00; --good:#2B7A4B; --warn:#B3261E;
  --board:#101A28; --board-ink:#FFC24B; --board-dim:#8A99AC; --board-ok:#6FE0A0; --board-bad:#FF8A80;
  --disp:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1119; --card:#121C2A; --card2:#182436; --ink:#E7EDF4; --muted:#9BA9BA; --line:#243246;
    --route:#4CCFC5; --route-ink:#06201E; --signal:#FFC24B; --good:#79D39C; --warn:#FF9A8F;
    --board:#070D15; --board-dim:#7F8FA3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1119; --card:#121C2A; --card2:#182436; --ink:#E7EDF4; --muted:#9BA9BA; --line:#243246;
  --route:#4CCFC5; --route-ink:#06201E; --signal:#FFC24B; --good:#79D39C; --warn:#FF9A8F;
  --board:#070D15; --board-dim:#7F8FA3; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  touch-action:manipulation;overflow-x:hidden}
button,input,textarea,select{font-family:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:14px 0 120px;display:flex;flex-direction:column;gap:14px}
#main{display:flex;flex-direction:column;gap:14px;min-width:0}

/* 도착 안내판 */
.board{background:var(--board);color:var(--board-ink);border-radius:14px;padding:14px 16px 16px;font-family:var(--mono);display:grid;gap:10px;min-width:0}
.board .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;color:var(--board-dim)}
.board .dest{font-family:var(--disp);font-size:24px;line-height:1.3;overflow-wrap:anywhere;text-wrap:balance;font-weight:400}
.board .dest.empty{color:var(--board-dim);font-size:19px}
.board .g{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:end}
.board .k{font-size:11px;color:var(--board-dim);letter-spacing:.06em}
.board .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.lamps{display:flex;gap:7px;justify-content:flex-end}
.lamp{width:13px;height:13px;border-radius:50%;border:2px solid var(--board-dim)}
.lamp.on{background:var(--board-ink);border-color:var(--board-ink)}
.sync{display:inline-flex;gap:6px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--board-dim);display:inline-block}
.sync.live i{background:var(--board-ok)} .sync.saving i{background:var(--board-ink)} .sync.error i{background:var(--board-bad)}

/* 공통 */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font:500 11px/1.2 var(--mono);letter-spacing:.08em;color:var(--muted)}
.h{font-family:var(--disp);font-weight:400;font-size:21px;line-height:1.3;margin:0;text-wrap:balance}
.card p{margin:0}
.muted{color:var(--muted);font-size:14px}
.q{color:var(--signal);font-weight:500;font-size:15px}
.lab{display:block;font-weight:600;font-size:14px;margin-top:4px}
.hint{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.field{width:100%;font-size:16px;line-height:1.5;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);resize:none;min-width:0}
.field::placeholder{color:var(--muted);opacity:.8}
textarea.field{overflow:hidden}
input[type=date].field,input[type=time].field{min-height:46px}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row>.field{flex:1}
.btn{font-weight:600;font-size:15px;border-radius:10px;padding:10px 14px;border:1px solid var(--route);background:var(--route);color:var(--route-ink);line-height:1.2}
.btn.ghost{background:transparent;color:var(--route)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.warn{background:transparent;color:var(--warn);border-color:var(--warn)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;background:var(--card2);color:var(--ink)}
.chip.on{border-color:var(--route);color:var(--route);background:transparent;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.ck{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--card2);display:grid;place-items:center;padding:0}
.ck svg{width:18px;height:18px;fill:none;stroke:var(--route-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on{background:var(--route);border-color:var(--route)} .ck.on svg{opacity:1}
.x{flex:none;width:30px;height:30px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;border-radius:8px}
.x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .t small{display:block;color:var(--muted);font-size:12.5px}
.col{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.pill{font:500 11.5px/1 var(--mono);padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)} .pill.bad{color:var(--warn);border-color:var(--warn)} .pill.sig{color:var(--signal);border-color:var(--signal)}
.meter{height:8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--route)}
.banner{border:1px dashed var(--signal);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--signal);display:flex;gap:10px;align-items:center;justify-content:space-between}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

/* 7정거장 노선도 */
.route{position:relative;padding-left:46px;display:flex;flex-direction:column;gap:12px}
.route::before{content:"";position:absolute;left:16px;top:18px;bottom:18px;width:4px;background:var(--route);border-radius:2px;opacity:.55}
.stop{position:relative;min-width:0}
.stop .mk{position:absolute;left:-46px;top:10px;width:36px;height:36px;border-radius:50%;background:var(--card);border:4px solid var(--route);display:grid;place-items:center;font:600 14px var(--mono);color:var(--route)}
.stop.open .mk{background:var(--route);color:var(--route-ink)}
.stop .hd{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stop .hd b{font-family:var(--disp);font-weight:400;font-size:18px}
.stop .hd span{color:var(--muted);font-size:13px}
.stop .bd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;display:flex;flex-direction:column;gap:10px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow .field{flex:1 1 180px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13.5px}
.seg button.on{border-color:var(--route);color:var(--route);font-weight:600;background:transparent}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px var(--mono);color:var(--muted)}
.week .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.week .dot.on{background:var(--route);border-color:var(--route)}
.sealed{border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--muted);font-size:14px}
.letter{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card2);border-radius:10px;padding:12px}

/* 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11.5px;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--route);font-weight:600}
.tab.on::before{content:"";position:absolute;top:-7px;left:22%;right:22%;height:3px;background:var(--route);border-radius:0 0 3px 3px}

/* 모달·토스트 */
.ov{position:fixed;inset:0;z-index:30;background:rgba(5,10,18,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet.small{border-radius:16px;margin:auto 16px;max-height:none;padding-bottom:16px}
.ov.mid{align-items:center}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--board);color:var(--board-ink);font-size:14px;padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.stop .bd{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}}
</style>

</head>
<body>
<div class="wrap">
  <div id="board"></div>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="화면 이동"></nav>
<div id="modal"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var KEY='majung.cache.v2', LKEY='majung.local.v1';
var CORE_KEYS=['future','eliminate','ladder','asks','systems','blocks','ship','capsules','weekly','rewrites'];

/* ---------- 유틸 ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nid(){return Math.random().toString(36).slice(2,9);}
function p2(n){return String(n).padStart(2,'0');}
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function parseKey(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function addMonths(d,n){var x=new Date(d);x.setMonth(x.getMonth()+n);return x;}
function addYears(d,n){var x=new Date(d);x.setFullYear(x.getFullYear()+n);return x;}
function diffDays(a,b){return Math.round((parseKey(b)-parseKey(a))/864e5);}
var DOW='일월화수목금토';
function fmtLong(k){var d=parseKey(k);return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DOW[d.getDay()]+'요일';}
function fmtDot(k){return k.replace(/-/g,'.');}
function weekKey(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return dkey(x);}
function dayOfYear(){var n=new Date();return Math.floor((n-new Date(n.getFullYear(),0,0))/864e5);}
function monthOf(k){return k.slice(0,7);}
function deepMerge(t,s){for(var k in s){var v=s[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))deepMerge(t[k],v);else t[k]=v;}return t;}

/* ---------- 아이콘 ---------- */
var ICON={
 sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></svg>',
 route:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/><path d="M12 7v3M12 14v3"/></svg>',
 cap:'<svg viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3c0 5 4 6 4 9s-4 4-4 9M16 3c0 5-4 6-4 9s4 4 4 9"/></svg>',
 check:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
 sliders:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
 tick:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- 상태 ---------- */
function emptyCore(){return {
 future:{horizon:5,setOn:'',identity:'',goal:'',done:'',due:'',firstAction:'',areas:{body:'',work:'',people:'',money:'',faith:''},calling:''},
 eliminate:[],ladder:[],asks:[],systems:[],blocks:{},ship:[],capsules:[],weekly:{},rewrites:[]};}
function blankDay(){return {fs:'',focus:'',focusDone:false,avoid:'',choices:[],gain:'',tried:'',closed:false};}
var S=emptyCore();S.days={};
var L={theme:'auto',lastBackup:''};
var revs={}, dirty=new Set(), db=null, uid=null, syncState='off', curWriting='', firstSnap=false;
var view='today', openStep=0, truthIdx=dayOfYear()%7, modal=null, drafts={}, pendingRender=false, storageOk=true;

function D(k){return Object.assign(blankDay(),S.days[k]||{});}
function ED(k){S.days[k]=Object.assign(blankDay(),S.days[k]||{});return S.days[k];}
function coreOf(s){var o={};CORE_KEYS.forEach(function(k){o[k]=s[k];});return o;}
function applyCore(src){var b=emptyCore();deepMerge(b,src||{});CORE_KEYS.forEach(function(k){S[k]=b[k];});}
function hasData(){return !!(S.future.identity||S.future.goal||S.eliminate.length||S.ladder.length||S.asks.length||S.systems.length||S.ship.length||S.capsules.length||S.rewrites.length||Object.keys(S.days).length);}
function getPath(p){var o=S;var a=p.split('.');for(var i=0;i<a.length;i++){if(o==null)return '';o=o[a[i]];}return o==null?'':o;}
function setPath(p,v){var a=p.split('.');if(a[0]==='days')ED(a[1]);var o=S;for(var i=0;i<a.length-1;i++){if(o[a[i]]==null||typeof o[a[i]]!=='object')o[a[i]]={};o=o[a[i]];}o[a[a.length-1]]=v;}
function touchCore(){dirty.add('core');persistLater();}
function touchDay(k){dirty.add('m-'+monthOf(k));persistLater();}
function touchFor(path){var a=path.split('.');if(a[0]==='days')touchDay(a[1]);else touchCore();}

/* ---------- 저장 (이 기기 + 계정 동기화) ---------- */
var pT=null,fT=null;
function persistLater(){
  clearTimeout(pT);pT=setTimeout(persistLocal,200);
  if(db&&uid){clearTimeout(fT);fT=setTimeout(flush,900);setSync('saving');}
}
function persistLocal(){
  try{localStorage.setItem(KEY,JSON.stringify({core:coreOf(S),days:S.days,revs:revs,dirty:Array.from(dirty)}));storageOk=true;}catch(e){storageOk=false;}
  try{localStorage.setItem(LKEY,JSON.stringify(L));}catch(e){}
}
function loadLocal(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o.core)applyCore(o.core);if(o.days)S.days=o.days;if(o.revs)revs=o.revs;if(Array.isArray(o.dirty))o.dirty.forEach(function(x){dirty.add(x);});}}catch(e){}
  try{var q=localStorage.getItem(LKEY);if(q)Object.assign(L,JSON.parse(q));}catch(e){}
}
function setSync(s){syncState=s;var el=$('#board .sync');if(el){el.className='sync '+s;el.lastChild.textContent=syncText();}}
function syncText(){return {off:'이 기기에만 저장',live:'동기화됨',saving:'저장 중',error:'동기화 실패'}[syncState]||'';}
var retryT=null;
async function flush(){
  if(!db||!uid||curWriting)return;
  try{
    while(dirty.size){
      var id=Array.from(dirty)[0];dirty.delete(id);curWriting=id;
      var rev=Date.now(),body;
      if(id==='core')body={_rev:rev,data:coreOf(S)};
      else{var m=id.slice(2),days={};for(var k in S.days){if(monthOf(k)===m)days[k]=S.days[k];}body={_rev:rev,days:days};}
      revs[id]=rev;
      try{await db.doc('data/users/'+uid+'/'+id).set(body);}
      catch(e){dirty.add(id);throw e;}
    }
    curWriting='';setSync('live');persistLocal();
  }catch(e){
    curWriting='';setSync('error');persistLocal();
    clearTimeout(retryT);retryT=setTimeout(flush,20000);
  }
  if(dirty.size&&syncState!=='error'){clearTimeout(fT);fT=setTimeout(flush,400);}
}
function onSnap(snap){
  var changed=false,seen={};
  snap.docs.forEach(function(d){
    seen[d.id]=1;var data=d.data();if(!data)return;
    var r=Number(data._rev)||0;
    if(dirty.has(d.id)||curWriting===d.id)return;
    if(r<=(revs[d.id]||0))return;
    if(d.id==='core'&&data.data){applyCore(data.data);revs.core=r;changed=true;}
    else if(d.id.indexOf('m-')===0&&data.days){for(var k in data.days){S.days[k]=data.days[k];}revs[d.id]=r;changed=true;}
  });
  if(!firstSnap){
    firstSnap=true;
    if(!seen.core&&hasData()){dirty.add('core');}
    for(var k in S.days){var mid='m-'+monthOf(k);if(!seen[mid])dirty.add(mid);}
    if(dirty.size){clearTimeout(fT);fT=setTimeout(flush,300);}
  }
  if(changed){persistLocal();softRender();}
  if(!dirty.size&&!curWriting)setSync('live');
}
async function initSync(){
  try{
    if(!window.claude||!window.claude.use){setSync('off');return;}
    var res=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    var u=res[0],d=res[1];

function stepStatus(n){
  var f=S.future;
  if(n===1){var c=(f.goal?1:0)+(f.done?1:0)+(f.due?1:0)+(f.firstAction?1:0);return c?('선명도 '+c+'/4'):'아직 비어 있어요';}
  if(n===2)return S.eliminate.length?('항목 '+S.eliminate.length+'개 · 그만두기 '+S.eliminate.filter(function(x){return x.decision==='drop';}).length+'개'):'아직 비어 있어요';
  if(n===3)return S.ladder.length?('항목 '+S.ladder.length+'개 · 앎 단계 '+S.ladder.filter(function(x){return x.stage===2;}).length+'개'):'아직 비어 있어요';
  if(n===4)return S.asks.length?('요청 '+S.asks.length+'개 · 답 받음 '+S.asks.filter(function(x){return x.status==='answered';}).length+'개'):'아직 비어 있어요';
  if(n===5)return S.systems.length?('설정 '+S.systems.filter(function(x){return x.done;}).length+'/'+S.systems.length):'아직 비어 있어요';
  if(n===6){var t=S.blocks[dkey(addDays(new Date(),1))]||[];return t.length?('내일 '+t.length+'칸 막음'):'내일 시간을 아직 안 막았어요';}
  if(n===7)return S.ship.length?('완수 '+S.ship.filter(function(x){return x.done;}).length+'/'+S.ship.length):'아직 비어 있어요';
  return '';

  if(!S.capsules.length)h+='<section class="card"><p class="muted">아직 봉인한 타임캡슐이 없어요. 처음에는 6개월 뒤처럼 가까운 날짜로 하나 만들어 보면 부담이 적어요.</p></section>';

  h+='<section class="card"><div class="eyebrow">이번 주 · '+fmtDot(wk)+' 시작</div><h2 class="h">미래의 나를 위협하는 7가지</h2>'
   +'<p class="muted">이번 주 나에게 해당되는 것을 눌러요. 해당되면 이번 주에 할 한 가지가 함께 나와요. 항목 설명은 책의 목차를 바탕으로 풀어 쓴 요약이에요.</p><div class="list">';

    h+='<div class="item">'+ck(on,'threat','data-n="'+(i+1)+'"','이번 주 해당됨')+'<div class="t"><b>'+t.t+'</b><small>'+t.b+'</small>'+(on?'<small style="color:var(--signal)">→ '+t.a+'</small>':'')+'</div></div>';});
  h+='</div><div class="muted">이번 주 해당 '+cnt+'/7</div>'+lab('weekly.'+wk+'.note','이번 주 한 가지 대응')+ta('weekly.'+wk+'.note','해당되는 항목 중 하나를 골라, 이번 주에 할 행동을 적어요.',2)+'</section>';

  h+='<section class="card"><div class="eyebrow">과거 다시 쓰기</div><h2 class="h">같은 일, 다른 이야기</h2>'
   +'<p class="muted">책은 과거를 어떻게 이야기하느냐가 미래를 바꾼다고 해요. 사실은 그대로 두고, 의미를 다시 써요.</p>'

   +'<textarea class="field" id="rw-old" data-draft="rw-old" rows="2" placeholder="지금까지 붙인 의미"></textarea>'
   +'<textarea class="field" id="rw-new" data-draft="rw-new" rows="2" placeholder="미래의 나가 붙일 새 의미 (그 일 덕분에 배운 것)"></textarea>'
   +'<div class="btns"><button class="btn sm" data-act="add-rw">저장</button></div>'
   +(S.rewrites.length?'<div class="list">'+S.rewrites.map(function(r){return '<div class="item"><div class="t"><small>'+fmtDot(r.date)+'</small>'+esc(r.event)+'<small>예전 의미 · '+esc(r.old)+'</small><b style="color:var(--route)">새 의미 · '+esc(r.nw)+'</b></div>'+xbtn('del-rw','data-id="'+r.id+'"')+'</div>';}).join('')+'</div>':'')
   +'</section>';

  var tries=Object.keys(S.days).filter(function(k){return (S.days[k].tried||'').trim();}).sort().reverse().slice(0,6);
  h+='<section class="card"><div class="eyebrow">시도와 실패 기록</div><h2 class="h">실패도 투자예요</h2>'
   +(tries.length?'<div class="list">'+tries.map(function(k){return '<div class="item"><div class="t"><small>'+fmtDot(k)+'</small>'+esc(S.days[k].tried)+(S.days[k].gain?'<small>얻은 것 · '+esc(S.days[k].gain)+'</small>':'')+'</div></div>';}).join('')+'</div>':'<p class="muted">저녁 카드에 시도한 것을 적으면 여기에 모여요.</p>')+'</section>';

  var cells='';
  for(var i=6;i>=0;i--){var k=dkey(addDays(new Date(),-i)),d=D(k);
    var a=!!((d.fs||'').trim()||(d.focus||'').trim()),m=!!(d.choices.length||d.focusDone),e=!!(d.closed||(d.gain||'').trim());
    cells+='<div><span>'+DOW[parseKey(k).getDay()]+'</span><i class="dot'+(a?' on':'')+'"></i><i class="dot'+(m?' on':'')+'"></i><i class="dot'+(e?' on':'')+'"></i></div>';}
  h+='<section class="card"><div class="eyebrow">최근 7일</div><div class="week">'+cells+'</div><div class="muted">위부터 아침 · 낮 · 저녁. 연속 마중 '+streak()+'일</div></section>';

  h+='<section class="card"><div class="eyebrow">진실 7가지 한눈에</div><div class="list">'+TRUTHS.map(function(t,i){return '<div class="item"><div class="t"><b>'+(i+1)+'. '+t.t+'</b></div></div>';}).join('')+'</div>'
   +'<div class="note">이 앱은 벤저민 하디의 『퓨처 셀프』 구조를 바탕으로 만든 개인용 도구예요. 항목 설명은 요약이므로 정확한 내용은 책으로 확인해 주세요.</div></section>';
  return h;
}

   +'</div></div>';
}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},2200);}
function askConfirm(msg,yes,cb){modal={type:'confirm',msg:msg,yes:yes,cb:cb};renderModal();}

/* ---------- 전체 렌더 ---------- */
function autosize(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}
function restoreDrafts(){$$('[data-draft]').forEach(function(el){var k=el.getAttribute('data-draft');if(drafts[k]!==undefined)el.value=drafts[k];});}
function render(){
  var y=window.scrollY;pendingRender=false;
  $('#board').innerHTML=boardHTML();
  var fn={today:vToday,future:vFuture,steps:vSteps,capsule:vCapsule,check:vCheck}[view];
  $('#main').innerHTML=fn();
  $('#tabs').innerHTML=tabsHTML();
  restoreDrafts();
  $$('textarea.field').forEach(autosize);
  window.scrollTo(0,y);
}

/* ---------- 입력 ---------- */
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.tagName==='TEXTAREA')autosize(t);
  if(t.hasAttribute&&t.hasAttribute('data-draft'))drafts[t.getAttribute('data-draft')]=t.value;
  var b=t.getAttribute&&t.getAttribute('data-bind');
  if(b){
    setPath(b,t.value);
    if(b==='future.identity'&&!S.future.setOn&&t.value.trim())S.future.setOn=dkey();
    touchFor(b);updateBoard();return;
  }
  var l=t.getAttribute&&t.getAttribute('data-list');
  if(l){var it=S[l].filter(function(x){return x.id===t.getAttribute('data-id');})[0];if(it){it[t.getAttribute('data-field')]=t.value;touchCore();}}
});
document.addEventListener('focusout',function(){setTimeout(function(){var a=document.activeElement;if(pendingRender&&!(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')))render();},50);});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  if(b.getAttribute('data-act')==='noop'){if(e.target===b){modal=null;renderModal();}return;}
  act(b.getAttribute('data-act'),b);
});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

function dv(id){var el=$('#'+id);return el?el.value.trim():'';}
function clearDraft(){for(var i=0;i<arguments.length;i++)delete drafts[arguments[i]];}
function byId(arr,id){return arr.filter(function(x){return x.id===id;})[0];}
function dropId(arr,id){var i=arr.findIndex(function(x){return x.id===id;});if(i>=0)arr.splice(i,1);}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){}
  try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();var ok=document.execCommand('copy');document.body.removeChild(a);return ok;}catch(e){return false;}
}
function buildAsk(x){
  var g=S.future.goal.trim();
  return x.who+'님, 안녕하세요.\n'+(g?'저는 「'+g+'」을(를) 이루려고 준비하고 있어요.\n':'')+x.what+'\n시간 되실 때 도와주시면 정말 감사하겠습니다.';
}
function act(a,el){
  var d={};Array.prototype.slice.call(el.attributes).forEach(function(at){if(at.name.indexOf('data-')===0)d[at.name.slice(5)]=at.value;});
  var k=dkey();
  switch(a){
  case 'tab':view=d.v;render();window.scrollTo(0,0);break;
  case 'settings':modal={type:'settings'};renderModal();break;
  case 'close':modal=null;renderModal();break;
  case 'confirm-yes':var cb=modal&&modal.cb;modal=null;renderModal();if(cb)cb();break;
  case 'truth-next':truthIdx=(truthIdx+1)%7;render();break;
  case 'focus-ck':{var x=ED(k);x.focusDone=!x.focusDone;touchDay(k);render();break;}
  case 'add-choice':{var t=dv('choice-text');if(!t){toast('무엇을 하려는지 먼저 적어 주세요');break;}var y=ED(k);y.choices.push({id:nid(),text:t,kind:d.kind});touchDay(k);clearDraft('choice-text');render();break;}
  case 'del-choice':{var y2=ED(k);dropId(y2.choices,d.id);touchDay(k);render();break;}
  case 'close-day':{var z=ED(k);z.closed=!z.closed;touchDay(k);render();toast(z.closed?'오늘도 수고했어요':'마무리를 취소했어요');break;}
  case 'add-block':{var dk=d.dk,tx=dv('blk-text-'+dk),tm=dv('blk-time-'+dk);if(!tx){toast('무엇을 할 시간인지 적어 주세요');break;}S.blocks[dk]=S.blocks[dk]||[];S.blocks[dk].push({id:nid(),time:tm,text:tx,done:false});S.blocks[dk].sort(function(p,q){return (p.time||'99')<(q.time||'99')?-1:1;});touchCore();clearDraft('blk-text-'+dk,'blk-time-'+dk);render();break;}
  case 'del-block':{dropId(S.blocks[d.dk]||[],d.id);touchCore();render();break;}
  case 'blk-ck':{var bb=byId(S.blocks[d.dk]||[],d.id);if(bb){bb.done=!bb.done;touchCore();render();}break;}
  case 'horizon':{S.future.horizon=Number(d.v);if(!S.future.setOn)S.future.setOn=dkey();touchCore();render();break;}
  case 'goto-step':view='steps';openStep=Number(d.n);render();window.scrollTo(0,0);break;
  case 'step':openStep=(openStep===Number(d.n))?0:Number(d.n);render();break;
  case 'add-elim':{var e1=dv('elim-text');if(!e1){toast('덜어낼 일을 적어 주세요');break;}S.eliminate.push({id:nid(),text:e1,decision:''});touchCore();clearDraft('elim-text');render();break;}
  case 'elim-set':{var e2=byId(S.eliminate,d.id);if(e2){e2.decision=(e2.decision===d.v)?'':d.v;touchCore();render();}break;}
  case 'del-elim':dropId(S.eliminate,d.id);touchCore();render();break;
  case 'add-lad':{var l1=dv('lad-text');if(!l1){toast('목표나 습관을 적어 주세요');break;}S.ladder.push({id:nid(),text:l1,stage:0,note:''});touchCore();clearDraft('lad-text');render();break;}
  case 'lad-stage':{var l2=byId(S.ladder,d.id);if(l2){l2.stage=Number(d.v);touchCore();render();}break;}
  case 'del-lad':dropId(S.ladder,d.id);touchCore();render();break;
  case 'add-ask':{var w=dv('ask-who'),wt=dv('ask-what');if(!w||!wt){toast('누구에게, 무엇을 부탁할지 모두 적어 주세요');break;}S.asks.push({id:nid(),who:w,what:wt,status:'draft'});touchCore();clearDraft('ask-who','ask-what');render();break;}
  case 'ask-status':{var a1=byId(S.asks,d.id);if(a1){a1.status=d.v;touchCore();render();}break;}
  case 'ask-copy':{var a2=byId(S.asks,d.id);if(a2)copyText(buildAsk(a2)).then(function(ok){toast(ok?'요청 문구를 복사했어요':'복사하지 못했어요');});break;}
  case 'del-ask':dropId(S.asks,d.id);touchCore();render();break;
  case 'add-sys':{var s1=dv('sys-text');if(!s1){toast('시스템을 한 줄로 적어 주세요');break;}S.systems.push({id:nid(),text:s1,kind:d.kind,done:false});touchCore();clearDraft('sys-text');render();break;}
  case 'sys-ck':{var s2=byId(S.systems,d.id);if(s2){s2.done=!s2.done;touchCore();render();}break;}
  case 'del-sys':dropId(S.systems,d.id);touchCore();render();break;
  case 'add-ship':{var h1=dv('ship-text'),h2=dv('ship-due');if(!h1){toast('끝까지 해낼 일을 적어 주세요');break;}if(!h2){toast('마감일을 정해 주세요');break;}S.ship.push({id:nid(),text:h1,due:h2,done:false});touchCore();clearDraft('ship-text','ship-due');render();break;}
  case 'ship-ck':{var h3=byId(S.ship,d.id);if(h3){h3.done=!h3.done;touchCore();render();if(h3.done)toast('완수했어요');}break;}
  case 'del-ship':dropId(S.ship,d.id);touchCore();render();break;
  case 'cap-quick':{var v=dkey(addMonths(new Date(),Number(d.m)));var inp2=$('#cap-date');if(inp2){inp2.value=v;drafts['cap-date']=v;}break;}
  case 'cap-add':{var ti=dv('cap-title'),bo=dv('cap-body'),op=dv('cap-date');if(!bo||!op){toast('편지 내용과 열어볼 날짜를 채워 주세요');break;}if(op<=k){toast('열어볼 날짜는 내일 이후여야 해요');break;}S.capsules.unshift({id:nid(),title:ti||'미래의 나에게',body:bo,open:op,written:k,opened:false,reply:''});touchCore();clearDraft('cap-title','cap-body','cap-date');render();toast('봉인했어요');break;}
  case 'cap-open':{var c1=byId(S.capsules,d.id);if(c1){c1.opened=true;touchCore();render();}break;}
  case 'cap-early':{var cid=d.id;askConfirm('날짜 전에 열면 타임캡슐의 힘이 줄어들어요. 그래도 열까요?','열기',function(){var c=byId(S.capsules,cid);if(c){c.opened=true;touchCore();render();}});break;}
  case 'cap-del':{var did=d.id;askConfirm('이 타임캡슐을 삭제할까요? 되돌릴 수 없어요.','삭제',function(){dropId(S.capsules,did);touchCore();render();});break;}
  case 'threat':{var wk=weekKey(new Date());S.weekly[wk]=S.weekly[wk]||{threats:{},note:''};S.weekly[wk].threats=S.weekly[wk].threats||{};S.weekly[wk].threats[d.n]=!S.weekly[wk].threats[d.n];touchCore();render();break;}
  case 'add-rw':{var r1=dv('rw-event'),r2=dv('rw-old'),r3=dv('rw-new');if(!r1||!r3){toast('있었던 일과 새 의미를 적어 주세요');break;}S.rewrites.unshift({id:nid(),date:k,event:r1,old:r2,nw:r3});touchCore();clearDraft('rw-event','rw-old','rw-new');render();break;}
  case 'del-rw':dropId(S.rewrites,d.id);touchCore();render();break;
  case 'theme':L.theme=d.v;applyTheme();persistLocal();renderModal();break;
  case 'backup-copy':{var json=JSON.stringify({app:'majung',v:2,core:coreOf(S),days:S.days});copyText(json).then(function(ok){if(ok){L.lastBackup=dkey();persistLocal();toast('기록을 복사했어요. 메모 앱 등에 붙여 두세요');renderModal();}else toast('복사하지 못했어요');});break;}
  case 'restore':{var raw=dv('restore-box');var o=null;try{o=JSON.parse(raw);}catch(e){}if(!o||o.app!=='majung'){toast('복사해 둔 기록이 아니에요');break;}askConfirm('지금 기록을 지우고 붙여 넣은 기록으로 바꿀까요?','복원',function(){S=emptyCore();S.days={};applyCore(o.core);S.days=o.days||{};dirty.add('core');for(var kk in S.days)dirty.add('m-'+monthOf(kk));persistLocal();persistLater();render();toast('복원했어요');});break;}
  case 'wipe':askConfirm('이 기기와 내 계정에 저장된 모든 기록을 지울까요? 되돌릴 수 없어요.','모두 지우기',wipeAll);break;
  }
}
function applyTheme(){var r=document.documentElement;if(L.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',L.theme);}
async function wipeAll(){
  if(db&&uid){try{var snap=await db.collection('data/users/'+uid).get();for(var i=0;i<snap.docs.length;i++){await db.doc('data/users/'+uid+'/'+snap.docs[i].id).delete();}}catch(e){}}
  S=emptyCore();S.days={};revs={};dirty=new Set();drafts={};
  try{localStorage.removeItem(KEY);}catch(e){}
  render();toast('모든 기록을 지웠어요');
}

/* ---------- 시작 ---------- */
loadLocal();applyTheme();render();initSync();
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
})();
</script>
