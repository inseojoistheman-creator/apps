let DOCS={};
try{DOCS=JSON.parse(localStorage.getItem(CFG.key)||'{}').docs||{};}catch(e){}
function defState(){return {read:{},notes:{},days:{},cards:{},weekly:{},last:null};}
if(!DOCS.state)DOCS.state=Object.assign(defState(),{updatedAt:0});
DOCS.state=Object.assign(defState(),DOCS.state);
const ST=()=>DOCS.state;
let COL=null;const wq={},wt={};
function saveLocal(){try{localStorage.setItem(CFG.key,JSON.stringify({docs:DOCS}));}catch(e){}}
function touch(name='state'){const d=DOCS[name];if(!d)return;d.updatedAt=Date.now();saveLocal();push(name);}
function push(name){if(!COL)return;clearTimeout(wt[name]);wt[name]=setTimeout(()=>{const body=DOCS[name]?clone(DOCS[name]):null;wq[name]=(wq[name]||Promise.resolve()).then(()=>body?COL.doc(name).set(body):COL.doc(name).delete()).then(()=>{$('syncTxt').textContent='아이폰·맥 동기화';}).catch(()=>{$('syncTxt').textContent='동기화 실패 · 이 기기에는 저장됨';});},600);}
function removeDoc(name){delete DOCS[name];saveLocal();if(COL){clearTimeout(wt[name]);wq[name]=(wq[name]||Promise.resolve()).then(()=>COL.doc(name).delete()).catch(()=>{});}}
(async()=>{try{
  const user=await (window.claude?.use?.('user')??Promise.resolve(null));const id=user?await user.id():null;
  const db=await (window.claude?.use?.('db')??Promise.resolve(null));if(!db||!id)return;
  COL=db.collection('data/users/'+id);let first=true;
  COL.onSnapshot(qs=>{let changed=false;const seen=new Set();
    for(const d of qs.docs){seen.add(d.id);const r=d.data();if(!r)continue;const l=DOCS[d.id];if(!l||(r.updatedAt||0)>(l.updatedAt||0)){DOCS[d.id]=clone(r);changed=true;}}
    for(const ch of qs.docChanges()){if(ch.type==='removed'&&!first&&DOCS[ch.doc.id]){delete DOCS[ch.doc.id];changed=true;}}
    if(first){first=false;for(const k in DOCS){const r=qs.docs.find(x=>x.id===k)?.data();if(!seen.has(k)?(DOCS[k].updatedAt||0)>0:(r&&(DOCS[k].updatedAt||0)>(r.updatedAt||0)))push(k);}}
    $('syncTxt').textContent='아이폰·맥 동기화';
    if(changed){DOCS.state=Object.assign(defState(),DOCS.state);saveLocal();safeRender();}
  },()=>{$('syncTxt').textContent='동기화 끊김 · 이 기기에는 저장됨';});
}catch(e){}})();
let pendingRender=false;
function safeRender(){const a=document.activeElement;if(a&&['TEXTAREA','INPUT'].includes(a.tagName)){pendingRender=true;return;}render();}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(pendingRender&&!(a&&['TEXTAREA','INPUT'].includes(a.tagName))){pendingRender=false;render();}},250));

/* ---------- 계산 ---------- */
function day(d=today()){const s=ST();if(!s.days[d])s.days[d]={p:[]};return s.days[d];}
function did(k,d=today()){return (ST().days[d]?.p||[]).includes(k);}
function toggleP(k,d=today()){const r=day(d);const i=r.p.indexOf(k);i>=0?r.p.splice(i,1):r.p.push(k);touch();}
function streak(){let n=0;let d=today();const has=x=>(ST().days[x]?.p||[]).length||Object.values(ST().days[x]?.h||{}).some(v=>v==='done'||v==='two'||v==='kept')||logs().some(g=>g.d===x);if(!has(d))d=addD(d,-1);while(has(d)){n++;d=addD(d,-1);}return n;}
function weekDone(k){const t=today();for(let i=0;i<7;i++)if(did(k,addD(t,-i)))return true;return false;}
function monthDone(k){const m=today().slice(0,7);return Object.keys(ST().days).some(d=>d.startsWith(m)&&did(k,d));}
function pDone(p){return p.freq==='매일'?did(p.k):p.freq==='매주'?weekDone(p.k):monthDone(p.k);}
function logs(){let a=[];for(const k in DOCS)if(k.startsWith('g_'))a=a.concat(DOCS[k].list||[]);return a.sort((x,y)=>y.t-x.t);}
function addLog(e){const k='g_'+e.d.slice(0,7);if(!DOCS[k])DOCS[k]={list:[],updatedAt:0};DOCS[k].list.push(e);touch(k);}
function delLog(id){for(const k in DOCS)if(k.startsWith('g_')){const n=DOCS[k].list.length;DOCS[k].list=DOCS[k].list.filter(x=>x.id!==id);if(DOCS[k].list.length!==n)touch(k);}}
function readCount(b){return L.filter(l=>(b===undefined||l.b===b)&&ST().read[l.id]).length;}
function nextUnread(){return L.find(l=>!ST().read[l.id])||null;}
function knownCards(){return Object.values(ST().cards).filter(c=>c.ok).length;}

function go(v,lid){VIEW=v;LID=lid??null;render();window.scrollTo(0,0);}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));

function bar(p){return `<span class="pbar"><i style="width:${Math.round(p*100)}%"></i></span>`;}
function rHome(v){const s=ST(),t=today(),rec=s.days[t]||{p:[]};const di=Math.floor(Date.now()/864e5);const th=THOUGHTS[di%THOUGHTS.length];const nx=nextUnread();
  const dailies=PRACTICES.filter(p=>p.freq==='매일');const doneN=dailies.filter(p=>did(p.k)).length;
  v.innerHTML=`<div class="page"><div class="col">
  <section class="hall" aria-label="진도">
    <div class="kicker">${CFG.kicker}</div><h1>${CFG.title}</h1><div class="sub">${CFG.sub}</div>
    <div class="parts">${BOOKS.map(B=>{const tot=L.filter(l=>l.b===B.n).length;if(!tot)return '';const r=readCount(B.n);return `<button class="part" data-b="${B.n}"><span>${esc(PARTSHORT(B.n))}</span>${bar(r/tot)}<small>${r}/${tot}</small></button>`;}).join('')}</div>
    <div class="stats"><div><small>읽은 장</small><b>${readCount()}/${L.length}</b></div><div><small>실천 연속</small><b>${streak()}일</b></div><div><small>${CFG.cardStat}</small><b>${knownCards()}/${CARDS.length}</b></div></div>
  </section>
  ${SPECIAL.homeTop?SPECIAL.homeTop():''}
  <section class="card"><div class="lbl"><span>오늘 할 한 가지</span>${rec.intentDone?'<span class="tag ok">해냈다</span>':''}</div>
    <input class="txt" id="intentIn" maxlength="120" placeholder="${CFG.intentPh}" value="${esc(rec.intent||'')}">
    <p class="help" style="margin-top:6px">읽기에서 각 장의 실천을 누르면 여기로 들어온다.</p>
    ${rec.intent?`<div class="row" style="margin-top:8px"><button class="btn sm ${rec.intentDone?'acc2':''}" id="intentDone">${rec.intentDone?'해냈다 ✓':'해냈으면 누른다'}</button></div>`:''}
  </section>
  <section class="card"><div class="lbl"><span>오늘의 실천</span><span>${doneN}/${dailies.length}</span></div>
    ${dailies.map(p=>`<div class="ptk"><button class="chk ${did(p.k)?'on':''}" data-p="${p.k}" aria-pressed="${did(p.k)}" aria-label="${esc(p.t)}">${did(p.k)?'✓':''}</button><div class="tx"><b>${esc(p.t)}</b><small>${esc(p.s)}</small></div><span class="src">${esc(p.from)}</span></div>`).join('')}
  </section>
  </div><div class="col">
  ${SPECIAL.homeCards()}
  <section class="card"><div class="lbl"><span>오늘의 생각</span></div><p class="quote">${esc(th[0])}<cite>${esc(th[1])}</cite></p></section>
  ${nx?`<button class="btn wide" id="nextRead">이어 읽기 · ${esc(chNo(nx))} ${esc(nx.t)}</button>`:'<section class="card"><p class="help"><b>책을 다 읽었다.</b> 이제 카드로 꼭꼭 씹고 실천을 이어 간다.</p></section>'}
  </div></div>`;
  v.querySelectorAll('.part').forEach(b=>b.onclick=()=>{VIEW='read';LID=null;render();setTimeout(()=>$('bk'+b.dataset.b)?.scrollIntoView({behavior:'smooth'}),30);});
  let iT;$('intentIn').oninput=e=>{clearTimeout(iT);iT=setTimeout(()=>{day().intent=e.target.value.trim();touch();},600);};
  $('intentIn').onchange=()=>render();
  $('intentDone')&&($('intentDone').onclick=()=>{const r=day();r.intentDone=!r.intentDone;touch();render();if(r.intentDone)toast('해냈다');});
  v.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{toggleP(b.dataset.p);render();});
  SPECIAL.bindHome(v);
  $('nextRead')&&($('nextRead').onclick=()=>go('read',nx.id));
}

/* ---------- 읽기 ---------- */
function rRead(v){if(LID){rLesson(v,LID);return;}
  v.innerHTML=`<div style="max-width:760px;margin:0 auto">
  <section class="card"><h2>${CFG.readTitle}</h2><p class="help">${CFG.readHelp}</p>
   <div style="margin-top:12px">${bar(readCount()/L.length)}</div><p class="help" style="margin-top:6px">${readCount()} / ${L.length}장 읽음</p></section>
  ${BOOKS.map(B=>{const ls=L.filter(l=>l.b===B.n);if(!ls.length)return '';return `<div class="bookttl" id="bk${B.n}">${esc(B.t)}</div><p class="booksub">${esc(B.s)}</p>${ls.map((l,i)=>`<button class="lsn" data-l="${l.id}"><span class="no">${ls.length>1?i+1:'·'}</span><span class="tt">${esc(l.t)}<small>${esc(l.one)}</small></span>${ST().read[l.id]?'<span class="rd">읽음</span>':''}</button>`).join('')}`;}).join('')}
  </div>`;
  v.querySelectorAll('.lsn').forEach(b=>b.onclick=()=>go('read',b.dataset.l));}
function rLesson(v,id){const l=L.find(x=>x.id===id);const i=L.indexOf(l);const s=ST();const nt=s.notes[id]||{};const prev=L[i-1],next=L[i+1];
  v.innerHTML=`<article class="reader">
   <div class="head"><button class="btn ghost sm" id="back">← 목차</button><div class="crumb" style="margin-top:10px">${esc(BOOKS[l.b].t)}</div><h1>${esc(l.t)}</h1><p class="one">${esc(l.one)}</p></div>
   <section class="card body">${l.body}</section>
   ${(l.pics||[]).length?`<section class="card"><div class="lbl"><span>${CFG.picsLabel}</span></div>${l.pics.map(p=>{const [a,...b]=p.split(' · ');return `<div class="pic"><span class="ic">✦</span><div><b>${esc(a)}</b>${b.length?` · ${esc(b.join(' · '))}`:''}</div></div>`;}).join('')}</section>`:''}
   ${l.note?`<section class="card note"><div class="lbl"><span>${CFG.noteLabel}</span></div><p>${esc(l.note)}</p></section>`:''}
   <section class="card"><div class="lbl"><span>꼭꼭 씹기 · 질문</span><span class="help" id="saved"></span></div>
    ${l.q.map((q,qi)=>`<div class="qa"><b>${esc(q)}</b><textarea class="txt" data-q="q${qi}" rows="2" placeholder="내 생각을 적는다">${esc(nt['q'+qi]||'')}</textarea></div>`).join('')}
    <div class="qa"><b>이 장에서 남은 한 줄</b><textarea class="txt" data-q="my" rows="2" placeholder="내 말로 다시 쓴 핵심">${esc(nt.my||'')}</textarea></div></section>
   <section class="card actcard"><div class="lbl"><span>이 장의 실천</span></div><p style="margin:0 0 10px">${esc(l.act)}</p><button class="btn acc2 sm" id="toIntent">오늘 할 한 가지로 정하기</button></section>
   <button class="btn ${s.read[id]?'':'pri'} wide" id="readBtn">${s.read[id]?'읽음으로 표시됨 · 취소':'다 읽었다'}</button>
   <div class="navrow">${prev?`<button class="btn sm" data-go="${prev.id}">← 이전 장</button>`:'<span></span>'}${next?`<button class="btn sm" data-go="${next.id}">다음 장 →</button>`:'<span></span>'}</div>
  </article>`;
  $('back').onclick=()=>go('read');
  let qT;v.querySelectorAll('textarea[data-q]').forEach(ta=>ta.oninput=()=>{clearTimeout(qT);qT=setTimeout(()=>{s.notes[id]=Object.assign({},s.notes[id],{[ta.dataset.q]:ta.value,t:Date.now()});touch();$('saved').textContent='저장됨';},700);});
  $('readBtn').onclick=()=>{if(s.read[id])delete s.read[id];else s.read[id]=Date.now();touch();if(s.read[id]&&next){toast('읽었다. 다음 장으로');go('read',next.id);}else render();};
  $('toIntent').onclick=()=>{day().intent=l.act;day().intentDone=false;touch();toast('오늘 탭에 담았다');};
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go('read',b.dataset.go));
}

/* ---------- 카드 ---------- */
let QI=null,QSHOW=false,QF='all',QPICK=null;
function rQA(v){const s=ST();const list=CARDS.map((c,i)=>Object.assign({i},c)).filter(c=>QF==='all'||(QF==='ok'?s.cards[c.i]?.ok:!s.cards[c.i]?.ok));
  if(QI===null||!CARDS[QI])QI=list.length?list[0].i:0;const c=CARDS[QI];const cs=s.cards[QI]||{};const ch=L.find(l=>l.id===c.ch);
  v.innerHTML=`<div class="page"><div class="col">
  <section class="card"><div class="lbl"><span>${CFG.cardHead}</span><span class="tag ${cs.ok?'ok':'no'}">${cs.ok?'이해했다':'아직'}</span></div>
   <div class="flash"><div class="qq">${esc(c.q)}</div>
    ${SPECIAL.cardGuess?SPECIAL.cardGuess(c,cs):`<div class="qa"><b style="font-size:13px;color:var(--mute)">먼저 내 생각을 써 본다</b><textarea class="txt" id="mine" rows="3" placeholder="책의 답을 보기 전에 써 본다">${esc(cs.mine||'')}</textarea></div>`}
    ${QSHOW?`<div class="aa">${esc(c.a)}</div>${ch?`<button class="btn ghost sm" id="toCh" style="align-self:flex-start">관련 장 · ${esc(ch.t)} →</button>`:''}`:`<button class="btn" id="showA">책의 답 보기</button>`}
   </div>
   <div class="row" style="margin-top:12px"><button class="btn ${cs.ok?'acc2':''}" id="okBtn">${cs.ok?'이해했다 ✓':'이제 이해했다'}</button><button class="btn" id="nextQ">다음 카드</button><button class="btn ghost" id="randQ">무작위</button></div>
  </section>
  <p class="help" style="padding:0 4px">${CFG.cardHelp}</p>
  </div><div class="col">
  <section class="card"><div class="lbl"><span>카드 ${CARDS.length}장</span><span>${knownCards()} 이해</span></div>
   <div class="row" style="margin-bottom:8px">${[['all','전체'],['no','아직'],['ok','이해함']].map(([k,t])=>`<button class="chip ${QF===k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div>
   <div class="cardlist">${list.map(x=>`<button data-i="${x.i}" style="${x.i===QI?'font-weight:700':''}"><span class="t">${esc(x.q)}</span>${s.cards[x.i]?.ok?'<span class="tag ok">✓</span>':''}</button>`).join('')||'<p class="help">해당하는 카드가 없다.</p>'}</div></section>
  </div></div>`;
  let mT;$('mine')&&($('mine').oninput=e=>{clearTimeout(mT);mT=setTimeout(()=>{s.cards[QI]=Object.assign({},s.cards[QI],{mine:e.target.value});touch();},700);});
  $('showA')&&($('showA').onclick=()=>{QSHOW=true;render();});
  $('toCh')&&($('toCh').onclick=()=>go('read',ch.id));
  $('okBtn').onclick=()=>{s.cards[QI]=Object.assign({},s.cards[QI],{ok:!cs.ok,t:Date.now()});touch();render();};
  const moveTo=i=>{QI=i;QSHOW=false;QPICK=null;render();};
  $('nextQ').onclick=()=>{const idx=list.findIndex(x=>x.i===QI);const nx=list[(idx+1)%Math.max(1,list.length)];moveTo(nx?nx.i:0);};
  $('randQ').onclick=()=>{const pool=CARDS.map((_,i)=>i).filter(i=>!s.cards[i]?.ok);const arr=pool.length?pool:CARDS.map((_,i)=>i);moveTo(arr[Math.floor(Math.random()*arr.length)]);};
  v.querySelectorAll('.cardlist [data-i]').forEach(b=>b.onclick=()=>moveTo(+b.dataset.i));
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{QF=b.dataset.f;QI=null;QSHOW=false;QPICK=null;render();});
  SPECIAL.bindCard&&SPECIAL.bindCard(v,c,cs);
}

/* ---------- 기록 ---------- */
let CALM=null;
function rLog(v){const s=ST(),t=today();if(!CALM)CALM=t.slice(0,7);const [Y,M]=CALM.split('-').map(Number);const off=new Date(Y,M-1,1).getDay(),dim=new Date(Y,M,0).getDate();
  let cal='';['일','월','화','수','목','금','토'].forEach(h=>cal+=`<div class="h">${h}</div>`);for(let i=0;i<off;i++)cal+='<div></div>';
  const G=logs();
  for(let d=1;d<=dim;d++){const k=`${CALM}-${pad(d)}`;const n=(s.days[k]?.p||[]).length+Object.values(s.days[k]?.h||{}).filter(v=>v==='done'||v==='two'||v==='kept').length+G.filter(g=>g.d===k).length;cal+=`<div class="d ${n>=5?'l3':n>=3?'l2':n>=1?'l1':''} ${k===t?'today':''}" title="${k} ${n}">${d}</div>`;}
  const notes=Object.entries(s.notes).filter(([id,n])=>n.my||n.q0||n.q1).sort((a,b)=>(b[1].t||0)-(a[1].t||0));
  v.innerHTML=`<div class="page"><div class="col">
  <section class="card"><div class="lbl"><button class="btn ghost sm" id="cP" aria-label="이전 달">‹</button><span style="color:var(--ink);font-size:14px">${Y}년 ${M}월</span><button class="btn ghost sm" id="cN" aria-label="다음 달">›</button></div><div class="cal">${cal}</div>
   <p class="help" style="margin-top:8px">진할수록 그날 실천과 기록이 많다. 연속 ${streak()}일.</p></section>
  ${SPECIAL.logCards()}
  <section class="card"><div class="lbl"><span>백업</span></div><p class="help" style="margin-bottom:8px">이 판은 기록을 이 기기에만 저장한다. 다른 기기로 옮길 때는 백업 복사 → 그 기기에서 복원.</p>
   <div class="row"><button class="btn sm" id="bkC">백업 복사</button><button class="btn sm" id="bkR">복원</button></div><textarea class="txt" id="bkT" rows="3" hidden placeholder="백업 글자를 붙여넣고 복원을 다시 누른다" style="margin-top:8px"></textarea></section>
  </div><div class="col">
  ${SPECIAL.logList()}
  <section class="card"><div class="lbl"><span>내가 꼭꼭 씹은 장</span><span>${notes.length}</span></div>${notes.length?notes.map(([id,n])=>{const l=L.find(x=>x.id===id);return l?`<div class="entry"><div class="meta"><span>${esc(l.t)}</span><button class="x" data-open="${id}">열기</button></div><div class="tx">${esc(n.my||n.q0||n.q1)}</div></div>`:'';}).join(''):'<p class="help">읽기에서 질문에 답하면 여기 모인다.</p>'}</section>
  </div></div>`;
  $('cP').onclick=()=>{CALM=ymd(new Date(Y,M-2,1)).slice(0,7);render();};$('cN').onclick=()=>{CALM=ymd(new Date(Y,M,1)).slice(0,7);render();};
  v.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go('read',b.dataset.open));
  v.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>armed(b,'정말?',()=>{delLog(b.dataset.gdel);render();}));
  $('bkC').onclick=async()=>{const tx=JSON.stringify(DOCS);try{await navigator.clipboard.writeText(tx);toast('백업을 복사했다');}catch(e){const ta=$('bkT');ta.hidden=false;ta.value=tx;ta.select();toast('선택된 글자를 직접 복사한다');}};
  $('bkR').onclick=()=>{const ta=$('bkT');if(ta.hidden||!ta.value.trim()){ta.hidden=false;ta.value='';ta.focus();return;}try{const r=JSON.parse(ta.value);if(!r.state)throw 0;for(const k in r){DOCS[k]=r[k];touch(k);}DOCS.state=Object.assign(defState(),DOCS.state);render();toast('복원했다');}catch(e){toast('백업 글자를 읽지 못했다');}};
  SPECIAL.bindLog&&SPECIAL.bindLog(v);
}
document.addEventListener('dblclick',e=>{if(!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))e.preventDefault();},{passive:false});
/* ---------- 아주 작은 습관 · 습관 공방, 충동 버튼, 점수표, 계약서 ---------- */
const HS=()=>{const s=ST();if(!Array.isArray(s.habits))s.habits=[];return s.habits;};
const active=()=>HS().filter(h=>!h.arch);
const hget=id=>HS().find(h=>h.id===id);
const hv=(id,d=today())=>ST().days[d]?.h?.[id]||'';
function setH(id,v,d=today()){const r=day(d);if(!r.h)r.h={};if(r.h[id]===v)delete r.h[id];else r.h[id]=v;touch();}
const okv=v=>v==='done'||v==='two'||v==='kept';
function hStreak(h){let n=0,d=today();if(!okv(hv(h.id,d)))d=addD(d,-1);while(d>=h.created&&okv(hv(h.id,d))){n++;d=addD(d,-1);}return n;}
function votes(h){let n=0;for(const d in ST().days)if(okv(ST().days[d]?.h?.[h.id]))n++;return n;}
function missed(h,d){if(d<h.created||d>=today())return false;const v=hv(h.id,d);return h.kind==='break'?v==='slip':!okv(v);}
function hWarn(h){const y=addD(today(),-1),y2=addD(today(),-2);if(okv(hv(h.id)))return '';
  if(missed(h,y)&&missed(h,y2))return '두 번 연속 놓쳤다. 오늘은 2분짜리라도 한다';
  if(missed(h,y))return h.kind==='break'?'어제 넘어졌다. 두 번 연속은 안 된다':'어제 놓쳤다. 두 번 연속은 안 된다';return '';}
const LAWN={obvious:'분명하게',attractive:'매력적으로',easy:'쉽게',satisfying:'만족스럽게',core:'기초·정체성'};

/* 습관 편집 */
const BF=[['name','습관 이름','예: 영단어 30개'],['identity','되고 싶은 나','나는 ___ 사람이다'],['when','실행 의도','나는 [시간]에 [장소]에서 한다'],['stack','습관 쌓기','[지금 하는 습관]을 한 뒤에'],['two','2분 버전','하기 싫은 날 최소한 이것만'],['env','환경 설계','눈에 보이게, 손 닿게 둘 것'],['bundle','유혹 묶기','좋아하는 것과 함께 묶기'],['reward','즉각 보상','끝나면 바로 주는 작은 보상']];
const XF=[['name','끊을 습관','예: 손톱 뜯기'],['cue','신호','언제·어디서·무슨 기분일 때 시작되나'],['why','진짜 원하는 것','이 습관으로 채우려는 마음(지루함, 불안, 쉼…)'],['invisible','보이지 않게','신호를 치운다 (1법칙 뒤집기)'],['unattractive','매력 없게','끊으면 얻는 것, 다시 보기 (2법칙 뒤집기)'],['difficult','어렵게','마찰을 늘리고 미리 막는다 (3법칙 뒤집기)'],['unsatisfying','불만족스럽게','책임 파트너·계약 (4법칙 뒤집기)'],['replace','대신 할 것','같은 마음을 채우는 좋은 행동']];
function editHabit(kind,id,preset){const h=id?hget(id):Object.assign({kind},preset||{});const F=kind==='break'?XF:BF;
  dialog(`<h3>${id?'습관 고치기':kind==='break'?'나쁜 습관 끊기':'좋은 습관 만들기'}</h3>
   <p class="help" style="margin-bottom:12px">${kind==='break'?'네 법칙을 뒤집는다. 보이지 않게, 매력 없게, 어렵게, 불만족스럽게.':'네 법칙을 적용한다. 분명하게, 매력적으로, 쉽게, 만족스럽게.'} 다 안 채워도 된다.</p>
   ${F.map(([k,l,ph])=>`<div class="fld"><label for="f_${k}">${l}</label>${k==='name'?`<input class="txt" id="f_${k}" maxlength="40" placeholder="${esc(ph)}" value="${esc(h[k]||'')}">`:`<textarea class="txt" id="f_${k}" rows="2" style="min-height:52px" placeholder="${esc(ph)}">${esc(h[k]||'')}</textarea>`}</div>`).join('')}
   <div class="acts2">${id?`<button class="btn ghost" id="hArch">${h.arch?'다시 쓰기':'보관(마스터함)'}</button><button class="btn ghost" id="hDel">지우기</button>`:''}<button class="btn ghost" data-close>취소</button><button class="btn pri" id="hSave">저장</button></div>`,ov=>{
   $('hSave').onclick=()=>{const o={};F.forEach(([k])=>o[k]=$('f_'+k).value.trim());if(!o.name){toast('이름을 적는다');return;}
     if(id)Object.assign(h,o);else HS().push(Object.assign({id:uid(),kind,created:today()},o));touch();closeDialog();render();toast(id?'고쳤다':kind==='break'?'끊기 계획을 세웠다':'새 습관을 세웠다');};
   $('hArch')&&($('hArch').onclick=()=>{h.arch=!h.arch;touch();closeDialog();render();});
   $('hDel')&&($('hDel').onclick=e=>armed(e.target,'정말 지운다',()=>{const i=HS().indexOf(h);HS().splice(i,1);touch();closeDialog();render();}));});}

/* 충동이 왔을 때 */
let UT=null;
function urgeEnd(){URGE_ON=false;clearInterval(UT);applyWake();}
function urge(id){const h=hget(id);clearInterval(UT);let left=120;URGE_ON=true;applyWake();
  const plan=[['진짜 원하는 것',h.why],['대신 할 것',h.replace],['보이지 않게',h.invisible],['매력 없게',h.unattractive],['어렵게',h.difficult],['불만족스럽게',h.unsatisfying]].filter(x=>x[1]);
  dialog(`<h3>${esc(h.name)} · 충동이 왔다</h3><p class="help">충동은 파도처럼 올라왔다 내려간다. 2분만 버티고 내가 세운 계획을 다시 본다.</p>${wakeMode()==='off'?'<p class="help" style="margin-top:4px">화면 켜두기가 꺼져 있다. 위쪽 버튼에서 켤 수 있다.</p>':''}
   <div class="timer" id="uT">2:00</div>
   <div class="plan">${plan.length?plan.map(([a,b])=>`<div><b>${a}</b>${esc(b)}</div>`).join(''):'<div>아직 계획이 비어 있다. 실천 탭에서 이 습관을 눌러 채운다.</div>'}${h.cue?`<div><b>신호</b>${esc(h.cue)}</div>`:''}</div>
   <div class="acts2"><button class="btn" id="uLose">졌다</button><button class="btn acc2" id="uWin">버텼다</button></div>`,()=>{
   UT=setInterval(()=>{left--;const e=$('uT');if(!e){urgeEnd();return;}e.textContent=`${Math.floor(Math.max(0,left)/60)}:${pad(Math.max(0,left)%60)}`;if(left<=0){clearInterval(UT);e.textContent='지나갔다';}},1000);
   $('uWin').onclick=()=>{urgeEnd();addLog({id:uid(),d:today(),t:Date.now(),hid:id,kind:'urge',res:true});closeDialog();render();toast('버텼다. 정체성에 한 표');};
   $('uLose').onclick=()=>{urgeEnd();addLog({id:uid(),d:today(),t:Date.now(),hid:id,kind:'urge',res:false});closeDialog();slip(id);};});}
function slip(id){const h=hget(id);if(hv(id)!=='slip')setH(id,'slip');
  dialog(`<h3>넘어졌다 · 괜찮다</h3><p class="help" style="margin-bottom:10px">한 번은 사고다. 두 번 연속이 새 습관의 시작이다. 무엇이 방아쇠였는지만 적고, 다음 계획을 하나 고친다.</p>
   <div class="fld"><label for="sCue">무엇이 신호였나</label><textarea class="txt" id="sCue" rows="2" style="min-height:52px" placeholder="예: 밤 11시 침대, 단톡 알림 보고 폰을 집었다"></textarea></div>
   <div class="fld"><label for="sFix">다음엔 무엇을 바꾸나</label><textarea class="txt" id="sFix" rows="2" style="min-height:52px" placeholder="예: 충전기를 거실로 옮긴다"></textarea></div>
   <div class="acts2"><button class="btn ghost" data-close>건너뛰기</button><button class="btn pri" id="sSave">적는다</button></div>`,()=>{
   $('sSave').onclick=()=>{const c=$('sCue').value.trim(),f=$('sFix').value.trim();addLog({id:uid(),d:today(),t:Date.now(),hid:id,kind:'slip',text:c,fix:f});
     if(f&&h&&!h.difficult)h.difficult=f;touch();closeDialog();render();toast('적었다. 내일은 다시 시작');};});
  render();}

function habitRow(h,mini){const v=hv(h.id),w=hWarn(h),st=hStreak(h);
  const sub=h.kind==='break'?(h.replace?'대신: '+h.replace:h.cue?'신호: '+h.cue:''):[h.stack?h.stack+' 뒤에':'',h.when].filter(Boolean).join(' · ');
  return `<div class="hrow"><div class="tx"><b><span class="kind ${h.kind==='break'?'x':'b'}">${h.kind==='break'?'끊기':'만들기'}</span>${esc(h.name)}</b>
   ${h.identity&&!mini?`<small>${esc(h.identity)}</small>`:''}${sub?`<small>${esc(sub)}</small>`:''}
   ${w?`<span class="warn">${w}</span>`:st?`<span class="streak">${st}일 연속</span>`:''}</div>
   <div class="hbtns">${h.kind==='break'?`<button class="hb ${v==='kept'?'on done':''}" data-hk="${h.id}" data-hval="kept">지켰다</button><button class="hb ${v==='slip'?'on slip':''}" data-hk="${h.id}" data-hval="slip">넘어짐</button>`
    :`<button class="hb ${v==='two'?'on two':''}" data-hk="${h.id}" data-hval="two" title="2분 버전만 했다">2분</button><button class="hb ${v==='done'?'on done':''}" data-hk="${h.id}" data-hval="done">했다</button>`}</div></div>`;}
function bindRows(v){v.querySelectorAll('[data-hk]').forEach(b=>b.onclick=()=>{const id=b.dataset.hk,val=b.dataset.hval;
  if(val==='slip'&&hv(id)!=='slip'){slip(id);return;}setH(id,val);render();
  if(okv(hv(id))){const h=hget(id);toast(h.kind==='break'?'지켰다. 오늘 하루 승리':val==='two'?'2분이라도 했다. 연속이 이어진다':'정체성에 한 표. 지금까지 '+votes(h)+'표');}});}

/* 점수표·계약서 */
let SCD='';
const SPECIAL={
  homeTop(){const A=active();const br=A.filter(h=>h.kind==='break');const done=A.filter(h=>okv(hv(h.id))).length;
    return `<section class="card"><div class="lbl"><span>내 습관 · 오늘</span><span>${done}/${A.length}</span></div>
     ${A.length?A.map(h=>habitRow(h,true)).join(''):`<p class="help" style="margin-bottom:10px">아직 습관이 없다. 만들 좋은 습관 하나, 끊을 나쁜 습관 하나부터 세운다.</p><div class="row"><button class="btn sm pri" data-new="build">+ 좋은 습관</button><button class="btn sm" data-new="break">+ 끊을 습관</button></div>`}
     ${A.length?`<p class="help" style="margin-top:8px">하기 싫은 날은 2분 버전만 해도 연속이 이어진다. 놓쳐도 두 번 연속만은 피한다.</p>`:''}</section>
     ${br.length?`<section class="card"><div class="lbl"><span>충동이 왔다</span><span>오늘 버팀 ${logs().filter(g=>g.kind==='urge'&&g.res&&g.d===today()).length}</span></div><div style="display:grid;gap:8px">${br.map(h=>`<button class="urge" data-urge="${h.id}">${esc(h.name)} · 지금 하고 싶다</button>`).join('')}</div></section>`:''}`;},
  homeCards(){return '';},
  bindHome(v){bindRows(v);v.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>editHabit(b.dataset.new));v.querySelectorAll('[data-urge]').forEach(b=>b.onclick=()=>urge(b.dataset.urge));},
  practiceTop(){const A=HS();
    return `<section class="card"><h2>습관 공방</h2><p class="help" style="margin-bottom:10px">습관을 누르면 계획을 고친다. 몸에 붙은 습관은 보관하고 다음 습관으로 넘어간다.</p>
     <div class="row" style="margin-bottom:10px"><button class="btn sm pri" data-new="build">+ 좋은 습관 만들기</button><button class="btn sm" data-new="break">+ 나쁜 습관 끊기</button></div>
     ${A.length?A.map(h=>`<button class="lsn" data-edit="${h.id}" style="${h.arch?'opacity:.55':''}"><span class="tt"><span class="kind ${h.kind==='break'?'x':'b'}">${h.kind==='break'?'끊기':'만들기'}</span>${esc(h.name)}<small>${h.arch?'보관됨 · ':''}${h.kind==='break'?'지킨 날':'던진 표'} ${votes(h)} · ${hStreak(h)}일 연속</small></span><span class="rd" style="color:var(--mute)">고치기</span></button>`).join(''):''}
     <div class="sublbl">자주 끊는 습관에서 고르기</div><div class="row">${PRESETS.map((p,i)=>`<button class="chip" data-px="${i}">${esc(p.name)}</button>`).join('')}</div>
     <div class="sublbl">만들 습관에서 고르기</div><div class="row">${BUILDS.map((p,i)=>`<button class="chip" data-pb="${i}">${esc(p.name)}</button>`).join('')}</div></section>`;},
  practiceCards(){const s=ST();const sc=Array.isArray(s.score)?s.score:[];const ct=s.contract||{};
    return `<section class="card"><h2>네 법칙 한눈에</h2><p class="help" style="margin-bottom:10px">좋은 습관은 법칙대로, 나쁜 습관은 뒤집어서.</p>
     ${LAWS.map(l=>`<details class="prin"><summary><span>${l.n}법칙 · ${esc(l.t)}</span><small>${esc(l.stage)} · 뒤집으면 ${esc(l.inv)}</small></summary>
      <div class="sublbl" style="margin-top:0">만들 때</div><ul>${l.build.map(x=>`<li><b>${x.c} ${esc(x.t)}</b> · ${esc(x.s)}</li>`).join('')}</ul>
      <div class="sublbl">끊을 때</div><ul>${l.brk.map(x=>`<li><b>${x.c} ${esc(x.t)}</b> · ${esc(x.s)}</li>`).join('')}</ul>
      <p class="help" style="margin-bottom:12px">${esc(l.q)}<br>${esc(l.qb)}</p></details>`).join('')}</section>
     <section class="card"><h2>습관 점수표</h2><p class="help" style="margin-bottom:8px">하루를 순서대로 적고 좋은(+)·중립(=)·나쁜(−)을 붙인다. 판단보다 알아차림이 먼저다.</p>
      ${sc.map(x=>`<div class="hrow" style="padding:7px 0"><div class="tx" style="font-size:14px">${esc(x.t)}</div><div class="sv">${[['+','p'],['=','e'],['−','m']].map(([g,c])=>`<button class="${x.v===g?'on '+c:''}" data-sv="${x.id}" data-g="${g}" aria-label="${esc(x.t)} ${g}">${g}</button>`).join('')}<button class="x" data-sdel="${x.id}" aria-label="빼기">×</button></div></div>`).join('')}
      <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input class="txt" id="scIn" maxlength="50" placeholder="예: 일어나서 바로 폰 확인" value="${esc(SCD)}"><button class="btn sm" id="scAdd" style="white-space:nowrap;flex:none">더하기</button></div>
      ${sc.length?`<p class="help" style="margin-top:6px">+ ${sc.filter(x=>x.v==='+').length} · = ${sc.filter(x=>x.v==='=').length} · − ${sc.filter(x=>x.v==='−').length}</p>`:''}</section>
     <section class="card"><h2>습관 계약서</h2><p class="help" style="margin-bottom:10px">약속과 어겼을 때의 대가를 적고, 지켜볼 사람 한 명에게 알린다. 남이 보면 넘어지기 아프다.</p>
      <div class="fld"><label for="ctA">나는 이렇게 하겠다</label><textarea class="txt" id="ctA" rows="2" style="min-height:52px" placeholder="예: 평일 밤 11시 이후 폰은 거실 충전기에 둔다">${esc(ct.a||'')}</textarea></div>
      <div class="fld"><label for="ctB">어기면</label><input class="txt" id="ctB" maxlength="80" placeholder="예: 파트너에게 편의점 음료를 산다" value="${esc(ct.b||'')}"></div>
      <div class="fld"><label for="ctC">책임 파트너</label><input class="txt" id="ctC" maxlength="40" placeholder="예: 형, 찬양팀 친구" value="${esc(ct.c||'')}"></div>
      <div class="row"><button class="btn sm ${ct.signed?'acc2':'pri'}" id="ctSign">${ct.signed?'서명함 · '+ct.signed.slice(5).replace('-','/'):'서명한다'}</button>${ct.a?`<button class="btn sm" id="ctCopy">파트너에게 보낼 글 복사</button>`:''}</div></section>`;},
  bindPractice(v){const s=ST();
    v.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>editHabit(b.dataset.new));
    v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const h=hget(b.dataset.edit);editHabit(h.kind,h.id);});
    v.querySelectorAll('[data-px]').forEach(b=>b.onclick=()=>editHabit('break',null,PRESETS[+b.dataset.px]));
    v.querySelectorAll('[data-pb]').forEach(b=>b.onclick=()=>editHabit('build',null,BUILDS[+b.dataset.pb]));
    const keep=()=>{const y=window.scrollY;render();window.scrollTo(0,y);};
    if(!Array.isArray(s.score))s.score=[];
    $('scIn').oninput=e=>SCD=e.target.value;
    const add=()=>{const t=SCD.trim();if(!t)return;s.score.push({id:uid(),t,v:''});SCD='';touch();keep();setTimeout(()=>$('scIn')?.focus(),0);};
    $('scAdd').onclick=add;$('scIn').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();add();}};
    v.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{const x=s.score.find(y=>y.id===b.dataset.sv);x.v=x.v===b.dataset.g?'':b.dataset.g;touch();keep();});
    v.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{s.score=s.score.filter(y=>y.id!==b.dataset.sdel);touch();keep();});
    let cT;['ctA','ctB','ctC'].forEach((id,i)=>$(id).oninput=e=>{clearTimeout(cT);cT=setTimeout(()=>{s.contract=Object.assign({},s.contract,{['abc'[i]]:e.target.value.trim()});touch();},600);});
    $('ctSign').onclick=()=>{const c=Object.assign({},s.contract,{a:$('ctA').value.trim(),b:$('ctB').value.trim(),c:$('ctC').value.trim()});if(!c.a){toast('약속부터 적는다');return;}c.signed=c.signed?null:today();s.contract=c;touch();keep();};
    $('ctCopy')&&($('ctCopy').onclick=async()=>{const c=s.contract;const tx=`[습관 계약서]\n나는 이렇게 하겠다: ${c.a}\n어기면: ${c.b||'-'}\n지켜봐 줘. 어기면 말해 줘.`;try{await navigator.clipboard.writeText(tx);toast('복사했다. 파트너에게 보낸다');}catch(e){toast('복사가 안 됐다. 직접 옮겨 적는다');}});
  },
  cardGuess(c,cs){const pick=QPICK;const ks=['obvious','attractive','easy','satisfying','core'];
    return `<div class="qa"><b style="font-size:13px;color:var(--mute)">어떤 법칙으로 풀까</b><div class="pgrid five">${ks.map(k=>{let cl='';if(pick){if(k===c.law)cl='right';else if(k===pick)cl='wrong';}
      return `<button class="${cl}" data-g="${k}" ${pick?'disabled':''}>${LAWN[k]}</button>`;}).join('')}</div>
      ${pick?`<p class="help" style="margin-top:4px"><b>${pick===c.law?'맞혔다.':'정답은 '+LAWN[c.law]+'.'}</b> 이 카드 ${cs.right||0}번 맞힘 · ${cs.wrong||0}번 틀림</p>`:''}</div>`;},
  bindCard(v,c){v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{if(QPICK)return;QPICK=b.dataset.g;const s=ST();const o=Object.assign({},s.cards[QI]);
    if(QPICK===c.law)o.right=(o.right||0)+1;else o.wrong=(o.wrong||0)+1;o.t=Date.now();s.cards[QI]=o;touch();QSHOW=true;render();});},
  logCards(){const A=HS().filter(h=>!h.arch);const G=logs();const ur=G.filter(g=>g.kind==='urge');const t=today();
    return `<section class="card"><div class="lbl"><span>습관별 최근 14일</span><span>초록 했다 · 파랑 2분 · 빨강 넘어짐</span></div>
     ${A.length?A.map(h=>{let dots='';for(let i=13;i>=0;i--){const d=addD(t,-i);const v=hv(h.id,d);dots+=`<i class="${v==='done'||v==='kept'?'ok':v==='two'?'two':v==='slip'?'fail':''}" title="${d}"></i>`;}
      return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="h" style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">${esc(h.name)}</b><span class="help">${h.kind==='break'?'지킨 날':'표'} ${votes(h)} · ${hStreak(h)}일 연속</span></div><div class="dots14">${dots}</div></div>`;}).join(''):'<p class="help">실천 탭 습관 공방에서 습관을 세우면 여기 쌓인다.</p>'}</section>
     <section class="card"><div class="lbl"><span>충동 기록</span><span>${ur.length}번</span></div><div class="stat6"><div>버텼다<b>${ur.filter(g=>g.res).length}</b></div><div>졌다<b>${ur.filter(g=>!g.res).length}</b></div><div>버틴 비율<b>${ur.length?Math.round(ur.filter(g=>g.res).length/ur.length*100)+'%':'-'}</b></div></div></section>`;},
  logList(){const G=logs();const nm=id=>hget(id)?.name||'지운 습관';
    return `<section class="card"><div class="lbl"><span>충동·넘어짐 일지</span><span>${G.length}</span></div>
    ${G.length?G.slice(0,60).map(g=>`<div class="entry"><div class="meta"><span>${g.d.slice(5).replace('-','/')} · ${esc(nm(g.hid))} · ${g.kind==='urge'?(g.res?'충동을 버텼다':'충동에 졌다'):'넘어졌다'}</span><button class="x" data-gdel="${g.id}">지우기</button></div>${g.text?`<div class="tx">신호: ${esc(g.text)}</div>`:''}${g.fix?`<div class="tx">바꿀 것: ${esc(g.fix)}</div>`:''}</div>`).join(''):'<p class="help">충동 버튼이나 넘어짐을 누르면 여기 쌓인다. 방아쇠가 보이기 시작한다.</p>'}</section>`;}

let WL=null,NSV=null;
const WMODES=[['all','앱 쓰는 내내'],['urge','충동 타이머 동안만'],['off','끔']];
function wakeMode(){try{return localStorage.getItem(CFG.key+':wake')||'all';}catch(e){return 'all';}}
function setWake(m){try{localStorage.setItem(CFG.key+':wake',m);}catch(e){}applyWake();}
let URGE_ON=false;
function wantWake(){const m=wakeMode();return document.visibilityState==='visible'&&(m==='all'||(m==='urge'&&URGE_ON));}
function startNoSleep(){try{if(!NSV){NSV=document.createElement('video');NSV.setAttribute('playsinline','');NSV.setAttribute('webkit-playsinline','');NSV.muted=true;NSV.loop=true;NSV.src=NOSLEEP_SRC;NSV.setAttribute('aria-hidden','true');NSV.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;bottom:0';document.body.appendChild(NSV);}const p=NSV.play();p&&p.then(()=>{if(!wantWake())NSV.pause();}).catch(()=>{});}catch(e){}}
function stopNoSleep(){try{NSV&&NSV.pause();}catch(e){}}
async function applyWake(){
  if(wantWake()){startNoSleep();
    if('wakeLock' in navigator&&!WL){try{WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null;updWakeUI();if(wantWake())setTimeout(applyWake,500);});}catch(e){WL=null;}}
  }else{if(WL){try{await WL.release();}catch(e){}WL=null;}stopNoSleep();}
  updWakeUI();}
function updWakeUI(){const b=$('wakeBtn');if(!b)return;const m=wakeMode();b.textContent=m==='off'?'화면 자동 꺼짐':m==='urge'?'화면 켜둠 · 타이머':'화면 켜둠';b.setAttribute('aria-pressed',m!=='off');b.classList.toggle('on',m!=='off');}
$('wakeBtn').onclick=()=>{const m=wakeMode();dialog(`<h3>화면 켜두기</h3><p class="help" style="margin-bottom:12px">아이폰·맥이 저절로 꺼지지 않게 한다. 이 기기에만 적용된다.</p>
  <div class="wakeseg">${WMODES.map(([k,l])=>`<button class="chip ${m===k?'on':''}" data-wm="${k}">${l}</button>`).join('')}</div>
  <p class="help" style="margin-top:12px">앱 쓰는 내내: 이 화면이 열려 있는 동안 계속 켜 둔다. 다른 앱으로 가면 저절로 풀린다.</p>
  <div class="acts2"><button class="btn pri" data-close>닫기</button></div>`,ov=>ov.querySelectorAll('[data-wm]').forEach(b=>b.onclick=()=>{setWake(b.dataset.wm);ov.querySelectorAll('[data-wm]').forEach(x=>x.classList.toggle('on',x===b));toast(b.dataset.wm==='off'?'이제 화면이 평소처럼 꺼진다':b.dataset.wm==='urge'?'충동 타이머 동안 화면을 켜 둔다':'앱을 쓰는 동안 화면을 켜 둔다');}));};
document.addEventListener('visibilitychange',()=>applyWake());
['pointerdown','keydown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(wantWake()&&(!WL||!NSV||NSV.paused))applyWake();},{passive:true}));
